<head>

    <title>Jang Biochimie | App Premium</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' },
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    },
                    spacing: {
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-top': 'env(safe-area-inset-top)'
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        /* Styles spécifiques pour empêcher le comportement de rebond sur mobile et gérer la 3D */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Flashcards 3D */
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Glassmorphism effet propre */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
        }

        /* Scrollbar élégante pour la zone de contenu */
        #main-scroll::-webkit-scrollbar {
            width: 6px;
        }

        #main-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        #main-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark #main-scroll::-webkit-scrollbar-thumb {
            background: #334155;
        }
    </style>
</head>

                        { "id": 15, "question": "Une banque d'ADNc (complémentaire) est obtenue à partir :", "options": ["Des ARNm (via Reverse Transcriptase)", "De l'ADN génomique", "Des ARNt", "Des protéines"], "correctAnswer": 0, "explanation": "Ne contient que les séquences exprimées (sans introns)." },
                        { "id": 16, "question": "La PCR (Polymerase Chain Reaction) permet :", "options": ["L'amplification exponentielle d'une séquence d'ADN ciblée", "Le séquençage", "La coupure de l'ADN", "La purification de protéines"], "correctAnswer": 0, "explanation": "Kary Mullis (Prix Nobel)." },
                        { "id": 17, "question": "Les 3 étapes d'un cycle de PCR sont :", "options": ["Dénaturation, Hybridation, Élongation", "Hybridation, Dénaturation, Élongation", "Élongation, Dénaturation, Hybridation", "Fusion, Coupure, Collage"], "correctAnswer": 0, "explanation": "95°C -> 50-60°C -> 72°C." },
                        { "id": 18, "question": "La Taq Polymérase est utilisée en PCR car :", "options": ["Elle est thermorésistante", "Elle est très rapide", "Elle est humaine", "Elle corrige les erreurs"], "correctAnswer": 0, "explanation": "Elle résiste à l'étape de dénaturation à 95°C (Thermus aquaticus)." },
                        { "id": 19, "question": "Les amorces (primers) de PCR sont :", "options": ["Des oligonucléotides d'ADN simple brin", "Des ARN", "Des protéines", "Des lipides"], "correctAnswer": 0, "explanation": "Délimitent la zone à amplifier. Spécifiques." },
                        { "id": 20, "question": "La RT-PCR (Reverse Transcription PCR) sert à amplifier :", "options": ["De l'ARN", "De l'ADN génomique", "Des protéines", "Des plasmides"], "correctAnswer": 0, "explanation": "L'ARN est d'abord rétrotranscrit en ADNc." },
                        { "id": 21, "question": "La qPCR (PCR quantitative / Temps réel) permet de :", "options": ["Quantifier la quantité initiale d'ADN/ARN", "Séquencer", "Cloner", "Voir la taille"], "correctAnswer": 0, "explanation": "Utilise des sondes fluorescentes (SYBR Green ou TaqMan)." },
                        { "id": 22, "question": "Le Ct (Cycle threshold) en qPCR est :", "options": ["Inversement proportionnel à la quantité initiale de cible", "Proportionnel", "Constant", "Nul"], "correctAnswer": 0, "explanation": "Plus il y a d'ADN au départ, plus le signal apparaît tôt (Ct faible)." },
                        { "id": 23, "question": "Le séquençage de Sanger utilise des :", "options": ["Didésoxynucléotides (ddNTP)", "Ribonucléotides", "Acides aminés", "Enzymes de restriction"], "correctAnswer": 0, "explanation": "Terminaison de chaîne (pas de 3'-OH)." },
                        { "id": 24, "question": "Dans la méthode Sanger, on obtient :", "options": ["Une série de fragments de tailles différentes terminés par un ddNTP marqué", "Un seul fragment", "De l'ARN", "Des protéines"], "correctAnswer": 0, "explanation": "Séparés par électrophorèse capillaire." },
                        { "id": 25, "question": "Le Southern Blot permet de détecter :", "options": ["Une séquence d'ADN spécifique", "Une protéine", "Un ARN", "Un lipide"], "correctAnswer": 0, "explanation": "Transfert d'ADN gel -> membrane + Hybridation sonde." },
                        { "id": 26, "question": "Le Northern Blot permet de détecter :", "options": ["Une séquence d'ARN spécifique", "De l'ADN", "Une protéine", "Un virus"], "correctAnswer": 0, "explanation": "Analyse de l'expression des gènes (ARNm)." },
                        { "id": 27, "question": "Le Western Blot permet de détecter :", "options": ["Une protéine spécifique", "De l'ADN", "De l'ARN", "Un sucre"], "correctAnswer": 0, "explanation": "Utilise des anticorps." },
                        { "id": 28, "question": "Une sonde moléculaire est :", "options": ["Un fragment d'acide nucléique marqué complémentaire de la cible", "Une enzyme", "Un colorant", "Un vecteur"], "correctAnswer": 0, "explanation": "Marquage radioactif ou fluorescent." },
                        { "id": 29, "question": "La stringence d'hybridation augmente avec :", "options": ["La température et la baisse de la force ionique", "Le froid et le sel", "Le pH neutre", "La longueur"], "correctAnswer": 0, "explanation": "Haute stringence = Seuls les appariements parfaits résistent." },
                        { "id": 30, "question": "La température de fusion (Tm) d'une amorce dépend de :", "options": ["Sa longueur et son contenu en GC", "Sa concentration", "L'enzyme utilisée", "Le pH"], "correctAnswer": 0, "explanation": "Règle empirique : 2(A+T) + 4(G+C)." },
                        { "id": 31, "question": "Les puces à ADN (Microarrays) permettent :", "options": ["L'analyse de l'expression de milliers de gènes simultanément", "Le séquençage d'un gène", "La PCR", "L'extraction"], "correctAnswer": 0, "explanation": "Transcriptomique." },
                        { "id": 32, "question": "Le NGS (Next Generation Sequencing) se caractérise par :", "options": ["Le séquençage massif en parallèle (haut débit)", "L'usage de gels", "Une réaction lente", "Un coût élevé par base"], "correctAnswer": 0, "explanation": "Illumina, Ion Torrent..." },
                        { "id": 33, "question": "La phosphatase alcaline est utilisée en clonage pour :", "options": ["Empêcher la recirculation du vecteur (enlève le 5'-P)", "Lier l'insert", "Couper l'ADN", "Ajouter un P"], "correctAnswer": 0, "explanation": "Déphosphorylation des extrémités du plasmide linéarisé." },
                        { "id": 34, "question": "La polynucléotide kinase (PNK) sert à :", "options": ["Ajouter un phosphate en 5' (marquage ou ligation)", "Enlever un phosphate", "Couper l'ADN", "Polymériser"], "correctAnswer": 0, "explanation": "Transfert le gamma-P de l'ATP." },
                        { "id": 35, "question": "La transcriptase inverse (Reverse Transcriptase) est issue de :", "options": ["Rétrovirus", "Bactéries", "Plantes", "Levures"], "correctAnswer": 0, "explanation": "Synthèse d'ADN à partir d'ARN." },
                        { "id": 36, "question": "Un isoschizomère est :", "options": ["Une enzyme de restriction reconnaissant la même séquence qu'une autre", "Une enzyme différente", "Un isomère", "Un plasmide"], "correctAnswer": 0, "explanation": "Ex: SmaI et XmaI." },
                        { "id": 37, "question": "Un RFLP (Restriction Fragment Length Polymorphism) est :", "options": ["Une variation de séquence modifiant un site de restriction", "Une mutation silencieuse", "Une PCR", "Un gène"], "correctAnswer": 0, "explanation": "Marqueur génétique historique." },
                        { "id": 38, "question": "Le SDS (Sodium Dodecyl Sulfate) est utilisé pour :", "options": ["Dénaturer les protéines et les charger négativement", "Extraire l'ADN", "Colorer l'ADN", "Amplifier"], "correctAnswer": 0, "explanation": "En Western Blot (SDS-PAGE) ou extraction." },
                        { "id": 39, "question": "La technique de Sanger utilise un ratio dNTP/ddNTP de :", "options": ["Beaucoup de dNTP, peu de ddNTP", "Beaucoup de ddNTP", "50/50", "Que des ddNTP"], "correctAnswer": 0, "explanation": "Pour avoir des fragments de toutes tailles." },
                        { "id": 40, "question": "Le pyroséquençage détecte :", "options": ["La libération de pyrophosphate (lumière)", "La fluorescence", "Le pH", "La masse"], "correctAnswer": 0, "explanation": "Enzymatique (Luciférase)." },
                        { "id": 41, "question": "Un cosmide est :", "options": ["Un vecteur hybride plasmide/phage (grands inserts)", "Un virus", "Une bactérie", "Une enzyme"], "correctAnswer": 0, "explanation": "Contient les sites cos du phage lambda." },
                        { "id": 42, "question": "Un YAC (Yeast Artificial Chromosome) permet de cloner :", "options": ["De très grands fragments d'ADN (> 100 kb)", "Des petits fragments", "Des protéines", "De l'ARN"], "correctAnswer": 0, "explanation": "Vecteur pour eucaryotes." },
                        { "id": 43, "question": "L'expression hétérologue signifie :", "options": ["Produire une protéine dans un organisme différent de l'origine", "Produire de l'ADN", "Mutagénèse", "Clonage"], "correctAnswer": 0, "explanation": "Ex: Insuline humaine produite par E. coli." },
                        { "id": 44, "question": "Le promoteur dans un vecteur d'expression sert à :", "options": ["Initier la transcription du gène inséré", "Répliquer le plasmide", "Sélectionner", "Couper"], "correctAnswer": 0, "explanation": "Inductible (ex: Promoteur Lac)." },
                        { "id": 45, "question": "La technique FISH (Fluorescence In Situ Hybridization) permet de :", "options": ["Localiser une séquence sur un chromosome", "Séquencer", "Extraire", "Amplifier"], "correctAnswer": 0, "explanation": "Cytogénétique moléculaire." },
                        { "id": 46, "question": "Le Bleu de Bromophénol sert à :", "options": ["Suivre le front de migration en électrophorèse", "Colorer l'ADN", "Dénaturer", "Précipiter"], "correctAnswer": 0, "explanation": "Colorant de charge." },
                        { "id": 47, "question": "Le SybrGreen est utilisé en :", "options": ["qPCR (intercalant non spécifique)", "Séquençage", "Clonage", "Extraction"], "correctAnswer": 0, "explanation": "Fluoresce quand lié à l'ADN double brin." },
                        { "id": 48, "question": "Les sondes TaqMan (qPCR) utilisent le principe de :", "options": ["FRET (Transfert d'énergie de résonance)", "Radioactivité", "Précipitation", "Coloration"], "correctAnswer": 0, "explanation": "Fluorescence libérée lors de l'hydrolyse de la sonde." },
                        { "id": 49, "question": "Pour cloner un produit PCR, on peut utiliser le clonage TA si :", "options": ["La Taq Pol a ajouté un A en 3'", "Les bouts sont francs", "L'ADN est méthylé", "Il est circulaire"], "correctAnswer": 0, "explanation": "Vecteur T ouvert avec des T saillants." },
                        { "id": 50, "question": "La mutagénèse dirigée sert à :", "options": ["Introduire une mutation précise dans un gène", "Amplifier l'ADN", "Séquencer", "Extraire"], "correctAnswer": 0, "explanation": "Étude fonctionnelle des protéines." },
                        { "id": 51, "question": "Le séquençage d'ARN (RNA-Seq) permet de :", "options": ["Analyser le transcriptome complet", "Voir la structure 3D", "Voir les protéines", "Cloner"], "correctAnswer": 0, "explanation": "Quantification et identification des transcrits." },
                        { "id": 52, "question": "La sédimentation en gradient de chlorure de césium sépare l'ADN selon :", "options": ["Sa densité (GC vs AT)", "Sa taille", "Sa charge", "Sa forme"], "correctAnswer": 0, "explanation": "Technique historique (Meselson et Stahl)." },
                        { "id": 53, "question": "Un site Polylinker (MCS) contient :", "options": ["Plusieurs sites de restriction uniques", "Des gènes de résistance", "Une origine", "Un promoteur"], "correctAnswer": 0, "explanation": "Facilite l'insertion du gène." },
                        { "id": 54, "question": "La transfection est le transfert d'ADN dans :", "options": ["Des cellules eucaryotes", "Des bactéries (Transformation)", "Des virus", "Des plantes"], "correctAnswer": 0, "explanation": "Lipofection, Calcium phosphate..." },
                        { "id": 55, "question": "Le gène rapporteur (ex: GFP, Luciférase) sert à :", "options": ["Visualiser l'expression ou la localisation", "Tuer la cellule", "Répliquer", "Couper"], "correctAnswer": 0, "explanation": "Green Fluorescent Protein." },
                        { "id": 56, "question": "La protéinase K est utilisée pour :", "options": ["Digérer les protéines lors de l'extraction d'ADN", "Couper l'ADN", "Synthétiser", "Lier"], "correctAnswer": 0, "explanation": "Active même en présence de SDS." },
                        { "id": 57, "question": "Le CTAB est un détergent utilisé pour extraire l'ADN de :", "options": ["Plantes (riches en polysacch)", "Bactéries", "Sang", "Virus"], "correctAnswer": 0, "explanation": "Cationique." },
                        { "id": 58, "question": "La technique CRISPR-Cas9 nécessite :", "options": ["Une nucléase Cas9 et un ARN guide (sgRNA)", "Une polymérase", "Une ligase", "Un ribosome"], "correctAnswer": 0, "explanation": "Ciseaux moléculaires programmables." },
                        { "id": 59, "question": "Un SNP (Single Nucleotide Polymorphism) est :", "options": ["Une variation d'une seule base", "Une délétion", "Une insertion", "Une inversion"], "correctAnswer": 0, "explanation": "Marqueur génétique très fréquent." },
                        { "id": 60, "question": "La technique du 'Shotgun' est utilisée pour :", "options": ["Séquencer des génomes entiers", "Amplifier un gène", "Extraire l'ARN", "Cloner"], "correctAnswer": 0, "explanation": "Fragmentation aléatoire et assemblage informatique." },
                        { "id": 61, "question": "La purification sur colonne de silice repose sur :", "options": ["La liaison ADN-Silice en présence de sels chaotropes", "La charge", "La taille", "L'affinité antigène"], "correctAnswer": 0, "explanation": "Kits miniprep standards." },
                        { "id": 62, "question": "La dialyse permet de :", "options": ["Enlever les sels et petites molécules", "Concentrer l'ADN", "Couper l'ADN", "Séquencer"], "correctAnswer": 0, "explanation": "Echange de tampon." },
                        { "id": 63, "question": "L'électrophorèse en champ pulsé (PFGE) sépare :", "options": ["Les très grands fragments d'ADN (Chromosomes)", "Les petits fragments", "Les protéines", "L'ARN"], "correctAnswer": 0, "explanation": "Change la direction du champ électrique." },
                        { "id": 64, "question": "La marche sur le chromosome (Primer Walking) sert à :", "options": ["Séquencer de longs fragments pas à pas", "Amplifier", "Cloner", "Hybrider"], "correctAnswer": 0, "explanation": "Design d'amorces successif." },
                        { "id": 65, "question": "Une banque génomique est représentative si :", "options": ["Elle contient plusieurs fois le génome entier (couverture)", "Elle est petite", "Elle n'a que des exons", "Elle est sur plasmide"], "correctAnswer": 0, "explanation": "Probabilité de trouver un gène." },
                        { "id": 66, "question": "L'IPG (Isopropyl-bêta-D-thiogalactoside) est un :", "options": ["Inducteur gratuit de l'opéron Lac (active transcription)", "Substrat coloré", "Inhibiteur", "Antibiotique"], "correctAnswer": 0, "explanation": "Non métabolisable, induit l'expression." },
                        { "id": 67, "question": "Le X-Gal est un :", "options": ["Substrat chromogène (devient bleu si clivé)", "Inducteur", "Antibiotique", "Répresseur"], "correctAnswer": 0, "explanation": "Criblage blanc/bleu." },
                        { "id": 68, "question": "L'ARNsi (Small interfering) agit par :", "options": ["Dégradation de l'ARNm complémentaire", "Blocage traduction", "Mutation", "Activation"], "correctAnswer": 0, "explanation": "Complexe RISC." },
                        { "id": 69, "question": "La méthylation de l'ADN peut être détectée par :", "options": ["Traitement au Bisulfite", "PCR standard", "Electrophorèse", "Western Blot"], "correctAnswer": 0, "explanation": "Convertit C non méthylées en U." },
                        { "id": 70, "question": "Les enzymes isoschizomères coupent :", "options": ["La même séquence", "Des séquences différentes", "L'ARN", "Les protéines"], "correctAnswer": 0, "explanation": "Parfois avec des extrémités différentes (néoschizomères)." },
                        { "id": 71, "question": "La TdT (Terminal deoxynucleotidyl Transferase) ajoute :", "options": ["Des nucléotides en 3' sans matrice (Queue)", "Des amorces", "Des phosphates", "Des méthyles"], "correctAnswer": 0, "explanation": "Marquage 3' ou queues homopolymères." },
                        { "id": 72, "question": "La klenow (Fragment) est utilisée pour :", "options": ["Rendre francs les bouts cohésifs (Filling-in)", "PCR", "Séquençage auto", "Ligation"], "correctAnswer": 0, "explanation": "Polymérase sans activité exonucléase 5'-3'." },
                        { "id": 73, "question": "Un épitope Tag (ex: His-Tag) permet :", "options": ["La purification par affinité de la protéine recombinante", "La solubilité", "La sécrétion", "La dégradation"], "correctAnswer": 0, "explanation": "Chromatographie Nickel." },
                        { "id": 74, "question": "La technique du 'Doigt de zinc' ou TALEN servait à :", "options": ["L'édition génomique (avant CRISPR)", "Le séquençage", "L'extraction", "La PCR"], "correctAnswer": 0, "explanation": "Nucléases chimériques." },
                        { "id": 75, "question": "Le pyroséquençage (454) détecte :", "options": ["Le pyrophosphate libéré (Lumière)", "H+", "Fluorescence", "pH"], "correctAnswer": 0, "explanation": "Réaction en cascade (Sulfurylase/Luciférase)." },
                        { "id": 76, "question": "Le séquençage Ion Torrent détecte :", "options": ["Les protons H+ libérés (pH)", "La lumière", "La fluorescence", "La masse"], "correctAnswer": 0, "explanation": "Puce semi-conductrice." },
                        { "id": 77, "question": "Le séquençage Illumina utilise :", "options": ["Des terminateurs réversibles fluorescents", "La ligation", "Le pH", "Les nanopores"], "correctAnswer": 0, "explanation": "Leader actuel du NGS." },
                        { "id": 78, "question": "Le séquençage Nanopore mesure :", "options": ["Le changement de courant électrique à travers un pore", "La lumière", "La fluorescence", "La chaleur"], "correctAnswer": 0, "explanation": "Longues lectures (Long reads)." },
                        { "id": 79, "question": "Un vecteur navette (shuttle) :", "options": ["Se réplique dans 2 hôtes différents", "Un seul hôte", "S'intègre", "Ne se réplique pas"], "correctAnswer": 0, "explanation": "Ex: E. coli / Levure." },
                        { "id": 80, "question": "La conjugaison bactérienne est un transfert d'ADN par :", "options": ["Contact direct (Pilus)", "Virus", "Milieu", "Choc"], "correctAnswer": 0, "explanation": "Vecteur naturel (Plasmide F)." },
                        { "id": 81, "question": "La transduction est un transfert d'ADN par :", "options": ["Un bactériophage (Virus)", "Contact", "Milieu", "Liposome"], "correctAnswer": 0, "explanation": "Vecteur viral." },
                        { "id": 82, "question": "Le phage Lambda est un vecteur pour :", "options": ["Des inserts de taille moyenne (~20kb)", "Des petits inserts", "Des protéines", "Des lipides"], "correctAnswer": 0, "explanation": "Cycle lytique/lysogénique." },
                        { "id": 83, "question": "Les BAC (Bacterial Artificial Chromosome) clonent :", "options": ["100-300 kb", "1 kb", "1 Mb", "10 pb"], "correctAnswer": 0, "explanation": "Basé sur le plasmide F." },
                        { "id": 84, "question": "L'électroporation permet de :", "options": ["Faire entrer l'ADN en créant des pores", "Extraire l'ADN", "Couper l'ADN", "Séquencer"], "correctAnswer": 0, "explanation": "Transformation efficace." },
                        { "id": 85, "question": "Un ADNc correspond à :", "options": ["La partie codante d'un gène (Exons)", "Le gène entier", "Le promoteur", "L'intron"], "correctAnswer": 0, "explanation": "Copie de l'ARNm mature." },
                        { "id": 86, "question": "La technique RACE-PCR sert à :", "options": ["Obtenir les extrémités 5' ou 3' d'un ADNc", "Amplifier tout", "Quantifier", "Muter"], "correctAnswer": 0, "explanation": "Rapid Amplification of cDNA Ends." },
                        { "id": 87, "question": "Le 'Footprinting' à la DNase I étudie :", "options": ["L'interaction ADN-Protéine", "La séquence", "La taille", "La methylation"], "correctAnswer": 0, "explanation": "La protéine protège l'ADN de la coupure." },
                        { "id": 88, "question": "Le retard sur gel (EMSA) étudie :", "options": ["La liaison ADN-Protéine", "La taille ADN", "La séquence", "La ligase"], "correctAnswer": 0, "explanation": "Le complexe migre moins vite que l'ADN libre." },
                        { "id": 89, "question": "La technique du Double-Hybride (Levure) détecte :", "options": ["Les interactions Protéine-Protéine", "ADN-Protéine", "ADN-ADN", "ARN-ARN"], "correctAnswer": 0, "explanation": "Reconstitution d'un facteur de transcription." },
                        { "id": 90, "question": "L'immunoprécipitation de la chromatine (ChIP) analyse :", "options": ["Les interactions ADN-Protéine in vivo", "La séquence", "L'ARN", "Les lipides"], "correctAnswer": 0, "explanation": "Fixation au formaldéhyde." },
                        { "id": 91, "question": "Un transgène est :", "options": ["Un gène étranger introduit dans un organisme", "Un gène muté", "Un gène supprimé", "Un ARN"], "correctAnswer": 0, "explanation": "OGM." },
                        { "id": 92, "question": "La recombinaison homologue permet de faire des souris :", "options": ["Knock-out (KO - Invalidation)", "Transgéniques simples", "Clonées", "Malades"], "correctAnswer": 0, "explanation": "Remplacement ciblé d'un gène." },
                        { "id": 93, "question": "Le système Cre-Lox permet :", "options": ["L'invalidation conditionnelle (tissu/temps spécifique)", "L'invalidation totale", "La PCR", "Le séquençage"], "correctAnswer": 0, "explanation": "Recombinase site-spécifique." },
                        { "id": 94, "question": "La PCR nichée (Nested) augmente :", "options": ["La spécificité et la sensibilité", "La vitesse", "Les erreurs", "Le coût"], "correctAnswer": 0, "explanation": "Deux paires d'amorces successives." },
                        { "id": 95, "question": "Les amorces dégénérées sont utilisées quand :", "options": ["La séquence exacte est inconnue (basée sur protéine)", "On veut muter", "On veut séquencer", "Rien"], "correctAnswer": 0, "explanation": "Mélange d'amorces couvrant le code génétique." },
                        { "id": 96, "question": "L'hybridation in situ détecte :", "options": ["ARNm dans un tissu/cellule", "ADN extrait", "Protéine", "Lipide"], "correctAnswer": 0, "explanation": "Localisation spatiale." },
                        { "id": 97, "question": "La mutagenèse par PCR (Site-directed) utilise :", "options": ["Des amorces avec un mésappariement (la mutation)", "Des produits chimiques", "Des UV", "Des enzymes"], "correctAnswer": 0, "explanation": "Introduction précise d'une mutation." },
                        { "id": 98, "question": "La température d'hybridation (Ta) en PCR est généralement :", "options": ["2-5°C sous le Tm des amorces", "Egale au Tm", "Au dessus du Tm", "95°C"], "correctAnswer": 0, "explanation": "Pour assurer la spécificité." },
                        { "id": 99, "question": "Le MgCl2 en PCR est cofacteur de :", "options": ["La Taq Polymérase", "Les amorces", "L'ADN", "Le tampon"], "correctAnswer": 0, "explanation": "Essentiel pour l'activité enzymatique." },
                        { "id": 100, "question": "La technique ELISA détecte :", "options": ["Protéines (Antigènes/Anticorps)", "ADN", "ARN", "Sels"], "correctAnswer": 0, "explanation": "Immunologique (pas ADN), mais souvent citée en biotech." }

                {
                    "id": "l2-an-cours02",
                    "title": "L2 - Acides Nucléiques (Méthodes)",
                    "level": "L2",
                    "description": "Techniques d'extraction, Électrophorèse, PCR, Clonage, Séquençage et Hybridation.",
                    "questions": [
                        { "id": 1, "question": "Quel est le rôle principal du phénol lors de l'extraction de l'ADN ?", "options": ["Il précipite l'ADN au fond du tube.", "Il dénature les protéines et les sépare de l'ADN.", "Il protège l'ADN des nucléases.", "Il colore l'ADN en bleu."], "correctAnswer": 1, "explanation": "Le phénol est un solvant organique qui dénature les protéines, les faisant passer dans la phase organique ou à l'interphase, laissant l'ADN dans la phase aqueuse." },
                        { "id": 2, "question": "Pourquoi utilise-t-on de l'éthanol absolu froid à la fin d'une extraction d'ADN ?", "options": ["Pour dissoudre l'ADN.", "Pour provoquer la précipitation de l'ADN.", "Pour couper l'ADN en petits fragments.", "Pour augmenter le pH de la solution."], "correctAnswer": 1, "explanation": "En présence de sels, l'éthanol diminue la constante diélectrique du solvant, ce qui neutralise les charges de l'ADN et entraîne sa précipitation." },
                        { "id": 3, "question": "Quelle est la fonction de l'EDTA dans les tampons de conservation de l'ADN ?", "options": ["Il chélate les ions magnésium (Mg2+) pour inhiber les DNases.", "Il fournit des ions magnésium nécessaires aux enzymes.", "Il agit comme une source d'énergie.", "Il dénature la double hélice d'ADN."], "correctAnswer": 0, "explanation": "L'EDTA piège les ions divalents comme le magnésium, qui sont des cofacteurs indispensables au fonctionnement des enzymes qui dégradent l'ADN (DNases)." },
                        { "id": 4, "question": "Comment vérifie-t-on la pureté d'un échantillon d'ADN par spectrophotométrie ?", "options": ["En mesurant le rapport d'absorbance A260/A280.", "En mesurant l'absorbance à 595 nm uniquement.", "En mesurant le rapport A230/A260.", "En observant la fluorescence spontanée."], "correctAnswer": 0, "explanation": "Un rapport A260/A280 compris entre 1,8 et 2,0 indique que l'échantillon d'ADN est pur et exempt de contamination protéique significative." },
                        { "id": 5, "question": "Quel type de gel est le plus adapté pour séparer des fragments d'ADN de grande taille (ex: 500 à 20 000 pb) ?", "options": ["Le gel de polyacrylamide.", "Le gel d'agarose.", "Le gel de silice.", "Le gel d'amidon."], "correctAnswer": 1, "explanation": "Le gel d'agarose possède des pores de grande taille, ce qui permet la migration et la séparation des fragments d'ADN de taille moyenne à grande." },
                        { "id": 6, "question": "Vers quelle électrode l'ADN migre-t-il lors d'une électrophorèse ?", "options": ["Vers la cathode (pôle négatif).", "Vers l'anode (pôle positif).", "Il ne migre pas.", "Vers les deux pôles alternativement."], "correctAnswer": 1, "explanation": "L'ADN est chargé négativement en raison de ses groupements phosphates, il est donc attiré par le pôle positif (anode)." },
                        { "id": 7, "question": "Quel est le mécanisme d'action du Bromure d'Éthidium (BET) ?", "options": ["Il s'intercale entre les bases de l'ADN et fluoresce sous UV.", "Il coupe l'ADN spécifiquement.", "Il se lie covalemment aux phosphates.", "Il colore les protéines associées à l'ADN."], "correctAnswer": 0, "explanation": "C'est un agent intercalant qui se glisse entre les plateaux de bases empilées et émet une fluorescence orange lorsqu'il est exposé aux ultraviolets." },
                        { "id": 8, "question": "Qu'est-ce qu'une enzyme de restriction de type II ?", "options": ["Une exonucléase qui grignote les extrémités.", "Une endonucléase qui coupe l'ADN au niveau d'une séquence spécifique.", "Une polymérase qui répare l'ADN.", "Une ligase qui colle les morceaux."], "correctAnswer": 1, "explanation": "Les enzymes de restriction reconnaissent des séquences palindromiques spécifiques et coupent l'ADN à cet endroit précis." },
                        { "id": 9, "question": "Que sont des extrémités 'cohésives' (sticky ends) ?", "options": ["Des extrémités franches sans débordement.", "Des extrémités générées par une coupure décalée laissant des simples brins complémentaires.", "Des extrémités qui ne peuvent pas être ligaturées.", "Des extrémités protégées par des protéines."], "correctAnswer": 1, "explanation": "Ce sont des bouts d'ADN simple brin générés par une coupure asymétrique, capables de s'apparier facilement avec des extrémités complémentaires." },
                        { "id": 10, "question": "Quelle réaction est catalysée par l'ADN Ligase ?", "options": ["L'hydrolyse de la liaison phosphodiester.", "La formation d'une liaison phosphodiester entre un 3'-OH et un 5'-P.", "L'ajout de nucléotides libres.", "La séparation des deux brins d'ADN."], "correctAnswer": 1, "explanation": "L'ADN Ligase rétablit la continuité du squelette sucre-phosphate en consommant de l'ATP." },
                        { "id": 11, "question": "Quels éléments sont indispensables dans un plasmide vecteur de clonage ?", "options": ["Une origine de réplication, un gène de sélection et un site de clonage multiple.", "Un centromère et des télomères.", "Un promoteur viral uniquement.", "Une queue poly-A."], "correctAnswer": 0, "explanation": "L'origine permet la réplication autonome, le gène de sélection (antibiotique) permet d'isoler les bactéries transformées, et le MCS permet d'insérer l'ADN." },
                        { "id": 12, "question": "En quoi consiste la transformation bactérienne ?", "options": ["À faire entrer de l'ADN exogène (plasmide) dans une bactérie hôte.", "À extraire l'ADN de la bactérie.", "À muter le génome bactérien.", "À fusionner deux bactéries."], "correctAnswer": 0, "explanation": "C'est le processus par lequel une bactérie compétente intègre de l'ADN étranger, souvent par choc thermique ou électrique." },
                        { "id": 13, "question": "Dans le système de sélection bleu/blanc (LacZ), que signifie une colonie blanche ?", "options": ["La bactérie n'a pas reçu le plasmide.", "Le plasmide est vide (sans insert).", "Le plasmide contient un insert qui a interrompu le gène LacZ.", "La bactérie est morte."], "correctAnswer": 2, "explanation": "L'insertion d'ADN étranger dans le gène LacZ inactive la Bêta-galactosidase, empêchant la transformation du substrat X-Gal en couleur bleue." },
                        { "id": 14, "question": "Quelle est la différence majeure entre une banque génomique et une banque d'ADNc ?", "options": ["La banque génomique contient les introns, la banque d'ADNc non.", "La banque d'ADNc contient tout le génome.", "Il n'y a aucune différence.", "La banque génomique est faite à partir d'ARN."], "correctAnswer": 0, "explanation": "La banque génomique contient tout l'ADN (introns et promoteurs inclus), alors que la banque d'ADNc est une copie des ARNm matures (uniquement les exons exprimés)." },
                        { "id": 15, "question": "Quel est le principe de la PCR (Réaction en Chaîne par Polymérase) ?", "options": ["Séquencer l'ADN base par base.", "Amplifier de manière exponentielle une région spécifique d'ADN.", "Purifier des protéines.", "Couper l'ADN en fragments aléatoires."], "correctAnswer": 1, "explanation": "La PCR permet d'obtenir des millions de copies d'une séquence cible à partir d'une faible quantité d'ADN matrice." },
                        { "id": 16, "question": "Pourquoi utilise-t-on la Taq Polymérase en PCR ?", "options": ["Car elle est plus précise que les autres.", "Car elle fonctionne à température ambiante.", "Car elle résiste aux températures élevées de dénaturation (95°C).", "Car elle possède une activité reverse transcriptase."], "correctAnswer": 2, "explanation": "C'est une enzyme thermophile extraite de Thermus aquaticus, qui ne se dénature pas lors des cycles de chauffage répétés." },
                        { "id": 17, "question": "Quelles sont les trois étapes d'un cycle de PCR dans l'ordre ?", "options": ["Hybridation, Élongation, Dénaturation.", "Dénaturation, Hybridation, Élongation.", "Élongation, Dénaturation, Hybridation.", "Fixation, Lavage, Révélation."], "correctAnswer": 1, "explanation": "D'abord on sépare les brins (Dénaturation), puis les amorces se fixent (Hybridation), et enfin l'enzyme synthétise le brin (Élongation)." },
                        { "id": 18, "question": "À quoi servent les amorces (primers) dans une PCR ?", "options": ["À couper l'ADN.", "À délimiter la région à amplifier et fournir un 3'-OH libre.", "À colorer l'ADN amplifié.", "À lier les nucléotides entre eux."], "correctAnswer": 1, "explanation": "Elles s'hybrident spécifiquement aux extrémités de la séquence cible pour initier la polymérisation." },
                        { "id": 19, "question": "La RT-PCR est une technique qui permet de :", "options": ["Séquencer l'ARN.", "Amplifier de l'ADN à partir d'une matrice ARN.", "Amplifier directement des protéines.", "Réparer l'ADN."], "correctAnswer": 1, "explanation": "Elle commence par une Transcription Inverse (RT) pour convertir l'ARN en ADNc, suivie d'une PCR classique." },
                        { "id": 20, "question": "Que mesure-t-on avec le 'Ct' (Cycle threshold) en qPCR ?", "options": ["La taille des fragments.", "La qualité de l'ADN.", "Le nombre de cycles nécessaire pour détecter un signal fluorescent significatif.", "La température de fusion."], "correctAnswer": 2, "explanation": "Plus la quantité initiale d'ADN est grande, plus le signal apparaît tôt, donc plus le Ct est faible." },
                        { "id": 21, "question": "Quel est le rôle des didésoxynucléotides (ddNTP) dans la méthode de Sanger ?", "options": ["Ils accélèrent la réaction.", "Ils provoquent l'arrêt de la synthèse de la chaîne d'ADN.", "Ils remplacent les amorces.", "Ils servent de matrice."], "correctAnswer": 1, "explanation": "L'absence de groupement hydroxyle en 3' empêche la formation de la liaison phosphodiester suivante, terminant le fragment." },
                        { "id": 22, "question": "Qu'est-ce qu'un Southern Blot ?", "options": ["Le transfert d'ARN sur une membrane.", "Le transfert de protéines sur une membrane.", "Le transfert d'ADN sur une membrane suivi d'une hybridation.", "Une technique de clonage."], "correctAnswer": 2, "explanation": "Cette technique permet de détecter une séquence d'ADN spécifique dans un mélange complexe après électrophorèse." },
                        { "id": 23, "question": "Le Northern Blot est utilisé pour analyser :", "options": ["L'expression des gènes (ARN messagers).", "La structure de l'ADN.", "La quantité de protéines.", "Les interactions ADN-protéines."], "correctAnswer": 0, "explanation": "Il permet de détecter la présence et la taille d'un ARN spécifique." },
                        { "id": 24, "question": "Le Western Blot utilise quelle sonde pour la détection ?", "options": ["Un fragment d'ADN marqué.", "Un fragment d'ARN marqué.", "Un anticorps spécifique.", "Une enzyme de restriction."], "correctAnswer": 2, "explanation": "C'est une technique immunologique où des anticorps se lient spécifiquement à la protéine cible." },
                        { "id": 25, "question": "Qu'est-ce que la 'stringence' lors d'une hybridation ?", "options": ["La vitesse de la réaction.", "La sévérité des conditions (température, sels) exigeant une complémentarité parfaite.", "La quantité d'ADN utilisée.", "La longueur de la sonde."], "correctAnswer": 1, "explanation": "Une haute stringence (haute température, faible sel) ne permet l'hybridation que si les séquences sont parfaitement complémentaires." },
                        { "id": 26, "question": "À quoi sert la Phosphatase Alcaline lors du clonage ?", "options": ["À couper le vecteur.", "À empêcher la recirculation du vecteur sur lui-même.", "À lier l'insert.", "À phosphoryler les extrémités 5'."], "correctAnswer": 1, "explanation": "Elle retire les phosphates 5' du vecteur linéarisé, empêchant la ligase de le refermer sans insert." },
                        { "id": 27, "question": "Quel est le rôle de la Polynucléotide Kinase (PNK) ?", "options": ["Elle ajoute un phosphate en 5' de l'ADN.", "Elle retire les phosphates.", "Elle coupe l'ADN.", "Elle polymérise l'ADN."], "correctAnswer": 0, "explanation": "Elle transfère le phosphate gamma de l'ATP sur l'extrémité 5'-OH, ce qui est utile pour le marquage ou la ligation." },
                        { "id": 28, "question": "Les puces à ADN (Microarrays) sont utilisées pour :", "options": ["Séquencer un seul gène.", "Analyser l'expression de milliers de gènes simultanément (Transcriptome).", "Amplifier l'ADN.", "Extraire les plasmides."], "correctAnswer": 1, "explanation": "Elles permettent de comparer les niveaux d'expression génique entre deux conditions biologiques à grande échelle." },
                        { "id": 29, "question": "La technique CRISPR-Cas9 est un outil pour :", "options": ["Amplifier l'ADN.", "Éditer le génome de manière ciblée.", "Séquencer l'ADN.", "Visualiser les chromosomes."], "correctAnswer": 1, "explanation": "Elle utilise un ARN guide pour diriger la nucléase Cas9 vers une séquence précise et induire une coupure." },
                        { "id": 30, "question": "Qu'est-ce qu'un cosmide ?", "options": ["Un virus pathogène.", "Un vecteur hybride plasmide/phage permettant de cloner de grands fragments.", "Une protéine de la chromatine.", "Un type d'ARN."], "correctAnswer": 1, "explanation": "Il combine les avantages des plasmides et la capacité d'empaquetage des phages pour des inserts de 40-50 kb." },
                        { "id": 31, "question": "L'électrophorèse en champ pulsé (PFGE) sert à :", "options": ["Séparer de très grands fragments d'ADN (comme des chromosomes entiers).", "Séparer des petits oligonucléotides.", "Séquencer l'ADN.", "Amplifier l'ADN."], "correctAnswer": 0, "explanation": "En changeant périodiquement l'orientation du champ électrique, elle permet aux très grosses molécules de migrer dans le gel." },
                        { "id": 32, "question": "Que permet de détecter la technique RFLP (Restriction Fragment Length Polymorphism) ?", "options": ["La quantité d'ARN.", "Des variations de séquence modifiant la taille des fragments de restriction.", "La structure des protéines.", "La méthylation de l'ADN."], "correctAnswer": 1, "explanation": "C'est une méthode d'analyse génétique basée sur la présence ou l'absence de sites de restriction." },
                        { "id": 33, "question": "La technique FISH (Hybridation In Situ Fluorescente) sert à :", "options": ["Localiser une séquence d'ADN directement sur des chromosomes.", "Extraire l'ADN.", "Amplifier l'ADN.", "Mesurer la concentration d'ADN."], "correctAnswer": 0, "explanation": "Elle utilise des sondes fluorescentes pour visualiser la position des gènes ou des anomalies chromosomiques." },
                        { "id": 34, "question": "Le séquençage NGS (Next Generation Sequencing) se distingue par :", "options": ["Sa lenteur.", "Sa capacité à séquencer massivement en parallèle (Haut débit).", "L'utilisation de gels radioactifs.", "Son faible coût pour un seul gène."], "correctAnswer": 1, "explanation": "Il permet de séquencer des génomes entiers très rapidement en traitant des millions de séquences simultanément." },
                        { "id": 35, "question": "Quelle est la particularité de la Transcriptase Inverse ?", "options": ["C'est une ADN polymérase ARN-dépendante.", "C'est une ARN polymérase ADN-dépendante.", "C'est une enzyme de restriction.", "C'est une ligase."], "correctAnswer": 0, "explanation": "Elle synthétise un brin d'ADN complémentaire à partir d'une matrice ARN (caractéristique des rétrovirus)." },
                        { "id": 36, "question": "Le 'Fragment de Klenow' correspond à :", "options": ["L'ADN Polymérase I amputée de son activité exonucléase 5'->3'.", "L'ADN Polymérase III.", "Une partie du ribosome.", "Un fragment d'Okazaki."], "correctAnswer": 0, "explanation": "Il conserve l'activité polymérase et l'activité exonucléase 3'->5' (correction), utilisé pour le marquage ou le remplissage." },
                        { "id": 37, "question": "L'hybridation soustractive permet d'identifier :", "options": ["Les gènes exprimés de manière identique dans deux tissus.", "Les gènes exprimés différentiellement entre deux conditions.", "La séquence totale du génome.", "Les protéines membranaires."], "correctAnswer": 1, "explanation": "Elle élimine les séquences communes pour ne garder que celles spécifiques à une condition." },
                        { "id": 38, "question": "Qu'est-ce qu'un transgène ?", "options": ["Un gène endogène muté.", "Un gène exogène introduit artificiellement dans le génome d'un organisme.", "Un gène de bactérie.", "Un gène viral."], "correctAnswer": 1, "explanation": "C'est la base de la création des Organismes Génétiquement Modifiés (OGM)." },
                        { "id": 39, "question": "La technique du 'Double-Hybride' chez la levure détecte :", "options": ["Les interactions ADN-ADN.", "Les interactions Protéine-Protéine in vivo.", "Les mutations ponctuelles.", "La méthylation."], "correctAnswer": 1, "explanation": "Elle repose sur la reconstitution d'un facteur de transcription fonctionnel lorsque deux protéines interagissent." },
                        { "id": 40, "question": "L'immunoprécipitation de la chromatine (ChIP) permet d'étudier :", "options": ["Les interactions entre l'ADN et les protéines (ex: facteurs de transcription).", "La séquence des protéines.", "La structure des lipides.", "La réplication de l'ARN."], "correctAnswer": 0, "explanation": "Elle permet de savoir quelles protéines sont fixées à quelles régions de l'ADN dans la cellule." },
                        { "id": 41, "question": "Le SYBR Green est un fluorophore utilisé en qPCR qui se lie :", "options": ["Spécifiquement à une séquence cible.", "De manière non spécifique à tout ADN double brin.", "Aux protéines.", "À l'ARN simple brin."], "correctAnswer": 1, "explanation": "Il fluoresce dès qu'il s'intercale dans l'ADN double brin, permettant de suivre l'amplification globale." },
                        { "id": 42, "question": "Les sondes TaqMan fonctionnent grâce au principe de :", "options": ["L'intercalation.", "FRET (Transfert d'énergie de résonance de fluorescence).", "La radioactivité.", "La précipitation."], "correctAnswer": 1, "explanation": "L'hydrolyse de la sonde par la polymérase sépare le fluorophore du quencheur, émettant de la lumière." },
                        { "id": 43, "question": "Un vecteur navette (shuttle vector) a la particularité de :", "options": ["Pouvoir se répliquer dans deux organismes hôtes différents (ex: E. coli et Levure).", "Transporter des protéines.", "Détruire l'ADN hôte.", "Être linéaire."], "correctAnswer": 0, "explanation": "Il possède deux origines de réplication et des marqueurs de sélection adaptés à chaque hôte." },
                        { "id": 44, "question": "La mutagenèse dirigée est utilisée pour :", "options": ["Créer des mutations aléatoires.", "Introduire une mutation précise et prédéfinie dans une séquence d'ADN.", "Séquencer l'ADN.", "Amplifier l'ADN."], "correctAnswer": 1, "explanation": "Elle permet d'étudier le rôle d'un acide aminé spécifique en modifiant son codon." },
                        { "id": 45, "question": "L'ARN interférence (siRNA) est une méthode pour :", "options": ["Augmenter l'expression d'un gène.", "Réduire ou éteindre l'expression d'un gène cible (Knock-down).", "Muté l'ADN.", "Réparer l'ADN."], "correctAnswer": 1, "explanation": "Les petits ARN guident la dégradation spécifique des ARNm complémentaires." },
                        { "id": 46, "question": "Le séquençage par nanopore repose sur :", "options": ["La détection de fluorescence.", "La mesure des changements de courant électrique lorsqu'un brin d'ADN traverse un pore.", "La libération de protons.", "L'utilisation de ddNTP."], "correctAnswer": 1, "explanation": "C'est une technique de séquençage de 3ème génération permettant de lire de très longs fragments." },
                        { "id": 47, "question": "Quelle est l'utilité du traitement au bisulfite de sodium ?", "options": ["Il coupe l'ADN.", "Il convertit les cytosines non méthylées en uraciles, permettant d'étudier la méthylation.", "Il colore l'ADN.", "Il amplifie l'ADN."], "correctAnswer": 1, "explanation": "C'est la méthode standard pour analyser l'épigénétique (méthylation de l'ADN)." },
                        { "id": 48, "question": "Un YAC (Yeast Artificial Chromosome) est utilisé pour cloner :", "options": ["Des petits fragments d'ADN.", "De très grands fragments d'ADN (plusieurs centaines de kb).", "Des protéines.", "Des virus entiers."], "correctAnswer": 1, "explanation": "Il se comporte comme un chromosome artificiel dans la levure, acceptant de très grands inserts." },
                        { "id": 49, "question": "La technique EMSA (Retard sur gel) permet de visualiser :", "options": ["La liaison d'une protéine à un fragment d'ADN.", "La coupure de l'ADN.", "La dénaturation de l'ADN.", "La synthèse d'ADN."], "correctAnswer": 0, "explanation": "Le complexe ADN-protéine migre plus lentement dans le gel que l'ADN libre, créant un retard." },
                        { "id": 50, "question": "L'expression hétérologue d'une protéine signifie :", "options": ["Produire une protéine dans son organisme d'origine.", "Produire une protéine dans un organisme hôte différent.", "Produire une protéine mutée.", "Détruire une protéine."], "correctAnswer": 1, "explanation": "Par exemple, produire de l'insuline humaine dans une bactérie E. coli." },
                        { "id": 51, "question": "La technique du 'Footprinting' à la DNase I sert à :", "options": ["Déterminer la séquence exacte d'ADN protégée par une protéine liée.", "Séquencer tout le génome.", "Voir la taille de l'ADN.", "Amplifier l'ADN."], "correctAnswer": 0, "explanation": "La zone où la protéine est fixée est protégée de la digestion par la DNase, créant une empreinte vide sur le gel." },
                        { "id": 52, "question": "Les BAC (Bacterial Artificial Chromosome) sont basés sur :", "options": ["Le plasmide F (fertilité) d'E. coli.", "Le phage Lambda.", "La levure.", "Un virus humain."], "correctAnswer": 0, "explanation": "Ils sont très stables et acceptent des inserts de 100 à 300 kb, cruciaux pour le projet génome humain." },
                        { "id": 53, "question": "Le pyroséquençage détecte l'incorporation de nucléotides par :", "options": ["La libération de pyrophosphate converti en lumière.", "La fluorescence directe.", "Le changement de pH.", "La radioactivité."], "correctAnswer": 0, "explanation": "Le PPi libéré est utilisé par la sulfurylase puis la luciférase pour produire un flash lumineux." },
                        { "id": 54, "question": "Un site Polylinker (MCS) dans un vecteur est :", "options": ["Une région contenant de nombreux sites de restriction uniques.", "Une origine de réplication.", "Un promoteur.", "Un gène de résistance."], "correctAnswer": 0, "explanation": "Il offre une grande flexibilité pour choisir l'enzyme de restriction utilisée pour le clonage." },
                        { "id": 55, "question": "Le bleu de bromophénol est utilisé en électrophorèse comme :", "options": ["Colorant de l'ADN.", "Témoin de migration (front de migration).", "Agent dénaturant.", "Tampon."], "correctAnswer": 1, "explanation": "Il migre à une vitesse connue et permet de savoir quand arrêter l'électrophorèse." },
                        { "id": 56, "question": "L'utilisation de la protéinase K lors de l'extraction sert à :", "options": ["Digérer les protéines contaminantes et inactiver les nucléases.", "Couper l'ADN.", "Précipiter l'ADN.", "Colorer l'échantillon."], "correctAnswer": 0, "explanation": "C'est une protéase robuste qui fonctionne même en présence de détergents comme le SDS." },
                        { "id": 57, "question": "L'électroporation est une méthode pour :", "options": ["Introduire de l'ADN dans des cellules grâce à un champ électrique.", "Séparer l'ADN sur gel.", "Séquencer l'ADN.", "Amplifier l'ADN."], "correctAnswer": 0, "explanation": "Le choc électrique crée des pores transitoires dans la membrane cellulaire." },
                        { "id": 58, "question": "La ligation TA est une méthode de clonage qui exploite :", "options": ["L'ajout d'un 'A' en 3' par la Taq Polymérase.", "Les bouts francs.", "Les sites de restriction.", "La recombinaison."], "correctAnswer": 0, "explanation": "Les vecteurs T possèdent un 'T' sortant complémentaire du 'A' ajouté par la Taq sur le produit PCR." },
                        { "id": 59, "question": "Le séquençage Ion Torrent mesure :", "options": ["La libération d'ions H+ (changement de pH) lors de la polymérisation.", "La lumière.", "La fluorescence.", "La masse."], "correctAnswer": 0, "explanation": "C'est une technique de séquençage sur semi-conducteur sans optique." },
                        { "id": 60, "question": "Un transgène 'Knock-out' (KO) sert à :", "options": ["Invalider (éteindre) définitivement un gène pour étudier sa fonction.", "Surexprimer un gène.", "Réparer un gène.", "Visualiser un gène."], "correctAnswer": 0, "explanation": "On remplace le gène fonctionnel par une version inactive." },
                        { "id": 61, "question": "Le système Cre-LoxP permet :", "options": ["De réaliser des modifications génétiques conditionnelles (tissu-spécifiques).", "De séquencer l'ADN.", "D'amplifier l'ADN.", "D'extraire l'ADN."], "correctAnswer": 0, "explanation": "L'enzyme Cre recombine l'ADN entre deux sites LoxP spécifiques." },
                        { "id": 62, "question": "La PCR nichée (Nested PCR) augmente la spécificité en :", "options": ["Utilisant deux paires d'amorces successives.", "Utilisant une température très basse.", "Utilisant plus de Taq polymérase.", "Utilisant un seul cycle."], "correctAnswer": 0, "explanation": "La deuxième PCR amplifie un produit interne à la première, réduisant les amplifications non spécifiques." },
                        { "id": 63, "question": "L'étiquette His-Tag (Poly-Histidine) sur une protéine recombinante sert à :", "options": ["Sa purification par chromatographie d'affinité sur Nickel.", "La rendre fluorescente.", "La dégrader.", "La sécréter."], "correctAnswer": 0, "explanation": "Les histidines se lient fortement aux ions métalliques immobilisés." },
                        { "id": 64, "question": "La technique RACE-PCR (Rapid Amplification of cDNA Ends) permet d'obtenir :", "options": ["Les extrémités 5' ou 3' inconnues d'un ADNc.", "La séquence centrale.", "L'ADN génomique.", "Les introns."], "correctAnswer": 0, "explanation": "Utile pour obtenir la séquence complète d'un ARNm." },
                        { "id": 65, "question": "Un épitope est :", "options": ["La partie d'un antigène reconnue par un anticorps.", "Une enzyme.", "Un gène.", "Un lipide."], "correctAnswer": 0, "explanation": "Le marquage par épitope (ex: Flag, Myc) permet la détection par anticorps." },
                        { "id": 66, "question": "La technique du 'Shotgun' en séquençage consiste à :", "options": ["Fragmenter l'ADN aléatoirement, séquencer les bouts et assembler informatiquement.", "Séquencer base par base linéairement.", "Amplifier par PCR.", "Utiliser des amorces spécifiques."], "correctAnswer": 0, "explanation": "C'est la méthode standard pour les génomes entiers." },
                        { "id": 67, "question": "L'hybridation in situ permet de visualiser :", "options": ["La localisation des ARNm dans un tissu ou une cellule.", "La quantité totale d'ADN.", "La taille des protéines.", "La séquence exacte."], "correctAnswer": 0, "explanation": "Elle préserve la morphologie du tissu." },
                        { "id": 68, "question": "Les amorces dégénérées sont utilisées quand :", "options": ["On ne connaît pas la séquence exacte, mais on connaît la protéine.", "On veut une spécificité absolue.", "On séquence le génome.", "On fait une qPCR."], "correctAnswer": 0, "explanation": "Elles contiennent un mélange de bases à certaines positions pour couvrir la dégénérescence du code génétique." },
                        { "id": 69, "question": "Le TDT (Terminal Deoxynucleotidyl Transferase) est une enzyme qui :", "options": ["Ajoute des nucléotides en 3' sans matrice.", "Copie une matrice.", "Coupe l'ADN.", "Ligue l'ADN."], "correctAnswer": 0, "explanation": "Utilisée pour le marquage terminal ou l'ajout de queues homopolymères (Tailing)." },
                        { "id": 70, "question": "La transfection transitoire signifie que :", "options": ["L'ADN entré n'est pas intégré au génome et est perdu au fil des divisions.", "L'ADN est intégré définitivement.", "La cellule meurt.", "L'ADN est répliqué indéfiniment."], "correctAnswer": 0, "explanation": "L'expression du gène est temporaire." },
                        { "id": 71, "question": "La transfection stable nécessite :", "options": ["L'intégration de l'ADN dans le génome de l'hôte et une sélection.", "Juste l'entrée de l'ADN.", "Une lyse cellulaire.", "Une PCR."], "correctAnswer": 0, "explanation": "Le gène est transmis aux cellules filles." },
                        { "id": 72, "question": "Le gène rapporteur GFP provient de :", "options": ["La méduse Aequorea victoria.", "La luciole.", "La bactérie E. coli.", "L'humain."], "correctAnswer": 0, "explanation": "C'est une protéine naturellement fluorescente verte." },
                        { "id": 73, "question": "La dialyse en biochimie sert principalement à :", "options": ["Éliminer les sels et petites molécules d'une solution de macromolécules.", "Séparer les protéines par taille.", "Séquencer l'ADN.", "Amplifier l'ADN."], "correctAnswer": 0, "explanation": "Basée sur la diffusion à travers une membrane semi-perméable." },
                        { "id": 74, "question": "La colonne de silice (Miniprep) retient l'ADN en présence de :", "options": ["Sels chaotropes forts.", "Eau pure.", "Détergents.", "Protéines."], "correctAnswer": 0, "explanation": "Les sels chaotropes déstructurent l'eau et favorisent l'adsorption de l'ADN sur la silice." },
                        { "id": 75, "question": "L'élution de l'ADN d'une colonne de silice se fait avec :", "options": ["De l'eau ou un tampon faible en sel.", "De l'alcool.", "Du sel fort.", "Du phénol."], "correctAnswer": 0, "explanation": "L'eau réhydrate la silice et libère l'ADN." },
                        { "id": 76, "question": "Le bromophénol bleu migre dans un gel d'agarose 1% environ comme un fragment de :", "options": ["300-500 pb.", "1000 pb.", "50 pb.", "10 000 pb."], "correctAnswer": 0, "explanation": "Il sert de repère visuel de migration." },
                        { "id": 77, "question": "Les isoschizomères sont des enzymes de restriction qui :", "options": ["Reconnaissent la même séquence cible.", "Coupent toujours au même endroit.", "Sont isolées du même organisme.", "Ne coupent pas l'ADN."], "correctAnswer": 0, "explanation": "Elles peuvent couper différemment (néoschizomères) ou identiquement." },
                        { "id": 78, "question": "La carte de restriction est :", "options": ["La position relative des sites de coupure sur un fragment d'ADN.", "Une séquence d'ADN.", "Une carte géographique.", "Une liste de gènes."], "correctAnswer": 0, "explanation": "Elle permet de caractériser un plasmide ou un fragment." },
                        { "id": 79, "question": "La marche sur le chromosome (Primer Walking) est une stratégie pour :", "options": ["Séquencer de longs fragments d'ADN étape par étape.", "Marcher sur l'ADN.", "Amplifier l'ADN.", "Couper l'ADN."], "correctAnswer": 0, "explanation": "On utilise la fin de la séquence lue pour dessiner l'amorce suivante." },
                        { "id": 80, "question": "Une banque d'expression est conçue pour :", "options": ["Produire les protéines codées par les clones.", "Stocker l'ADN seulement.", "Séquencer l'ADN.", "Étudier les promoteurs."], "correctAnswer": 0, "explanation": "Les vecteurs contiennent des promoteurs actifs pour la transcription et la traduction." },
                        { "id": 81, "question": "Le système CRISPR vient à l'origine de :", "options": ["L'immunité adaptative des bactéries contre les virus.", "Des cellules humaines.", "Des plantes.", "Des levures."], "correctAnswer": 0, "explanation": "Les bactéries stockent des fragments d'ADN viral pour les reconnaître et les couper ultérieurement." },
                        { "id": 82, "question": "L'enzyme Cas9 est une :", "options": ["Endonucléase guidée par ARN.", "Polymérase.", "Ligase.", "Exonucléase."], "correctAnswer": 0, "explanation": "Elle coupe le double brin d'ADN à l'endroit ciblé par l'ARN guide." },
                        { "id": 83, "question": "La transfection par lipofection utilise :", "options": ["Des liposomes cationiques pour encapsuler l'ADN.", "Un virus.", "Un choc électrique.", "Un canon à particules."], "correctAnswer": 0, "explanation": "Les liposomes fusionnent avec la membrane cellulaire pour livrer l'ADN." },
                        { "id": 84, "question": "Un SNV (Single Nucleotide Variant) est synonyme de :", "options": ["Mutation ponctuelle.", "Délétion.", "Insertion.", "Duplication."], "correctAnswer": 0, "explanation": "C'est le terme moderne pour SNP (polymorphisme) sans notion de fréquence." },
                        { "id": 85, "question": "L'analyse de microsatellites est utilisée pour :", "options": ["L'identification génétique (empreinte génétique).", "Le séquençage complet.", "L'expression des gènes.", "La synthèse de protéines."], "correctAnswer": 0, "explanation": "Les répétitions courtes en tandem (STR) sont très variables entre individus." },
                        { "id": 86, "question": "La PCR multiplex permet de :", "options": ["Amplifier plusieurs cibles différentes dans le même tube.", "Amplifier un seul gène.", "Séquencer.", "Extraire l'ADN."], "correctAnswer": 0, "explanation": "Elle utilise plusieurs paires d'amorces simultanément." },
                        { "id": 87, "question": "Le contrôle négatif en PCR (NTC) contient :", "options": ["Tous les réactifs sauf l'ADN matrice (remplacé par de l'eau).", "De l'ADN non spécifique.", "Pas d'enzyme.", "Pas d'amorces."], "correctAnswer": 0, "explanation": "Il vérifie l'absence de contamination." },
                        { "id": 88, "question": "Le contrôle positif en PCR contient :", "options": ["Une matrice d'ADN connue pour contenir la cible.", "De l'eau.", "Une matrice vide.", "Rien."], "correctAnswer": 0, "explanation": "Il vérifie que la réaction fonctionne." },
                        { "id": 89, "question": "L'efficacité d'une PCR idéale est de :", "options": ["100% (doublement à chaque cycle).", "50%.", "200%.", "10%."], "correctAnswer": 0, "explanation": "E = 2, la quantité d'ADN double à chaque cycle." },
                        { "id": 90, "question": "La température d'élongation classique de la Taq polymérase est :", "options": ["72°C.", "37°C.", "95°C.", "55°C."], "correctAnswer": 0, "explanation": "C'est l'optimum d'activité de cette enzyme thermophile." },
                        { "id": 91, "question": "L'exonucléase I sert à :", "options": ["Dégrader les amorces simple brin restantes après PCR.", "Couper l'ADN double brin.", "Synthétiser l'ADN.", "Lier l'ADN."], "correctAnswer": 0, "explanation": "Nettoyage des produits PCR avant séquençage." },
                        { "id": 92, "question": "La phosphatase de crevette (SAP) est une alternative à :", "options": ["La phosphatase alcaline intestinale (CIP).", "La ligase.", "La kinase.", "La polymérase."], "correctAnswer": 0, "explanation": "Elle est plus facile à inactiver par la chaleur." },
                        { "id": 93, "question": "Le T4 DNA Ligase a besoin de :", "options": ["ATP.", "NAD+.", "GTP.", "CTP."], "correctAnswer": 0, "explanation": "C'est le cofacteur énergétique de la ligase du phage T4." },
                        { "id": 94, "question": "La technique du 'Dot Blot' est :", "options": ["Une hybridation sans électrophorèse (dépôt direct).", "Une électrophorèse.", "Une PCR.", "Un séquençage."], "correctAnswer": 0, "explanation": "Permet de tester rapidement la présence d'une séquence." },
                        { "id": 95, "question": "Les billes magnétiques sont utilisées pour :", "options": ["Purifier l'ADN/ARN ou les protéines par attraction magnétique.", "Colorer.", "Couper.", "Amplifier."], "correctAnswer": 0, "explanation": "Méthode d'extraction automatisable." },
                        { "id": 96, "question": "Le pyroséquençage est à la base de quelle technologie NGS ?", "options": ["454 Life Sciences (Roche).", "Illumina.", "Sanger.", "Nanopore."], "correctAnswer": 0, "explanation": "Technologie historique de séquençage haut débit." },
                        { "id": 97, "question": "La technique Illumina utilise :", "options": ["Des terminateurs réversibles fluorescents.", "La mesure de pH.", "Le pyroséquençage.", "Des nanopores."], "correctAnswer": 0, "explanation": "Séquençage par synthèse (SBS) avec blocage réversible." },
                        { "id": 98, "question": "Le séquençage PacBio (Pacific Biosciences) permet de :", "options": ["Lire de très longs fragments (Single Molecule Real Time).", "Lire des fragments courts.", "Amplifier.", "Cloner."], "correctAnswer": 0, "explanation": "Séquençage de 3ème génération." },
                        { "id": 99, "question": "L'alignement de séquences (BLAST) sert à :", "options": ["Comparer une séquence inconnue à une base de données.", "Amplifier l'ADN.", "Extraire l'ADN.", "Couper l'ADN."], "correctAnswer": 0, "explanation": "Bioinformatique fondamentale." },
                        { "id": 100, "question": "Un 'Contig' est :", "options": ["Un assemblage de séquences chevauchantes formant une séquence consensus plus longue.", "Un gène.", "Un chromosome.", "Une erreur."], "correctAnswer": 0, "explanation": "Résultat de l'assemblage de séquences shotgun." }
                    ],
                    "flashcards": [
                        { "front": "Phénol-Chloroforme", "back": "Technique d'extraction liquide-liquide qui sépare les acides nucléiques (aqueux) des protéines (organique/interface)." },

                        { "front": "Transformation bactérienne", "back": "Introduction d'ADN étranger (plasmide) dans une bactérie compétente." },
                        { "front": "Sélection Bleu/Blanc", "back": "Méthode utilisant le gène LacZ et le X-Gal pour identifier les colonies ayant intégré un insert (blanches)." },

                        { "front": "BAC", "back": "Chromosome Artificiel Bactérien. Vecteur pour grands inserts (100-300 kb)." },

                        { "front": "FISH", "back": "Hybridation In Situ Fluorescente. Localisation sur chromosomes." },

                        { "front": "Isoschizomères", "back": "Enzymes de restriction différentes reconnaissant la même séquence." },

                    ]

                {
