                    "questions": [
                        { "id": 1, "question": "Quelle est la définition principale d'une enzyme ?", "options": ["Un catalyseur biologique qui accélère les réactions sans être consommé.", "Une protéine de structure.", "Un substrat énergétique.", "Un transporteur membranaire."], "correctAnswer": 0, "explanation": "Les enzymes abaissent l'énergie d'activation de la réaction, permettant qu'elle se produise plus vite à température corporelle." },
                        { "id": 2, "question": "La plupart des enzymes sont de nature :", "options": ["Lipidique.", "Protéique.", "Glucidique.", "Minérale."], "correctAnswer": 1, "explanation": "Ce sont des protéines globulaires (sauf les ribozymes qui sont des ARN)." },
                        { "id": 3, "question": "Le site actif d'une enzyme est :", "options": ["La région qui fixe le substrat et catalyse la réaction.", "La région qui fixe les inhibiteurs allostériques.", "Toute la surface de la protéine.", "La partie hydrophobe interne."], "correctAnswer": 0, "explanation": "C'est une poche spécifique où les résidus d'acides aminés interagissent directement avec le substrat." },
                        { "id": 4, "question": "Le modèle 'clé-serrure' de Fischer suggère que :", "options": ["Le site actif est rigide et parfaitement complémentaire du substrat.", "Le site actif change de forme en présence du substrat.", "L'enzyme est flexible.", "Le substrat modifie l'enzyme."], "correctAnswer": 0, "explanation": "Ce modèle historique a été affiné par le modèle de l'ajustement induit (Koshland)." },
                        { "id": 5, "question": "Le modèle de l'ajustement induit (Koshland) propose que :", "options": ["La fixation du substrat induit un changement de conformation de l'enzyme.", "L'enzyme est rigide.", "Le substrat est rigide.", "L'enzyme ne bouge pas."], "correctAnswer": 0, "explanation": "L'enzyme s'adapte à la forme du substrat pour optimiser l'état de transition." },
                        { "id": 6, "question": "Une holoenzyme est constituée de :", "options": ["L'apoenzyme (protéine) et son cofacteur.", "L'apoenzyme seule.", "Le cofacteur seul.", "L'enzyme et son inhibiteur."], "correctAnswer": 0, "explanation": "C'est la forme complète et catalytiquement active." },
                        { "id": 7, "question": "Un cofacteur peut être :", "options": ["Un ion métallique ou une coenzyme organique.", "Un acide aminé.", "Un lipide.", "Un sucre."], "correctAnswer": 0, "explanation": "Les cofacteurs assistent l'enzyme dans la catalyse (ex: Mg2+, NAD+)." },
                        { "id": 8, "question": "Une coenzyme prosthétique est :", "options": ["Liée de façon covalente ou très forte à l'enzyme.", "Liée faiblement et transitoirement.", "Toujours un ion métallique.", "Jamais une vitamine."], "correctAnswer": 0, "explanation": "Elle ne se dissocie pas de l'enzyme (ex: FAD, Hème, Biotine)." },
                        { "id": 9, "question": "Une cosubstrat est une coenzyme qui :", "options": ["Se lie transitoirement et est modifiée au cours de la réaction (ex: NAD+).", "Reste fixée à l'enzyme.", "N'est pas modifiée.", "Est un métal."], "correctAnswer": 0, "explanation": "Elle entre et sort du site actif comme un substrat." },
                        { "id": 10, "question": "L'unité d'activité enzymatique (UI) correspond à :", "options": ["La quantité d'enzyme transformant 1 micromole de substrat par minute.", "La quantité transformant 1 mole par seconde.", "La masse de l'enzyme.", "La concentration en substrat."], "correctAnswer": 0, "explanation": "C'est l'unité standard internationale (le Katal est l'unité SI : moles/seconde)." },
                        { "id": 11, "question": "La vitesse initiale (Vi) d'une réaction enzymatique est mesurée :", "options": ["Au tout début de la réaction, quand la concentration en produit est négligeable.", "À la fin de la réaction.", "Quand tout le substrat est consommé.", "À l'équilibre."], "correctAnswer": 0, "explanation": "Cela permet de négliger la réaction inverse et la diminution du substrat." },
                        { "id": 12, "question": "La constante de Michaelis (Km) représente :", "options": ["La concentration en substrat pour laquelle la vitesse est égale à Vmax/2.", "La vitesse maximale.", "L'affinité de l'inhibiteur.", "La température optimale."], "correctAnswer": 0, "explanation": "C'est une mesure inverse de l'affinité de l'enzyme pour son substrat." },
                        { "id": 13, "question": "Un Km faible signifie que :", "options": ["L'enzyme a une forte affinité pour le substrat.", "L'enzyme a une faible affinité.", "L'enzyme est lente.", "L'enzyme est dénaturée."], "correctAnswer": 0, "explanation": "Il faut peu de substrat pour saturer l'enzyme à 50%." },
                        { "id": 14, "question": "La Vmax (Vitesse Maximale) est atteinte quand :", "options": ["Toutes les molécules d'enzyme sont saturées par le substrat.", "Il n'y a plus de substrat.", "Le pH est acide.", "La température est nulle."], "correctAnswer": 0, "explanation": "L'enzyme travaille à pleine capacité (état stationnaire)." },
                        { "id": 15, "question": "L'équation de Michaelis-Menten est :", "options": ["Vi = (Vmax . [S]) / (Km + [S])", "Vi = Vmax . Km", "Vi = [S] / Vmax", "Vi = Km + [S]"], "correctAnswer": 0, "explanation": "Elle décrit la courbe hyperbolique de la vitesse en fonction du substrat." },
                        { "id": 16, "question": "La représentation de Lineweaver-Burk est :", "options": ["Une droite obtenue en traçant 1/Vi en fonction de 1/[S] (Double inverse).", "Une hyperbole.", "Une sigmoïde.", "Une courbe exponentielle."], "correctAnswer": 0, "explanation": "Elle permet de déterminer graphiquement Vmax et Km plus précisément." },
                        { "id": 17, "question": "Sur un graphique Lineweaver-Burk, l'intersection avec l'axe des ordonnées (Y) donne :", "options": ["1/Vmax", "-1/Km", "Km/Vmax", "Vmax"], "correctAnswer": 0, "explanation": "L'ordonnée à l'origine est l'inverse de la vitesse maximale." },
                        { "id": 18, "question": "Sur un graphique Lineweaver-Burk, l'intersection avec l'axe des abscisses (X) donne :", "options": ["-1/Km", "1/Vmax", "Km", "Vmax"], "correctAnswer": 0, "explanation": "L'abscisse à l'origine permet de calculer le Km." },
                        { "id": 19, "question": "Le nombre de rotation (kcat) ou turnover number est :", "options": ["Le nombre de molécules de substrat transformées par molécule d'enzyme par seconde.", "La vitesse initiale.", "Le temps de demi-vie.", "La constante d'inhibition."], "correctAnswer": 0, "explanation": "Kcat = Vmax / [Enzyme totale]. C'est une mesure de l'efficacité catalytique." },
                        { "id": 20, "question": "L'efficacité catalytique est définie par le rapport :", "options": ["kcat / Km", "Km / kcat", "Vmax / Km", "Km / Vmax"], "correctAnswer": 0, "explanation": "Plus ce rapport est élevé, plus l'enzyme est efficace (spécificité)." },
                        { "id": 21, "question": "Un inhibiteur compétitif :", "options": ["Se fixe sur le site actif et ressemble au substrat.", "Se fixe ailleurs que sur le site actif.", "Détruit l'enzyme.", "Modifie la Vmax."], "correctAnswer": 0, "explanation": "Il entre en compétition directe avec le substrat." },
                        { "id": 22, "question": "L'effet d'un inhibiteur compétitif sur les paramètres cinétiques est :", "options": ["Vmax inchangée, Km augmente.", "Vmax diminue, Km inchangé.", "Vmax diminue, Km diminue.", "Vmax augmente."], "correctAnswer": 0, "explanation": "On peut lever l'inhibition en ajoutant beaucoup de substrat (Vmax atteinte), mais l'affinité apparente baisse." },
                        { "id": 23, "question": "Un inhibiteur non-compétitif :", "options": ["Se fixe sur un site distinct du site actif, que le substrat soit lié ou non.", "Se fixe uniquement sur le complexe Enzyme-Substrat.", "Se fixe sur le site actif.", "Ressemble au substrat."], "correctAnswer": 0, "explanation": "Il empêche la catalyse mais pas la fixation du substrat." },
                        { "id": 24, "question": "L'effet d'un inhibiteur non-compétitif est :", "options": ["Vmax diminue, Km inchangé.", "Vmax inchangée, Km augmente.", "Vmax diminue, Km diminue.", "Rien."], "correctAnswer": 0, "explanation": "Il inactive une partie des enzymes, c'est comme s'il y en avait moins (baisse Vmax)." },
                        { "id": 25, "question": "Un inhibiteur incompétitif (uncompetitive) se fixe :", "options": ["Uniquement sur le complexe Enzyme-Substrat (ES).", "Sur l'enzyme libre.", "Sur le site actif.", "N'importe où."], "correctAnswer": 0, "explanation": "Il a besoin que le substrat soit déjà fixé pour se lier." },
                        { "id": 26, "question": "L'effet d'un inhibiteur incompétitif est :", "options": ["Vmax diminue et Km diminue.", "Vmax augmente.", "Km augmente.", "Aucun effet."], "correctAnswer": 0, "explanation": "Il stabilise le complexe ES (augmente l'affinité apparente donc baisse Km) mais bloque la catalyse (baisse Vmax)." },
                        { "id": 27, "question": "Les enzymes allostériques présentent une courbe cinétique :", "options": ["Sigmoïde (en S).", "Hyperbolique.", "Linéaire.", "Exponentielle."], "correctAnswer": 0, "explanation": "Cela reflète la coopérativité entre les sous-unités." },
                        { "id": 28, "question": "L'effet coopératif positif signifie que :", "options": ["La fixation d'un substrat facilite la fixation des suivants.", "La fixation d'un substrat empêche les autres.", "L'enzyme se dégrade.", "L'enzyme change de pH."], "correctAnswer": 0, "explanation": "Transition de l'état T (tendu, faible affinité) vers l'état R (relâché, haute affinité)." },
                        { "id": 29, "question": "Un effecteur allostérique se fixe sur :", "options": ["Un site de régulation distinct du site actif.", "Le site actif.", "Le substrat.", "L'ADN."], "correctAnswer": 0, "explanation": "Il modifie la conformation de l'enzyme à distance." },
                        { "id": 30, "question": "La phosphofructokinase-1 (PFK-1) est une enzyme allostérique inhibée par :", "options": ["L'ATP et le Citrate.", "L'AMP.", "Le Fructose-2,6-bisphosphate.", "Le Glucose."], "correctAnswer": 0, "explanation": "Signaux d'abondance énergétique." },
                        { "id": 31, "question": "La phosphorylation est un mécanisme de régulation par :", "options": ["Modification covalente réversible.", "Allostérie.", "Clivage protéolytique.", "Inhibition compétitive."], "correctAnswer": 0, "explanation": "Ajout d'un phosphate (par une kinase) ou retrait (par une phosphatase) modifie l'activité." },
                        { "id": 32, "question": "Les zymogènes (proenzymes) sont activés par :", "options": ["Clivage protéolytique irréversible.", "Phosphorylation.", "Fixation de cofacteur.", "Changement de pH."], "correctAnswer": 0, "explanation": "Exemple : Trypsinogène clivé en Trypsine." },
                        { "id": 33, "question": "La température optimale d'une enzyme humaine est généralement :", "options": ["37°C.", "20°C.", "60°C.", "100°C."], "correctAnswer": 0, "explanation": "Au-delà, l'agitation thermique dénature la protéine." },
                        { "id": 34, "question": "Le pH optimal de la pepsine (estomac) est :", "options": ["pH 2.", "pH 7.", "pH 9.", "pH 5."], "correctAnswer": 0, "explanation": "Adapté au milieu acide gastrique." },
                        { "id": 35, "question": "Les isoenzymes sont :", "options": ["Des formes différentes d'une enzyme catalysant la même réaction.", "Des enzymes différentes.", "Des inhibiteurs.", "Des cofacteurs."], "correctAnswer": 0, "explanation": "Elles ont des propriétés cinétiques et des localisations tissulaires différentes (ex: LDH1 à 5)." },
                        { "id": 36, "question": "La LDH (Lactate Déshydrogénase) possède combien d'isoenzymes ?", "options": ["5.", "2.", "10.", "1."], "correctAnswer": 0, "explanation": "Combinaisons des sous-unités H (Cœur) et M (Muscle) : H4, H3M, H2M2, HM3, M4." },
                        { "id": 37, "question": "Quelle classe d'enzyme catalyse des réactions d'oxydoréduction ?", "options": ["Oxydoréductases (Classe 1).", "Transférases.", "Hydrolases.", "Ligases."], "correctAnswer": 0, "explanation": "Transfert d'électrons (ex: Déshydrogénases)." },
                        { "id": 38, "question": "Les kinases appartiennent à la classe des :", "options": ["Transférases (Classe 2).", "Oxydoréductases.", "Isomérases.", "Ligases."], "correctAnswer": 0, "explanation": "Elles transfèrent un groupement phosphate (généralement de l'ATP)." },
                        { "id": 39, "question": "Les enzymes digestives (Trypsine, Amylase) sont des :", "options": ["Hydrolases (Classe 3).", "Lyases.", "Ligases.", "Transférases."], "correctAnswer": 0, "explanation": "Elles coupent des liaisons en ajoutant une molécule d'eau." },
                        { "id": 40, "question": "Une Lyase (Classe 4) catalyse :", "options": ["L'addition ou le départ de groupes avec formation de double liaison (sans eau).", "L'hydrolyse.", "L'isomérisation.", "La synthèse avec ATP."], "correctAnswer": 0, "explanation": "Exemple : Aldolase, Énolase." },
                        { "id": 41, "question": "Une Isomérase (Classe 5) catalyse :", "options": ["Le réarrangement intramoléculaire.", "Le transfert de groupe.", "L'oxydation.", "La coupure."], "correctAnswer": 0, "explanation": "Exemple : Phosphoglucomutase." },
                        { "id": 42, "question": "Une Ligase (Classe 6) catalyse :", "options": ["La formation de liaisons couplée à l'hydrolyse d'ATP.", "La coupure.", "Le transfert.", "L'oxydation."], "correctAnswer": 0, "explanation": "Aussi appelées synthétases (ex: Pyruvate Carboxylase)." },
                        { "id": 43, "question": "Le site actif contient souvent des acides aminés :", "options": ["Polaires ou chargés (Ser, His, Asp, Cys).", "Uniquement hydrophobes.", "Uniquement Glycine.", "Aucun."], "correctAnswer": 0, "explanation": "Pour participer à la catalyse acide-base ou covalente." },
                        { "id": 44, "question": "La catalyse acide-base générale implique :", "options": ["Un transfert de proton (H+).", "Un transfert d'électron.", "Une liaison covalente.", "Un métal."], "correctAnswer": 0, "explanation": "Souvent médiée par l'Histidine (pKa proche de la neutralité)." },
                        { "id": 45, "question": "L'aspirine inhibe la COX (Cycloxygénase) de manière :", "options": ["Irréversible (Acétylation covalente).", "Compétitive réversible.", "Non-compétitive.", "Allostérique."], "correctAnswer": 0, "explanation": "C'est un inhibiteur suicide." },
                        { "id": 46, "question": "Le Diisopropylfluorophosphate (DFP) est un poison qui inhibe les enzymes à :", "options": ["Sérine active (ex: Acétylcholinestérase).", "Cystéine.", "Histidine.", "Métal."], "correctAnswer": 0, "explanation": "Gaz de combat neurotoxique." },
                        { "id": 47, "question": "La créatine kinase (CK) est un marqueur de :", "options": ["Lésion musculaire ou cardiaque (Infarctus).", "Lésion hépatique.", "Lésion rénale.", "Infection."], "correctAnswer": 0, "explanation": "Surtout l'isoforme CK-MB (coeur)." },
                        { "id": 48, "question": "Les transaminases (ALAT, ASAT) sont élevées lors de :", "options": ["Lésions hépatiques (Hépatite).", "Lésions osseuses.", "Problèmes de vue.", "Grippe."], "correctAnswer": 0, "explanation": "Marqueurs de cytolyse hépatique." },
                        { "id": 49, "question": "La phosphatase alcaline est un marqueur de :", "options": ["Cholestase (Bile) et Pathologie osseuse.", "Coeur.", "Muscle.", "Cerveau."], "correctAnswer": 0, "explanation": "Présente dans le foie (canaux biliaires) et les os (ostéoblastes)." },
                        { "id": 50, "question": "Le NAD+ dérive de quelle vitamine ?", "options": ["Vitamine B3 (Niacine).", "Vitamine B1.", "Vitamine B2.", "Vitamine C."], "correctAnswer": 0, "explanation": "Coenzyme d'oxydoréduction mobile." },
                        { "id": 51, "question": "Le FAD dérive de quelle vitamine ?", "options": ["Vitamine B2 (Riboflavine).", "Vitamine B1.", "Vitamine B6.", "Vitamine A."], "correctAnswer": 0, "explanation": "Coenzyme d'oxydoréduction prosthétique (liée)." },
                        { "id": 52, "question": "Le Pyridoxal Phosphate (PLP) dérive de :", "options": ["Vitamine B6.", "Vitamine B12.", "Vitamine B1.", "Biotine."], "correctAnswer": 0, "explanation": "Cofacteur des transaminases." },
                        { "id": 53, "question": "La Thiamine Pyrophosphate (TPP) dérive de :", "options": ["Vitamine B1.", "Vitamine B2.", "Vitamine B3.", "Vitamine B5."], "correctAnswer": 0, "explanation": "Cofacteur de décarboxylation (PDH)." },
                        { "id": 54, "question": "La Biotine (B8) est le cofacteur des :", "options": ["Carboxylases.", "Kinases.", "Oxydases.", "Isomérases."], "correctAnswer": 0, "explanation": "Transporte le CO2 (ex: Pyruvate Carboxylase)." },
                        { "id": 55, "question": "Le Coenzyme A dérive de :", "options": ["Vitamine B5 (Acide pantothénique).", "Vitamine B6.", "Vitamine B1.", "Vitamine B12."], "correctAnswer": 0, "explanation": "Transporteur de groupements acyles (Thioester)." },
                        { "id": 56, "question": "L'énergie d'activation est :", "options": ["L'énergie nécessaire pour atteindre l'état de transition.", "L'énergie libérée par la réaction.", "La différence d'énergie entre substrat et produit.", "L'énergie de liaison."], "correctAnswer": 0, "explanation": "L'enzyme abaisse cette barrière énergétique." },
                        { "id": 57, "question": "Une réaction exergonique (Delta G < 0) est :", "options": ["Spontanée.", "Impossible.", "Consommatrice d'énergie.", "À l'équilibre."], "correctAnswer": 0, "explanation": "Elle libère de l'énergie libre." },
                        { "id": 58, "question": "Les enzymes modifient-elles l'équilibre de la réaction (Keq) ?", "options": ["Non, elles accélèrent seulement l'atteinte de l'équilibre.", "Oui, elles déplacent l'équilibre.", "Oui, elles changent le Delta G.", "Oui, elles créent de l'énergie."], "correctAnswer": 0, "explanation": "Elles ne changent pas la thermodynamique, seulement la cinétique." },
                        { "id": 59, "question": "L'état de transition est :", "options": ["Un état instable et transitoire de haute énergie.", "Un produit stable.", "Un substrat.", "Un inhibiteur."], "correctAnswer": 0, "explanation": "C'est le sommet de la barrière énergétique." },
                        { "id": 60, "question": "La spécificité d'une enzyme concerne :", "options": ["Le substrat et le type de réaction.", "Le pH uniquement.", "La température uniquement.", "Le temps."], "correctAnswer": 0, "explanation": "Stéréospécificité (reconnaît un isomère précis) et spécificité de réaction." },
                        { "id": 61, "question": "Qu'est-ce qu'une métalloenzyme ?", "options": ["Une enzyme contenant un ion métallique fermement lié.", "Une enzyme faite de métal.", "Une enzyme qui dégrade le métal.", "Une enzyme sans cofacteur."], "correctAnswer": 0, "explanation": "Ex: Anhydrase carbonique (Zinc)." },
                        { "id": 62, "question": "Le PALA est un inhibiteur de l'ATCase qui ressemble à :", "options": ["L'état de transition de la réaction.", "Au substrat.", "Au produit.", "À rien."], "correctAnswer": 0, "explanation": "C'est un analogue de l'état de transition, donc il se lie très fortement." },
                        { "id": 63, "question": "L'inhibition par rétrocontrôle (feedback) signifie que :", "options": ["Le produit final d'une voie inhibe l'enzyme de la première étape.", "Le substrat active l'enzyme.", "L'enzyme s'auto-détruit.", "Le produit active l'enzyme."], "correctAnswer": 0, "explanation": "Régulation économique pour éviter la surproduction." },
                        { "id": 64, "question": "L'équation de Hill décrit :", "options": ["La cinétique des enzymes allostériques (sigmoïde).", "La cinétique michaelienne.", "La diffusion.", "La température."], "correctAnswer": 0, "explanation": "Le coefficient de Hill (h) mesure la coopérativité." },
                        { "id": 65, "question": "Si h (Hill) > 1, la coopérativité est :", "options": ["Positive.", "Négative.", "Absente.", "Infinie."], "correctAnswer": 0, "explanation": "La fixation d'un substrat facilite la fixation des suivants." },
                        { "id": 66, "question": "L'état T (Tendu) d'une enzyme allostérique a :", "options": ["Une faible affinité pour le substrat.", "Une forte affinité.", "La même affinité.", "Pas d'activité."], "correctAnswer": 0, "explanation": "C'est la forme inactive prédominante en absence de substrat/activateur." },
                        { "id": 67, "question": "L'état R (Relâché) d'une enzyme allostérique a :", "options": ["Une forte affinité pour le substrat.", "Une faible affinité.", "Est instable.", "N'existe pas."], "correctAnswer": 0, "explanation": "C'est la forme active." },
                        { "id": 68, "question": "La régulation hétérotrope concerne :", "options": ["La régulation par une molécule différente du substrat (effecteur).", "La régulation par le substrat lui-même.", "La température.", "Le pH."], "correctAnswer": 0, "explanation": "Ex: Inhibition de l'ATCase par le CTP." },
                        { "id": 69, "question": "La régulation homotrope concerne :", "options": ["La régulation par le substrat lui-même (coopérativité).", "Un effecteur externe.", "La phosphorylation.", "Le clivage."], "correctAnswer": 0, "explanation": "Ex: Fixation de l'oxygène sur l'hémoglobine." },
                        { "id": 70, "question": "Le méthotrexate est un inhibiteur de type :", "options": ["Compétitif (de la DHFR).", "Non-compétitif.", "Incompétitif.", "Allostérique."], "correctAnswer": 0, "explanation": "Il ressemble structurellement au dihydrofolate." },
                        { "id": 71, "question": "La pénicilline est un inhibiteur :", "options": ["Irréversible (Suicide) de la transpeptidase bactérienne.", "Compétitif.", "Allostérique.", "Réversible."], "correctAnswer": 0, "explanation": "Elle forme une liaison covalente avec la sérine du site actif." },
                        { "id": 72, "question": "Le VImax apparent en présence d'un inhibiteur non-compétitif est :", "options": ["Inférieur au Vmax réel.", "Supérieur.", "Égal.", "Nul."], "correctAnswer": 0, "explanation": "L'inhibiteur diminue la capacité catalytique totale." },
                        { "id": 73, "question": "Le Km apparent en présence d'un inhibiteur compétitif est :", "options": ["Supérieur au Km réel (affinité baisse).", "Inférieur.", "Égal.", "Nul."], "correctAnswer": 0, "explanation": "Il faut plus de substrat pour déplacer l'inhibiteur." },
                        { "id": 74, "question": "La catalase transforme :", "options": ["Le peroxyde d'hydrogène (H2O2) en eau et oxygène.", "Le glucose.", "Les lipides.", "L'urée."], "correctAnswer": 0, "explanation": "Enzyme antioxydante très rapide (Kcat élevé)." },
                        { "id": 75, "question": "Le lysozyme coupe :", "options": ["La paroi bactérienne (Peptidoglycane).", "L'ADN.", "Les protéines.", "Les lipides."], "correctAnswer": 0, "explanation": "Hydrolyse la liaison entre NAM et NAG." },
                        { "id": 76, "question": "La chymotrypsine utilise une triade catalytique composée de :", "options": ["Sérine, Histidine, Aspartate.", "Sérine, Lysine, Glu.", "Cystéine, His, Asp.", "Trois sérines."], "correctAnswer": 0, "explanation": "Mécanisme classique des sérine-protéases." },
                        { "id": 77, "question": "Le Zinc dans l'anhydrase carbonique sert à :", "options": ["Activer une molécule d'eau (pour attaquer le CO2).", "Lier l'ATP.", "Oxydation.", "Réduction."], "correctAnswer": 0, "explanation": "Cofacteur métallique essentiel." },
                        { "id": 78, "question": "Les enzymes de restriction sont des :", "options": ["Endonucléases.", "Exonucléases.", "Ligases.", "Polymérases."], "correctAnswer": 0, "explanation": "Elles coupent à l'intérieur de la chaîne d'ADN." },
                        { "id": 79, "question": "Un abzyme est :", "options": ["Un anticorps doté d'activité catalytique.", "Une enzyme anormale.", "Un substrat.", "Un cofacteur."], "correctAnswer": 0, "explanation": "Créé artificiellement pour stabiliser l'état de transition." },
                        { "id": 80, "question": "La constante de spécificité est :", "options": ["kcat / Km.", "kcat * Km.", "Vmax / Km.", "Km / Vmax."], "correctAnswer": 0, "explanation": "Meilleur indicateur pour comparer des substrats." },
                        { "id": 81, "question": "L'activité spécifique (AS) s'exprime en :", "options": ["UI / mg de protéine.", "UI / ml.", "mg / min.", "moles / litre."], "correctAnswer": 0, "explanation": "Mesure la pureté de l'enzyme." },
                        { "id": 82, "question": "La purification d'une enzyme entraîne généralement :", "options": ["Une augmentation de l'activité spécifique.", "Une baisse de l'activité spécifique.", "Une baisse de l'activité totale.", "Rien."], "correctAnswer": 0, "explanation": "On enlève les protéines contaminantes, donc l'activité par mg augmente." },
                        { "id": 83, "question": "Le site allostérique est saturable :", "options": ["Vrai, comme le site actif.", "Faux.", "Dépend du pH.", "Uniquement par le substrat."], "correctAnswer": 0, "explanation": "Il y a un nombre fini de sites de régulation." },
                        { "id": 84, "question": "La phosphorylation se fait sur les résidus :", "options": ["Sérine, Thréonine, Tyrosine.", "Glycine, Alanine.", "Phénylalanine.", "Méthionine."], "correctAnswer": 0, "explanation": "Ceux qui possèdent une fonction alcool (-OH)." },
                        { "id": 85, "question": "L'Ubiquitine marque les protéines pour :", "options": ["La dégradation par le protéasome.", "L'exportation.", "L'activation.", "Le noyau."], "correctAnswer": 0, "explanation": "Régulation de la quantité d'enzyme." },
                        { "id": 86, "question": "Le produit final de la voie des purines inhibe la première enzyme. C'est :", "options": ["Une rétro-inhibition (feedback).", "Une activation.", "Une dégradation.", "Une induction."], "correctAnswer": 0, "explanation": "Contrôle homéostatique." },
                        { "id": 87, "question": "Les enzymes sériques (sang) sont utilisées en clinique pour :", "options": ["Diagnostiquer des lésions tissulaires.", "Digérer le sang.", "Transporter l'oxygène.", "Rien."], "correctAnswer": 0, "explanation": "Leur présence dans le sang est anormale et signe une lyse cellulaire." },
                        { "id": 88, "question": "La Troponine (bien que non enzyme) et la CK-MB sont marqueurs de :", "options": ["Infarctus du myocarde.", "Hépatite.", "Pancréatite.", "Cancer."], "correctAnswer": 0, "explanation": "Lésion du muscle cardiaque." },
                        { "id": 89, "question": "L'amylase et la lipase sériques augmentent lors de :", "options": ["Pancréatite aiguë.", "Infarctus.", "Hépatite.", "Grippe."], "correctAnswer": 0, "explanation": "Lésion du pancréas exocrine." },
                        { "id": 90, "question": "Les anti-inflammatoires non stéroïdiens (AINS) ciblent :", "options": ["Les cyclooxygénases (COX).", "Les lipases.", "Les kinases.", "Les protéases."], "correctAnswer": 0, "explanation": "Inhibition de la synthèse des prostaglandines." },
                        { "id": 91, "question": "Le mécanisme 'Ping-Pong' (Bi-Bi) concerne :", "options": ["Les réactions à deux substrats où un produit part avant que le 2ème substrat ne se lie.", "Une réaction simple.", "Une inhibition.", "L'allostérie."], "correctAnswer": 0, "explanation": "Caractéristique des aminotransférases (Transaminases)." },
                        { "id": 92, "question": "Un complexe ternaire est formé dans les mécanismes :", "options": ["Séquentiels (Ordonnés ou Aléatoires).", "Ping-Pong.", "Irréversibles.", "Non enzymatiques."], "correctAnswer": 0, "explanation": "L'enzyme lie les deux substrats en même temps." },
                        { "id": 93, "question": "L'énergie de liaison (Binding energy) sert à :", "options": ["Abaisser l'énergie d'activation et stabiliser l'état de transition.", "Chauffer.", "Détruire le substrat.", "Rien."], "correctAnswer": 0, "explanation": "Source majeure de l'efficacité enzymatique." },
                        { "id": 94, "question": "La constante de dissociation (Kd) du complexe ES est approximée par :", "options": ["Km (si k2 << k-1).", "Vmax.", "kcat.", "Ki."], "correctAnswer": 0, "explanation": "Dans l'hypothèse de l'équilibre rapide." },
                        { "id": 95, "question": "L'état stationnaire (Steady state) signifie que :", "options": ["La concentration du complexe [ES] reste constante.", "La réaction est finie.", "Il n'y a plus de substrat.", "L'enzyme est morte."], "correctAnswer": 0, "explanation": "Hypothèse de base de Michaelis-Menten (Vitesse formation = Vitesse disparition)." },
                        { "id": 96, "question": "Une protéine G est active quand elle lie :", "options": ["GTP.", "GDP.", "ATP.", "ADP."], "correctAnswer": 0, "explanation": "Elle a une activité GTPase intrinsèque (minuterie)." },
                        { "id": 97, "question": "La toxine cholérique bloque la protéine Gs en :", "options": ["Inhibant son activité GTPase (reste active en permanence).", "L'empêchant de lier GTP.", "La dégradant.", "Inhibant l'adénylate cyclase."], "correctAnswer": 0, "explanation": "Entraîne une surproduction d'AMPc et une diarrhée massive." },
                        { "id": 98, "question": "L'inhibiteur suicide :", "options": ["Est transformé par l'enzyme en un composé réactif qui se lie covalemment.", "Est un inhibiteur compétitif classique.", "Est allostérique.", "Est réversible."], "correctAnswer": 0, "explanation": "Mécanisme d'inactivation irréversible (ex: Pénicilline, Aspirine)." },
                        { "id": 99, "question": "La régulation par clivage est :", "options": ["Irréversible.", "Réversible.", "Cyclique.", "Lente."], "correctAnswer": 0, "explanation": "Une fois coupé, le zymogène ne peut pas être reconstitué." },
                        { "id": 100, "question": "L'équation de Haldane relie :", "options": ["Les paramètres cinétiques (Vmax, Km) à la constante d'équilibre Keq.", "Le pH et pK.", "L'énergie libre.", "La température."], "correctAnswer": 0, "explanation": "Montre que l'enzyme ne change pas l'équilibre final." }

                    "flashcards": [
                        { "front": "Enzyme", "back": "Catalyseur biologique protéique. Accélère les réactions en abaissant l'énergie d'activation." },
                        { "front": "Site actif", "back": "Poche spécifique où se fixe le substrat et où a lieu la catalyse." },
                        { "front": "Apoenzyme", "back": "Partie protéique de l'enzyme, inactive sans son cofacteur." },
                        { "front": "Holoenzyme", "back": "Enzyme complète et active (Apoenzyme + Cofacteur)." },
                        { "front": "Cofacteur", "back": "Ion métallique ou molécule organique nécessaire à l'activité enzymatique." },
                        { "front": "Coenzyme", "back": "Cofacteur organique (souvent dérivé de vitamines)." },
                        { "front": "Cosubstrat", "back": "Coenzyme faiblement liée, qui entre et sort comme un substrat (ex: NAD+)." },
                        { "front": "Groupe prosthétique", "back": "Coenzyme liée très fortement ou covalemment (ex: FAD, Hème)." },
                        { "front": "Vitesse initiale (Vi)", "back": "Vitesse mesurée au début de la réaction, quand [S] est quasi constante." },
                        { "front": "Vmax", "back": "Vitesse maximale atteinte quand l'enzyme est saturée par le substrat." },
                        { "front": "Km (Constante de Michaelis)", "back": "Concentration en substrat pour atteindre Vmax/2. Inverse de l'affinité." },
                        { "front": "kcat (Turnover number)", "back": "Nombre de molécules de substrat transformées par enzyme par seconde." },
                        { "front": "Efficacité catalytique", "back": "Rapport kcat/Km. Mesure la performance de l'enzyme à faible [S]." },
                        { "front": "Lineweaver-Burk", "back": "Représentation en double inverse (1/V en fonction de 1/[S]). Droite." },
                        { "front": "Inhibiteur Compétitif", "back": "Se fixe sur le site actif. Augmente Km apparente, Vmax inchangée." },
                        { "front": "Inhibiteur Non-compétitif", "back": "Se fixe ailleurs. Diminue Vmax apparente, Km inchangé." },
                        { "front": "Inhibiteur Incompétitif", "back": "Se fixe sur le complexe ES. Diminue Vmax et Km." },
                        { "front": "Allostérie", "back": "Régulation par fixation d'un effecteur sur un site distant, modifiant la conformation." },
                        { "front": "Courbe Sigmoïde", "back": "Forme de la courbe V = f([S]) pour les enzymes allostériques (coopérativité)." },
                        { "front": "État T (Tendu)", "back": "Conformation de faible affinité de l'enzyme allostérique." },
                        { "front": "État R (Relâché)", "back": "Conformation de haute affinité de l'enzyme allostérique." },
                        { "front": "Effecteur homotrope", "back": "Le substrat lui-même agit comme régulateur (coopérativité)." },
                        { "front": "Effecteur hétérotrope", "back": "Une molécule différente du substrat régule l'enzyme (activateur/inhibiteur)." },
                        { "front": "Phosphorylation", "back": "Modification covalente réversible (ajout de P par kinase) régulant l'activité." },
                        { "front": "Zymogène", "back": "Précurseur inactif activé par clivage protéolytique irréversible." },
                        { "front": "Isoenzymes", "back": "Formes multiples d'une enzyme (différents gènes) avec cinétiques différentes." },
                        { "front": "Oxydoréductase", "back": "Classe 1. Transfert d'électrons (ex: Déshydrogénase)." },
                        { "front": "Transférase", "back": "Classe 2. Transfert de groupe (ex: Kinase, Transaminase)." },
                        { "front": "Hydrolase", "back": "Classe 3. Coupure avec de l'eau (ex: Phosphatase, Protéase)." },
                        { "front": "Lyase", "back": "Classe 4. Addition/Départ de groupes avec double liaison (ex: Aldolase)." },
                        { "front": "Isomérase", "back": "Classe 5. Réarrangement intramoléculaire." },
                        { "front": "Ligase (Synthétase)", "back": "Classe 6. Formation de liaison couplée à l'ATP." },
                        { "front": "Énergie d'activation", "back": "Barrière énergétique que l'enzyme abaisse pour accélérer la réaction." },
                        { "front": "État de transition", "back": "Configuration instable de haute énergie au sommet de la barrière." },
                        { "front": "Spécificité", "back": "Capacité à reconnaître un substrat unique ou une réaction unique." },
                        { "front": "Unité Internationale (UI)", "back": "Quantité d'enzyme transformant 1 micromole de substrat par minute." },
                        { "front": "Activité spécifique", "back": "Activité enzymatique par mg de protéine (mesure de pureté)." },
                        { "front": "Mécanisme Ping-Pong", "back": "Réaction à 2 substrats où un produit est libéré avant la fixation du 2ème." },
                        { "front": "Triade catalytique", "back": "Asp-His-Ser. Mécanisme des sérine-protéases (Chymotrypsine)." },
                        { "front": "Inhibiteur suicide", "back": "Modifié par l'enzyme, il se lie covalemment et la tue (irréversible)." },
                        { "front": "Pénicilline", "back": "Inhibiteur suicide de la transpeptidase bactérienne (paroi)." },
                        { "front": "Aspirine", "back": "Inhibiteur irréversible de la COX (acétylation)." },
                        { "front": "Méthotrexate", "back": "Inhibiteur compétitif de la DHFR (analogue folate)." },
                        { "front": "Statines", "back": "Inhibiteurs compétitifs de l'HMG-CoA Réductase." },
                        { "front": "Allopurinol", "back": "Inhibiteur suicide de la Xanthine Oxydase (Goutte)." },
                        { "front": "NAD+", "back": "Coenzyme oxydante (dérivée Vit B3). Accepte hydrure (H-)." },
                        { "front": "FAD", "back": "Coenzyme oxydante (dérivée Vit B2). Accepte 2H." },
                        { "front": "ATP", "back": "Coenzyme de transfert de phosphate (et énergie)." },
                        { "front": "S-Adénosyl-Méthionine", "back": "Coenzyme de transfert de méthyle." },
                        { "front": "Biotine", "back": "Coenzyme de transfert de CO2 (Carboxylases)." },
                        { "front": "PLP", "back": "Coenzyme des transaminases (dérivé B6)." }
                    ]
                },

                    "description": "Biosynthèse, Enzymes (P450), Régulation et Pathologies surrénaliennes/gonadiques.",
                    "questions": [
                        { "id": 1, "question": "Quel est le précurseur commun obligatoire de toutes les hormones stéroïdes ?", "options": ["Le cholestérol.", "L'acétyl-CoA.", "Le lanostérol.", "La progestérone."], "correctAnswer": 0, "explanation": "Toutes les hormones stéroïdes dérivent du cholestérol (C27)." },
                        { "id": 2, "question": "Quelle est la première étape limitante de la stéroïdogenèse ?", "options": ["La conversion du cholestérol en prégnénolone.", "La conversion de la prégnénolone en progestérone.", "L'entrée du cholestérol dans la cellule.", "L'aromatisation."], "correctAnswer": 0, "explanation": "C'est le clivage de la chaîne latérale du cholestérol dans la mitochondrie." },
                        { "id": 3, "question": "Quelle enzyme catalyse la conversion du cholestérol en prégnénolone ?", "options": ["La P450scc (Cholestérol desmolase / CYP11A1).", "La 3-bêta-HSD.", "L'aromatase.", "La 21-hydroxylase."], "correctAnswer": 0, "explanation": "SCC signifie 'Side Chain Cleavage'. Elle est située dans la membrane interne mitochondriale." },
                        { "id": 4, "question": "La protéine StAR (Steroidogenic Acute Regulatory protein) sert à :", "options": ["Transporter le cholestérol de la membrane externe vers la membrane interne de la mitochondrie.", "Synthétiser le cholestérol.", "Stocker le cholestérol.", "Dégrader les stéroïdes."], "correctAnswer": 0, "explanation": "C'est l'étape régulatrice aiguë limitant la vitesse de synthèse." },
                        { "id": 5, "question": "Dans quelle zone de la glande surrénale est synthétisée l'aldostérone ?", "options": ["La zone glomérulée.", "La zone fasciculée.", "La zone réticulée.", "La médullosurrénale."], "correctAnswer": 0, "explanation": "La couche la plus externe du cortex surrénalien." },
                        { "id": 6, "question": "Dans quelle zone de la glande surrénale est synthétisé le cortisol ?", "options": ["La zone réticulée.", "La zone glomérulée.", "La zone fasciculée.", "La médullosurrénale."], "correctAnswer": 2, "explanation": "La zone intermédiaire, la plus volumineuse." },
                        { "id": 7, "question": "La zone réticulée de la surrénale produit principalement :", "options": ["Des androgènes surrénaliens (DHEA).", "Du cortisol.", "De l'aldostérone.", "De l'adrénaline."], "correctAnswer": 0, "explanation": "La DHEA est un androgène faible précurseur des hormones sexuelles." },
                        { "id": 8, "question": "Combien de atomes de carbone possède le Cortisol ?", "options": ["19 Carbones.", "18 Carbones.", "21 Carbones.", "27 Carbones."], "correctAnswer": 2, "explanation": "C'est un stéroïde en C21 (noyau prégnane)." },
                        { "id": 9, "question": "Combien de atomes de carbone possède la Testostérone ?", "options": ["21 Carbones.", "19 Carbones.", "18 Carbones.", "27 Carbones."], "correctAnswer": 1, "explanation": "C'est un androgène (noyau androstane)." },
                        { "id": 10, "question": "Combien de atomes de carbone possède l'Estradiol ?", "options": ["19 Carbones.", "21 Carbones.", "27 Carbones.", "18 Carbones."], "correctAnswer": 3, "explanation": "C'est un oestrogène (noyau estrane), caractérisé par la perte du méthyle en C19." },
                        { "id": 11, "question": "Quelle enzyme est spécifique de la synthèse de l'aldostérone ?", "options": ["L'aldostérone synthase (CYP11B2).", "La 11-bêta-hydroxylase.", "La 17-alpha-hydroxylase.", "L'aromatase."], "correctAnswer": 0, "explanation": "Elle possède les activités 11-hydroxylase, 18-hydroxylase et 18-oxydase." },
                        { "id": 12, "question": "Le déficit en 21-hydroxylase (CYP21A2) entraîne :", "options": ["Une hyperplasie congénitale des surrénales avec virilisation.", "Un excès de cortisol.", "Une hypertension par excès d'aldostérone.", "Une féminisation."], "correctAnswer": 0, "explanation": "Blocage de la voie cortisol/aldostérone, déviation vers la voie des androgènes." },
                        { "id": 13, "question": "L'aromatase (CYP19A1) catalyse la transformation de :", "options": ["Testostérone en Estradiol.", "Progestérone en Cortisol.", "Cholestérol en Prégnénolone.", "Estradiol en Testostérone."], "correctAnswer": 0, "explanation": "Elle aromatise le cycle A des androgènes pour former des oestrogènes." },
                        { "id": 14, "question": "La 5-alpha réductase transforme la testostérone en :", "options": ["Dihydrotestostérone (DHT).", "Estradiol.", "Androstènedione.", "Cortisol."], "correctAnswer": 0, "explanation": "La DHT est un androgène beaucoup plus puissant que la testostérone." },
                        { "id": 15, "question": "Les récepteurs des hormones stéroïdes sont situés majoritairement :", "options": ["Dans le noyau ou le cytoplasme (intracellulaires).", "Sur la membrane plasmique.", "Dans la mitochondrie.", "Dans le lysosome."], "correctAnswer": 0, "explanation": "Les stéroïdes sont lipophiles et traversent la membrane plasmique par diffusion." },
                        { "id": 16, "question": "Une fois lié à son ligand, le récepteur stéroïdien agit comme :", "options": ["Un facteur de transcription.", "Une enzyme kinase.", "Un canal ionique.", "Un transporteur."], "correctAnswer": 0, "explanation": "Il se fixe sur des séquences d'ADN spécifiques (HRE) pour moduler l'expression des gènes." },
                        { "id": 17, "question": "HRE signifie :", "options": ["Hormone Response Element.", "Hormone Receptor Enzyme.", "Human Response Element.", "High Resistance Element."], "correctAnswer": 0, "explanation": "Séquence d'ADN reconnue par le complexe hormone-récepteur." },
                        { "id": 18, "question": "Le cortisol est transporté dans le sang principalement par :", "options": ["La CBG (Cortisol Binding Globulin) ou Transcortine.", "L'albumine seule.", "La SHBG.", "Les chylomicrons."], "correctAnswer": 0, "explanation": "La CBG lie le cortisol avec une haute affinité." },
                        { "id": 19, "question": "La testostérone circule liée principalement à :", "options": ["La SHBG (Sex Hormone Binding Globulin).", "La CBG.", "La transferrine.", "L'insuline."], "correctAnswer": 0, "explanation": "La fraction libre (non liée) est la forme biologiquement active." },
                        { "id": 20, "question": "L'ACTH (Corticotrophine) stimule la production de :", "options": ["Cortisol et Androgènes surrénaliens.", "Aldostérone uniquement.", "Adrénaline.", "Insuline."], "correctAnswer": 0, "explanation": "L'aldostérone est surtout régulée par le système rénine-angiotensine." },
                        { "id": 21, "question": "Le système Rénine-Angiotensine stimule la sécrétion de :", "options": ["Aldostérone.", "Cortisol.", "Testostérone.", "Oestrogènes."], "correctAnswer": 0, "explanation": "En réponse à une baisse de pression artérielle ou de volémie." },
                        { "id": 22, "question": "Quelle enzyme permet le passage de la Prégnénolone à la Progestérone ?", "options": ["3-bêta-HSD (Hydroxystéroïde Déshydrogénase).", "17-alpha-hydroxylase.", "21-hydroxylase.", "Aromatase."], "correctAnswer": 0, "explanation": "Elle oxyde le OH en C3 et déplace la double liaison." },
                        { "id": 23, "question": "Le déficit en 17-alpha-hydroxylase provoque :", "options": ["Une hypertension (excès minéralocorticoïdes) et un infantilisme sexuel.", "Une virilisation.", "Une hypoglycémie.", "Un excès de cortisol."], "correctAnswer": 0, "explanation": "Blocage des voies cortisol et androgènes, accumulation des précurseurs minéralocorticoïdes." },
                        { "id": 24, "question": "Quel est le rôle principal des glucocorticoïdes (Cortisol) ?", "options": ["Augmenter la glycémie (néoglucogenèse) et effet anti-inflammatoire.", "Baisser la glycémie.", "Rétention de sodium.", "Développement des caractères sexuels."], "correctAnswer": 0, "explanation": "Hormone de stress et d'adaptation métabolique." },

                        { "id": 26, "question": "La maladie d'Addison correspond à :", "options": ["Une insuffisance surrénalienne chronique (Déficit en cortisol et aldostérone).", "Un excès de cortisol.", "Un excès d'androgènes.", "Une tumeur hypophysaire."], "correctAnswer": 0, "explanation": "Souvent d'origine auto-immune (mélanodermie, hypotension)." },

                        { "id": 28, "question": "Les androgènes sont des stéroïdes à :", "options": ["19 Carbones.", "18 Carbones.", "21 Carbones.", "27 Carbones."], "correctAnswer": 0, "explanation": "Noyau androstane." },

                        { "id": 30, "question": "La Progestérone est un stéroïde à :", "options": ["21 Carbones.", "19 Carbones.", "18 Carbones.", "27 Carbones."], "correctAnswer": 0, "explanation": "Comme les corticoïdes (noyau prégnane)." },
                        { "id": 31, "question": "Le récepteur des glucocorticoïdes (GR) est maintenu inactif dans le cytoplasme par :", "options": ["Des protéines chaperonnes (HSP90).", "L'ADN.", "L'insuline.", "Le cholestérol."], "correctAnswer": 0, "explanation": "La liaison du cortisol libère le récepteur des HSP, lui permettant d'entrer dans le noyau." },
                        { "id": 32, "question": "Les enzymes du Cytochrome P450 utilisent comme cofacteur :", "options": ["Le NADPH et l'Oxygène moléculaire.", "Le NADH.", "L'ATP.", "Le FADH2."], "correctAnswer": 0, "explanation": "Ce sont des mono-oxygénases." },
                        { "id": 33, "question": "La 11-bêta-HSD type 2 (Rein) sert à :", "options": ["Désactiver le cortisol en cortisone pour protéger le récepteur minéralocorticoïde.", "Activer le cortisol.", "Synthétiser l'aldostérone.", "Dégrader l'aldostérone."], "correctAnswer": 0, "explanation": "Empêche le cortisol (très abondant) d'activer le récepteur de l'aldostérone." },
                        { "id": 34, "question": "La 11-bêta-HSD type 1 (Foie/Tissu adipeux) sert à :", "options": ["Régénérer le cortisol actif à partir de la cortisone.", "Inactiver le cortisol.", "Synthétiser l'adrénaline.", "Rien."], "correctAnswer": 0, "explanation": "Augmente l'exposition locale au cortisol (rôle dans l'obésité métabolique)." },

                        { "id": 36, "question": "Quelle hormone est sécrétée par le corps jaune ?", "options": ["Progestérone.", "Cortisol.", "Aldostérone.", "Testostérone."], "correctAnswer": 0, "explanation": "Essentielle au maintien de la grossesse." },
                        { "id": 37, "question": "La DHEA (Déhydroépiandrostérone) est :", "options": ["Un androgène surrénalien faible.", "Un oestrogène.", "Un corticoïde.", "Une enzyme."], "correctAnswer": 0, "explanation": "Précurseur périphérique des hormones sexuelles actives." },
                        { "id": 38, "question": "Quel est l'effet de la LH sur les cellules de Leydig ?", "options": ["Stimulation de la synthèse de testostérone.", "Stimulation de la spermatogenèse.", "Inhibition de la synthèse.", "Rien."], "correctAnswer": 0, "explanation": "Active la P450scc via l'AMPc." },
                        { "id": 39, "question": "Quel est l'effet de la FSH sur les cellules de la granulosa (ovaire) ?", "options": ["Stimulation de l'aromatase (synthèse d'estradiol).", "Synthèse de testostérone.", "Inhibition de l'ovulation.", "Sécrétion de cortisol."], "correctAnswer": 0, "explanation": "La testostérone fournie par la thèque est transformée en estradiol." },
                        { "id": 40, "question": "La Vitamine D est-elle un stéroïde ?", "options": ["Oui, c'est un sécostéroïde (cycle B ouvert).", "Non, c'est une amine.", "Non, c'est un lipide simple.", "Non, c'est un sucre."], "correctAnswer": 0, "explanation": "Dérivée du cholestérol, elle agit via un récepteur nucléaire (VDR)." },
                        { "id": 41, "question": "Le catabolisme des stéroïdes se fait principalement par :", "options": ["Conjugaison hépatique (sulfate/glucuronide) et excrétion urinaire.", "Oxydation complète en CO2.", "Recyclage en cholestérol.", "Stockage."], "correctAnswer": 0, "explanation": "Le noyau stéroïde n'est pas dégradé, il est rendu soluble pour être éliminé." },
                        { "id": 42, "question": "Les 17-cétostéroïdes urinaires sont un reflet de :", "options": ["La production d'androgènes surrénaliens et gonadiques.", "La production de cortisol.", "La production d'aldostérone.", "La fonction rénale."], "correctAnswer": 0, "explanation": "Métabolites des androgènes (DHEA, Androstènedione)." },
                        { "id": 43, "question": "Quel médicament est un inhibiteur de l'aromatase ?", "options": ["Anastrozole / Létrozole.", "Finastéride.", "Dexaméthasone.", "Tamoxifène."], "correctAnswer": 0, "explanation": "Utilisé dans le traitement des cancers du sein hormono-dépendants." },

                        { "id": 90, "question": "Le Donneur de méthyle SAM est-il utilisé dans la construction du noyau purine ?", "options": ["Non, c'est le THF.", "Oui pour C2.", "Oui pour C8.", "Oui pour N7."], "correctAnswer": 0, "explanation": "Le folate porte les carbones, pas le SAM." },

                        { "id": 94, "question": "Les aliments riches en purines incluent :", "options": ["Viandes rouges, abats, fruits de mer, bière.", "Lait, oeufs.", "Fruits, légumes.", "Sucre."], "correctAnswer": 0, "explanation": "À éviter en cas de goutte." },

                        { "id": 96, "question": "Le syndrome de lyse tumorale entraîne :", "options": ["Hyperuricémie, Hyperkaliémie, Hyperphosphatémie.", "Hypouricémie.", "Hypokaliémie.", "Hyponatrémie."], "correctAnswer": 0, "explanation": "Urgence métabolique." },
                        { "id": 97, "question": "La régulation de la synthèse des désoxyribonucléotides assure :", "options": ["Des quantités équilibrées de dATP, dGTP, dCTP, dTTP.", "Juste dATP.", "Excès de dTTP.", "Rien."], "correctAnswer": 0, "explanation": "Pour éviter les mutations lors de la réplication." },

                {
                    "id": "l2-lipoproteines",
                    "title": "L2 - Métabolisme des Lipoprotéines",
                    "level": "L2",
                    "description": "Structure, Transport des lipides, Apolipoprotéines, Récepteurs et Pathologies.",
                    "questions": [
                        { "id": 1, "question": "Quelle est la structure générale d'une lipoprotéine ?", "options": ["Un cœur hydrophobe (Triglycérides, Esters de cholestérol) entouré d'une couche amphiphile (Phospholipides, Cholestérol libre, Apos).", "Une bicouche lipidique contenant de l'eau.", "Une protéine pure.", "Un micelle d'acides gras."], "correctAnswer": 0, "explanation": "Cette structure micellaire permet de transporter des lipides insolubles dans le plasma aqueux." },
                        { "id": 2, "question": "Comment sont classées les lipoprotéines ?", "options": ["Selon leur densité (par ultracentrifugation) ou leur mobilité électrophorétique.", "Selon leur taille uniquement.", "Selon leur couleur.", "Selon leur origine."], "correctAnswer": 0, "explanation": "Plus une lipoprotéine contient de lipides (surtout TG), plus elle est légère (faible densité) et grosse." },
                        { "id": 3, "question": "Quelle est la lipoprotéine la moins dense et la plus volumineuse ?", "options": ["Le Chylomicron.", "La VLDL.", "La LDL.", "La HDL."], "correctAnswer": 0, "explanation": "Elle est constituée majoritairement de triglycérides alimentaires (exogènes) et flotte au-dessus du plasma." },
                        { "id": 4, "question": "Quelle lipoprotéine est responsable du transport des lipides exogènes (alimentaires) ?", "options": ["Le Chylomicron.", "La VLDL.", "La LDL.", "La HDL."], "correctAnswer": 0, "explanation": "Ils sont formés dans l'entérocyte après un repas riche en graisses." },
                        { "id": 5, "question": "Quelle lipoprotéine assure le transport des lipides endogènes (synthétisés par le foie) ?", "options": ["La VLDL (Very Low Density Lipoprotein).", "Le Chylomicron.", "La HDL.", "L'Albumine."], "correctAnswer": 0, "explanation": "Le foie exporte les triglycérides excédentaires sous forme de VLDL." },
                        { "id": 6, "question": "Quelle est la fonction principale des LDL (Low Density Lipoproteins) ?", "options": ["Transporter le cholestérol vers les tissus périphériques.", "Rapporter le cholestérol au foie.", "Transporter les triglycérides.", "Activer la LPL."], "correctAnswer": 0, "explanation": "Elles sont riches en cholestérol et sont internalisées par les cellules via le récepteur LDL." },
                        { "id": 7, "question": "Quelle est la fonction principale des HDL (High Density Lipoproteins) ?", "options": ["Assurer le transport retour (reverse) du cholestérol des tissus vers le foie.", "Apporter du cholestérol aux artères.", "Stocker les graisses.", "Digérer les lipides."], "correctAnswer": 0, "explanation": "Elles nettoient l'excès de cholestérol, d'où leur nom de 'bon cholestérol'." },
                        { "id": 8, "question": "Quelle apolipoprotéine est spécifique des Chylomicrons (origine intestinale) ?", "options": ["Apo B-48.", "Apo B-100.", "Apo A-I.", "Apo E."], "correctAnswer": 0, "explanation": "C'est une forme tronquée de l'Apo B (48% de la longueur) produite par édition de l'ARNm dans l'intestin." },
                        { "id": 9, "question": "Quelle apolipoprotéine est majeure dans les VLDL, IDL et LDL (origine hépatique) ?", "options": ["Apo B-100.", "Apo B-48.", "Apo A-II.", "Apo D."], "correctAnswer": 0, "explanation": "Une seule molécule d'Apo B-100 est présente par particule, essentielle pour la structure et la liaison au récepteur." },
                        { "id": 10, "question": "Quel est le rôle de l'Apo C-II ?", "options": ["Activer la Lipoprotéine Lipase (LPL).", "Inhiber la LPL.", "Activer la LCAT.", "Lier le récepteur LDL."], "correctAnswer": 0, "explanation": "Elle est transférée des HDL vers les Chylomicrons et VLDL pour permettre l'hydrolyse de leurs triglycérides." },
                        { "id": 11, "question": "Quel est le rôle de l'Apo A-I ?", "options": ["Activer la LCAT (Lécithine Cholestérol Acyltransférase) et structurer les HDL.", "Lier le récepteur LDL.", "Transporter les triglycérides.", "Activer la LPL."], "correctAnswer": 0, "explanation": "C'est la protéine majeure des HDL, essentielle à l'estérification du cholestérol plasmatique." },
                        { "id": 12, "question": "Quel est le rôle de l'Apo E ?", "options": ["Servir de ligand pour la capture hépatique des rémanents (Chylomicrons/IDL).", "Activer la LPL.", "Former la structure des LDL.", "Inhiber la LCAT."], "correctAnswer": 0, "explanation": "Elle permet l'endocytose des lipoprotéines riches en triglycérides appauvris par le foie." },
                        { "id": 13, "question": "La Lipoprotéine Lipase (LPL) est située :", "options": ["Ancrée à la surface de l'endothélium des capillaires (tissu adipeux, muscle, coeur).", "Dans le foie.", "Dans l'intestin.", "Dans le sang circulant."], "correctAnswer": 0, "explanation": "Elle hydrolyse les triglycérides circulants pour libérer des acides gras pour les tissus." },
                        { "id": 14, "question": "La Lipase Hépatique (HL) agit principalement sur :", "options": ["Les IDL et les HDL2 (hydrolyse TG et phospholipides).", "Les Chylomicrons naissants.", "Les LDL.", "L'albumine."], "correctAnswer": 0, "explanation": "Elle participe à la conversion finale IDL -> LDL et au remodelage des HDL." },
                        { "id": 15, "question": "L'enzyme LCAT (Lécithine Cholestérol Acyltransférase) catalyse :", "options": ["L'estérification du cholestérol libre à la surface des HDL en utilisant un acide gras de la phosphatidylcholine.", "L'hydrolyse des TG.", "Le transfert de cholestérol.", "La synthèse de cholestérol."], "correctAnswer": 0, "explanation": "Cela piège le cholestérol hydrophobe au cœur de la HDL (maturation HDL discoïde -> sphérique)." },
                        { "id": 16, "question": "La protéine CETP (Cholesteryl Ester Transfer Protein) assure :", "options": ["L'échange d'esters de cholestérol (des HDL) contre des triglycérides (des VLDL/LDL).", "La synthèse de cholestérol.", "L'hydrolyse des esters.", "Le transport membranaire."], "correctAnswer": 0, "explanation": "Elle redistribue le cholestérol vers les lipoprotéines à Apo B, ce qui peut être athérogène." },
                        { "id": 17, "question": "Le récepteur LDL (LDLR) reconnait :", "options": ["L'Apo B-100 et l'Apo E.", "L'Apo A-I.", "L'Apo C-II.", "L'Apo B-48."], "correctAnswer": 0, "explanation": "Il permet l'endocytose des LDL et des IDL/Rémanents." },
                        { "id": 18, "question": "Le récepteur SR-B1 (Scavenger Receptor B1) permet :", "options": ["L'entrée sélective du cholestérol des HDL dans le foie et les tissus stéroïdogènes.", "L'endocytose des LDL.", "La dégradation des VLDL.", "La sortie du cholestérol."], "correctAnswer": 0, "explanation": "Contrairement au LDLR, il ne fait pas entrer toute la particule, il 'pompe' le cholestérol." },
                        { "id": 19, "question": "La protéine PCSK9 régule le métabolisme du cholestérol en :", "options": ["Se liant au récepteur LDL et favorisant sa dégradation lysosomale.", "Augmentant le nombre de récepteurs LDL.", "Inhibant la synthèse de cholestérol.", "Activant la LPL."], "correctAnswer": 0, "explanation": "Moins de récepteurs = plus de LDL dans le sang. Les inhibiteurs de PCSK9 sont des médicaments hypolipidémiants." },
                        { "id": 20, "question": "Le transporteur ABCA1 est indispensable pour :", "options": ["L'efflux de cholestérol et phospholipides cellulaires vers l'Apo A-I (formation HDL naissant).", "L'entrée de cholestérol.", "La synthèse des VLDL.", "L'excrétion biliaire."], "correctAnswer": 0, "explanation": "Un défaut d'ABCA1 cause la maladie de Tangier (absence de HDL)." },
                        { "id": 21, "question": "Le transporteur ABCG5/G8 permet :", "options": ["L'excrétion biliaire du cholestérol et des phytostérols.", "L'absorption intestinale.", "Le stockage.", "La synthèse."], "correctAnswer": 0, "explanation": "Un défaut cause la sitostérolémie (accumulation de stérols végétaux)." },
                        { "id": 22, "question": "La protéine NPC1L1 (Niemann-Pick C1 Like 1) est la cible de :", "options": ["L'ézétimibe (inhibiteur de l'absorption intestinale du cholestérol).", "Des statines.", "Des fibrates.", "De l'insuline."], "correctAnswer": 0, "explanation": "Elle transporte le cholestérol de la lumière intestinale vers l'entérocyte." },
                        { "id": 23, "question": "La protéine MTP (Microsomal Triglyceride Transfer Protein) est nécessaire pour :", "options": ["L'assemblage et la sécrétion des lipoprotéines riches en TG (Chylomicrons et VLDL).", "La dégradation des LDL.", "L'activation de la LPL.", "La synthèse de HDL."], "correctAnswer": 0, "explanation": "Elle charge les lipides sur l'Apo B naissante. Son absence cause l'abêtalipoprotéinémie." },
                        { "id": 24, "question": "Une élévation isolée des LDL correspond au phénotype de Fredrickson :", "options": ["Type IIa.", "Type I.", "Type IV.", "Type V."], "correctAnswer": 0, "explanation": "Hypercholestérolémie pure, risque athérogène majeur." },
                        { "id": 25, "question": "Une élévation isolée des Triglycérides (VLDL) correspond au phénotype :", "options": ["Type IV.", "Type IIa.", "Type IIb.", "Type I."], "correctAnswer": 0, "explanation": "Hypertriglycéridémie endogène, souvent liée au syndrome métabolique/alcool/sucres." },
                        { "id": 26, "question": "L'hyperchylomicronémie familiale (Type I) est due à :", "options": ["Un déficit en Lipoprotéine Lipase (LPL) ou en Apo C-II.", "Un déficit en récepteur LDL.", "Un excès de synthèse.", "Un déficit en LCAT."], "correctAnswer": 0, "explanation": "Le sérum est lactescent (crémeux), risque de pancréatite aiguë, pas d'athérosclérose majeure." },
                        { "id": 27, "question": "L'hypercholestérolémie familiale (HF) est causée par :", "options": ["Une mutation du gène du récepteur LDL (LDLR) ou de l'Apo B.", "Une alimentation grasse uniquement.", "Un défaut de LPL.", "Un excès de HDL."], "correctAnswer": 0, "explanation": "Transmission autosomique dominante. Cholestérol très élevé dès l'enfance." },
                        { "id": 28, "question": "La dysbêtalipoprotéinémie (Type III) est caractérisée par :", "options": ["L'accumulation de Remnants (IDL et Chylo remnants) due à l'isoforme Apo E2/E2.", "Excès de LDL.", "Excès de HDL.", "Manque de lipides."], "correctAnswer": 0, "explanation": "L'Apo E2 lie mal le récepteur hépatique, entraînant un défaut de clairance (Cholestérol et TG élevés)." },
                        { "id": 29, "question": "La formule de Friedewald permet de calculer :", "options": ["Le LDL-Cholestérol.", "Le HDL-Cholestérol.", "Les Triglycérides.", "Le Cholestérol Total."], "correctAnswer": 0, "explanation": "LDL = CT - HDL - (TG/2.2) (en mmol/L), valide si TG < 4.5 mmol/L." },
                        { "id": 30, "question": "Les LDL oxydées sont pathogènes car :", "options": ["Elles ne sont plus reconnues par le LDLR mais par les récepteurs Scavenger des macrophages.", "Elles activent la LPL.", "Elles sont éliminées trop vite.", "Elles deviennent des HDL."], "correctAnswer": 0, "explanation": "Cela conduit à la formation de cellules spumeuses et à la plaque d'athérome." },
                        { "id": 31, "question": "La Lp(a) est une lipoprotéine particulière car :", "options": ["Elle contient une molécule d'Apo(a) liée par pont disulfure à l'Apo B-100.", "Elle ne contient pas de lipides.", "C'est une HDL modifiée.", "Elle est bénéfique."], "correctAnswer": 0, "explanation": "L'Apo(a) ressemble au plasminogène, conférant un risque thrombotique et athérogène élevé." },
                        { "id": 32, "question": "Les statines réduisent le cholestérol en :", "options": ["Inhibant l'HMG-CoA réductase, ce qui augmente l'expression des récepteurs LDL hépatiques.", "Inhibant l'absorption intestinale.", "Activant la LPL.", "Détruisant les VLDL."], "correctAnswer": 0, "explanation": "La cellule hépatique, manquant de cholestérol, pompe davantage de LDL du sang." },
                        { "id": 33, "question": "Les fibrates sont utilisés principalement pour :", "options": ["Baisser les triglycérides (activateurs PPAR-alpha).", "Baisser le LDL.", "Augmenter le LDL.", "Bloquer l'absorption."], "correctAnswer": 0, "explanation": "Ils stimulent la synthèse de LPL et la bêta-oxydation." },
                        { "id": 34, "question": "Quel est l'effet de l'alcool sur les lipides ?", "options": ["Augmentation des triglycérides (VLDL) et parfois des HDL.", "Baisse du cholestérol.", "Baisse des TG.", "Aucun effet."], "correctAnswer": 0, "explanation": "L'alcool favorise la synthèse d'acides gras et de VLDL (stéatose)." },
                        { "id": 35, "question": "En électrophorèse des lipoprotéines, la bande 'Bêta' correspond aux :", "options": ["LDL.", "HDL (Alpha).", "VLDL (Pré-bêta).", "Chylomicrons (Dépôt)."], "correctAnswer": 0, "explanation": "Migration moins rapide que l'albumine." },
                        { "id": 36, "question": "La bande 'Alpha' en électrophorèse correspond aux :", "options": ["HDL.", "LDL.", "VLDL.", "Chylomicrons."], "correctAnswer": 0, "explanation": "Migration la plus rapide (vers l'anode)." },
                        { "id": 37, "question": "Le cholestérol estérifié est plus hydrophobe que le cholestérol libre :", "options": ["Vrai, c'est pourquoi il est au cœur de la lipoprotéine.", "Faux.", "Ils ont la même hydrophobicité.", "Dépend du pH."], "correctAnswer": 0, "explanation": "L'ajout de l'acide gras masque la fonction OH polaire." },
                        { "id": 38, "question": "L'insuline stimule l'activité de :", "options": ["La Lipoprotéine Lipase (LPL).", "La Lipase Hormono-Sensible (LHS).", "La CETP.", "La LCAT."], "correctAnswer": 0, "explanation": "En période post-prandiale, l'insuline favorise le stockage des lipides dans le tissu adipeux." },
                        { "id": 39, "question": "En cas de jeûne, les acides gras libres du sang sont transportés par :", "options": ["L'albumine.", "Les VLDL.", "Les HDL.", "Les LDL."], "correctAnswer": 0, "explanation": "Les NEFA (Non-Esterified Fatty Acids) ne sont pas dans des lipoprotéines." },
                        { "id": 40, "question": "Les VLDL deviennent des IDL puis des LDL par :", "options": ["Hydrolyse progressive des triglycérides par la LPL et enrichissement relatif en cholestérol.", "Synthèse de novo.", "Fusion avec des HDL.", "Oxydation."], "correctAnswer": 0, "explanation": "C'est la cascade lipolytique de la voie endogène." },
                        { "id": 41, "question": "La maladie de Tangier est caractérisée par :", "options": ["Une quasi-absence de HDL et des amygdales oranges (dépôt cholestérol).", "Un excès de LDL.", "Un sang lactescent.", "Une obésité."], "correctAnswer": 0, "explanation": "Défaut d'efflux du cholestérol (ABCA1)." },
                        { "id": 42, "question": "L'athérosclérose est une maladie inflammatoire chronique de :", "options": ["L'intima des grosses et moyennes artères.", "Les veines.", "Les capillaires.", "Le cœur uniquement."], "correctAnswer": 0, "explanation": "Accumulation de lipides, cellules inflammatoires, fibrose et calcium." },
                        { "id": 43, "question": "La strie lipidique (Fatty streak) est :", "options": ["La lésion précoce réversible constituée de macrophages spumeux.", "La plaque fibreuse avancée.", "Un caillot.", "Une nécrose."], "correctAnswer": 0, "explanation": "Visible dès l'enfance." },
                        { "id": 44, "question": "Quels sont les facteurs de risque cardiovasculaire majeurs ?", "options": ["Tabac, HTA, Dyslipidémie, Diabète, Âge.", "Sport, Fruits, Légumes.", "Groupe sanguin.", "Taille."], "correctAnswer": 0, "explanation": "Favorisent la dysfonction endothéliale et l'athérome." },
                        { "id": 45, "question": "Le HDL-Cholestérol est considéré comme 'protecteur' si :", "options": ["Sa concentration est élevée (> 0.4 g/L ou 1 mmol/L).", "Il est bas.", "Il est absent.", "Il est oxydé."], "correctAnswer": 0, "explanation": "Corrélation inverse avec le risque d'infarctus." },
                        { "id": 46, "question": "L'hypothyroïdie non traitée entraîne souvent :", "options": ["Une hypercholestérolémie (baisse des récepteurs LDL).", "Une hypocholestérolémie.", "Une baisse des TG.", "Rien."], "correctAnswer": 0, "explanation": "Les hormones thyroïdiennes stimulent le métabolisme des LDL." },
                        { "id": 47, "question": "L'apo A-II est :", "options": ["La deuxième apoprotéine majeure des HDL.", "Spécifique des LDL.", "Une lipase.", "Un récepteur."], "correctAnswer": 0, "explanation": "Son rôle est moins clair que l'Apo A-I, parfois pro-athérogène." },
                        { "id": 48, "question": "Le récepteur VLDL (VLDLR) est important pour :", "options": ["Le métabolisme des triglycérides dans le tissu adipeux et le muscle.", "Le cerveau.", "L'élimination du cholestérol.", "La synthèse de bile."], "correctAnswer": 0, "explanation": "Famille des récepteurs LDL." },
                        { "id": 49, "question": "Les chylomicrons remnants (résiduels) sont captés par le foie via :", "options": ["Le récepteur LRP (LDL Receptor-related Protein) et LDLR, reconnaissant l'Apo E.", "Le récepteur SR-B1.", "La LPL.", "Diffusion simple."], "correctAnswer": 0, "explanation": "L'Apo E est le ligand critique pour la clairance hépatique." },
                        { "id": 50, "question": "La lipase acide lysosomale hydrolyse :", "options": ["Les esters de cholestérol et triglycérides des LDL internalisées.", "Les protéines.", "L'ADN.", "Le glucose."], "correctAnswer": 0, "explanation": "Libère le cholestérol libre dans la cellule (Maladie de Wolman si déficit)." },
                        { "id": 51, "question": "L'Apo C-III a pour effet de :", "options": ["Inhiber la LPL et la capture hépatique des lipoprotéines (Hypertriglycéridémiante).", "Activer la LPL.", "Baisser les TG.", "Protéger le cœur."], "correctAnswer": 0, "explanation": "C'est un facteur de risque cardiovasculaire. Opposée à Apo C-II." },
                        { "id": 52, "question": "Le cholestérol libre membranaire régule :", "options": ["La fluidité de la membrane.", "La couleur de la cellule.", "La synthèse de protéines.", "Le pH."], "correctAnswer": 0, "explanation": "Il rigidifie les membranes fluides et fluidifie les membranes gelées (tampon thermique)." },
                        { "id": 53, "question": "Les acides gras libres (NEFA) en excès sont toxiques car :", "options": ["Ils induisent une lipotoxicité (stress RE, résistance insuline).", "Ils nourrissent trop la cellule.", "Ils dissolvent la membrane.", "Ils acidifient trop le sang."], "correctAnswer": 0, "explanation": "Lien entre obésité et diabète type 2." },
                        { "id": 54, "question": "Un xanthélasma est :", "options": ["Un dépôt de cholestérol jaunâtre sur les paupières.", "Un bouton.", "Une tumeur.", "Une infection."], "correctAnswer": 0, "explanation": "Signe fréquent de dyslipidémie." },
                        { "id": 55, "question": "L'arc cornéen (gérontoxon) avant 45 ans suggère :", "options": ["Une hypercholestérolémie familiale.", "Une bonne vision.", "Un manque de vitamine A.", "Rien."], "correctAnswer": 0, "explanation": "Dépôt lipidique périphérique dans la cornée." },
                        { "id": 56, "question": "La classification de Fredrickson est basée sur :", "options": ["Le type de lipoprotéine élevée (électrophorèse).", "La cause génétique.", "Le risque cardiaque.", "Le traitement."], "correctAnswer": 0, "explanation": "Classification biochimique phénotypique (I à V)." },
                        { "id": 57, "question": "Le Type IIb de Fredrickson est :", "options": ["Une hyperlipidémie mixte (Cholestérol et TG élevés, LDL et VLDL augmentés).", "Cholestérol seul.", "TG seuls.", "Chylomicrons."], "correctAnswer": 0, "explanation": "Très fréquent et athérogène." },
                        { "id": 58, "question": "L'apolipoprotéine 'a' (petit a) est structurellement homologue à :", "options": ["Le plasminogène.", "L'albumine.", "L'insuline.", "Le collagène."], "correctAnswer": 0, "explanation": "Elle interfère avec la fibrinolyse (risque de caillot)." },
                        { "id": 59, "question": "L'abêtalipoprotéinémie se manifeste par :", "options": ["Une malabsorption des graisses, stéatorrhée, rétinite pigmentaire, ataxie.", "Une obésité.", "Une hypertension.", "Une goutte."], "correctAnswer": 0, "explanation": "Carence en vitamines liposolubles (A, D, E, K) et absence de VLDL/LDL/Chylo." },
                        { "id": 60, "question": "Les acides gras oméga-3 ont un effet principal sur :", "options": ["La baisse des triglycérides.", "La baisse du LDL.", "La hausse du LDL.", "La hausse de la glycémie."], "correctAnswer": 0, "explanation": "Ils diminuent la synthèse hépatique de VLDL." },
                        { "id": 61, "question": "Le cholestérol alimentaire représente quelle part du pool total ?", "options": ["Minoritaire (20-30%), la majorité est synthétisée.", "Majoritaire (100%).", "50%.", "Nulle."], "correctAnswer": 0, "explanation": "L'organisme synthétise environ 1g/jour, l'alimentation apporte 0.3g." },
                        { "id": 62, "question": "Les sels biliaires sont réabsorbés dans :", "options": ["L'iléon terminal.", "L'estomac.", "Le duodénum.", "Le colon."], "correctAnswer": 0, "explanation": "Cycle entéro-hépatique." },
                        { "id": 63, "question": "Le récepteur scavenger CD36 lie :", "options": ["Les LDL oxydées et les acides gras à longue chaîne.", "Les HDL.", "Le glucose.", "L'insuline."], "correctAnswer": 0, "explanation": "Rôle dans l'athérosclérose et le transport des AG." },
                        { "id": 64, "question": "Les gouttelettes lipidiques intracellulaires sont entourées de :", "options": ["Une monocouche de phospholipides et de périlipines.", "Une bicouche.", "Rien.", "Une membrane protéique."], "correctAnswer": 0, "explanation": "Stockage cytosolique hydrophobe." },

                        { "id": 66, "question": "La niacine (Vit B3) à haute dose est utilisée pour :", "options": ["Augmenter le HDL et baisser les TG.", "Baisser le LDL seulement.", "Augmenter le LDL.", "Rien."], "correctAnswer": 0, "explanation": "Effets secondaires fréquents (flush)." },

                        { "id": 69, "question": "Une déficience en LCAT entraîne :", "options": ["Une accumulation de cholestérol libre, opacité cornéenne, anémie.", "Une athérosclérose accélérée.", "Une obésité.", "Rien."], "correctAnswer": 0, "explanation": "Le cholestérol non estérifié s'accumule dans les membranes." },
                        { "id": 70, "question": "Les phytostérols (stérols végétaux) agissent en :", "options": ["Entrant en compétition avec le cholestérol pour l'absorption micellaire.", "Inhibant la synthèse.", "Activant la LPL.", "Détruisant le cholestérol."], "correctAnswer": 0, "explanation": "Utilisés dans les margarines 'santé'." },

                        { "id": 73, "question": "Un taux de Triglycérides > 10 g/L (11 mmol/L) expose au risque de :", "options": ["Pancréatite aiguë.", "Infarctus immédiat.", "AVC.", "Insuffisance rénale."], "correctAnswer": 0, "explanation": "Urgence thérapeutique." },
                        { "id": 74, "question": "L'homocystéine élevée est un facteur de risque cardiovasculaire lié au métabolisme de :", "options": ["La méthionine (et vitamines B6, B9, B12).", "Cholestérol.", "Glucose.", "Fer."], "correctAnswer": 0, "explanation": "Toxique pour l'endothélium." },
