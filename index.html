                        { "id": 76, "question": "Le récepteur LDL est recyclé à la surface cellulaire :", "options": ["Vrai, après libération du LDL dans l'endosome.", "Faux, il est toujours dégradé.", "Vrai, mais il reste lié au LDL.", "Faux, il reste dans le noyau."], "correctAnswer": 0, "explanation": "Un récepteur peut faire >100 cycles." },
                        { "id": 77, "question": "La mutation de l'Apo B-100 empêchant la liaison au récepteur cause :", "options": ["L'Apo B défective familiale (phénotype comme hypercholestérolémie familiale).", "Une hypocholestérolémie.", "Une hypertriglycéridémie.", "Rien."], "correctAnswer": 0, "explanation": "Accumulation de LDL." },
                        { "id": 78, "question": "L'oxydation des LDL est favorisée par :", "options": ["Le tabac, le stress oxydant, le déficit en antioxydants.", "Les fruits.", "Le sport.", "L'eau."], "correctAnswer": 0, "explanation": "Transformation en LDL modifiées pathogènes." },
                        { "id": 79, "question": "Les lymphocytes T participent à la plaque d'athérome :", "options": ["Vrai, c'est une réaction immunitaire inflammatoire.", "Faux, seuls les macrophages y sont.", "Faux, ce sont des plaquettes.", "Faux."], "correctAnswer": 0, "explanation": "L'athérosclérose est une immuno-inflammation." },
                        { "id": 80, "question": "La chape fibreuse d'une plaque d'athérome est produite par :", "options": ["Les cellules musculaires lisses (CML).", "Les macrophages.", "L'endothélium.", "Les lipides."], "correctAnswer": 0, "explanation": "Les CML migrent de la média vers l'intima." },
                        { "id": 81, "question": "Une plaque instable (vulnérable) a :", "options": ["Un gros cœur lipidique et une chape fibreuse fine.", "Un petit cœur et une chape épaisse.", "Pas de lipides.", "Que du calcium."], "correctAnswer": 0, "explanation": "Risque de rupture élevé." },
                        { "id": 82, "question": "L'apolipoprotéine A-IV est sécrétée par :", "options": ["L'intestin (avec les chylomicrons).", "Le foie.", "Le cœur.", "Le rein."], "correctAnswer": 0, "explanation": "Rôle dans la satiété et le métabolisme inverse." },
                        { "id": 83, "question": "Le Pre-beta HDL est :", "options": ["Une particule discoïdale pauvre en lipides, accepteur initial de cholestérol.", "Une grosse HDL sphérique.", "Une LDL.", "Un déchet."], "correctAnswer": 0, "explanation": "Forme naissante de HDL." },
                        { "id": 84, "question": "La glycation des lipoprotéines (Diabète) :", "options": ["Augmente leur athérogénicité et prolonge leur demi-vie (moins reconnues par récepteurs).", "Les protège.", "Les détruit.", "Rien."], "correctAnswer": 0, "explanation": "Modifie les Apo B." },
                        { "id": 85, "question": "L'Apo C-III inhibe :", "options": ["La LPL.", "La LCAT.", "L'ACAT.", "La synthèse VLDL."], "correctAnswer": 0, "explanation": "Cible thérapeutique pour l'hypertriglycéridémie." },
                        { "id": 86, "question": "L'ANGPTL3 (Angiopoietin-like 3) inhibe :", "options": ["La LPL et la Lipase Endothéliale.", "La LCAT.", "HMG-R.", "MTP."], "correctAnswer": 0, "explanation": "Régulateur clé des lipides plasmatiques." },
                        { "id": 87, "question": "Le Lomitapide inhibe :", "options": ["La MTP (Microsomal Triglyceride Transfer Protein).", "PCSK9.", "CETP.", "LPL."], "correctAnswer": 0, "explanation": "Traitement de l'hypercholestérolémie familiale homozygote (bloque assemblage VLDL)." },
                        { "id": 88, "question": "L'Apo A-V :", "options": ["Active fortement la LPL (baisse les TG).", "Inhibe la LPL.", "Transporte le cholestérol.", "Est une enzyme."], "correctAnswer": 0, "explanation": "Cofacteur important malgré sa faible concentration." },
                        { "id": 89, "question": "Le HDL transporte aussi :", "options": ["Des enzymes antioxydantes (Paraoxonase PON1).", "De l'ADN.", "Des sucres.", "Des bactéries."], "correctAnswer": 0, "explanation": "Protège les LDL de l'oxydation." },
                        { "id": 90, "question": "Le sérum est clair si :", "options": ["Les TG sont normaux (< 1.5 g/L).", "Les TG sont > 10 g/L.", "Il y a beaucoup de chylomicrons.", "Il y a du sang."], "correctAnswer": 0, "explanation": "L'opalescence ou lactescence signe l'hypertriglycéridémie." },
                        { "id": 91, "question": "L'anneau de Kayser-Fleischer (Cuivre) ne doit pas être confondu avec :", "options": ["L'arc cornéen (Lipides).", "La cataracte.", "Le glaucome.", "Une infection."], "correctAnswer": 0, "explanation": "Diagnostic différentiel visuel." },
                        { "id": 92, "question": "Les acides gras libres (AGL) se lient-ils aux lipoprotéines ?", "options": ["Non, ils se lient à l'albumine.", "Oui, dans le coeur.", "Oui, en surface.", "Oui, à l'Apo B."], "correctAnswer": 0, "explanation": "Mode de transport distinct." },
                        { "id": 93, "question": "L'insulino-résistance provoque :", "options": ["Une surproduction de VLDL et une baisse des HDL.", "Une baisse de LDL.", "Une hausse de HDL.", "Rien."], "correctAnswer": 0, "explanation": "Dyslipidémie diabétique classique." },
                        { "id": 94, "question": "Les small dense LDL (sdLDL) sont :", "options": ["Plus athérogènes que les grosses LDL.", "Moins athérogènes.", "Protectrices.", "Neutres."], "correctAnswer": 0, "explanation": "Elles pénètrent mieux la paroi artérielle et s'oxydent vite." },

                        { "id": 98, "question": "La synthèse de l'Apo B est :", "options": ["Constitutive (dépend de la dispo en lipides pour ne pas être dégradée).", "Régulée par l'insuline.", "Régulée par le glucose.", "Jamais dégradée."], "correctAnswer": 0, "explanation": "Si pas assez de lipides, l'Apo B est dégradée dans le RE." },

                        { "front": "Gérontoxon", "back": "Arc cornéen lipidique." },

                        { "id": 12, "question": "Le Wobble (Vacillement) concerne l'appariement entre :", "options": ["La 3ème base du codon et la 1ère base de l'anticodon.", "La 1ère base du codon.", "Le milieu.", "Les acides aminés."], "correctAnswer": 0, "explanation": "Permet à un ARNt de reconnaître plusieurs codons synonymes." },

                        { "id": 19, "question": "Chez les bactéries, le site d'initiation de la traduction est reconnu grâce à :", "options": ["La séquence Shine-Dalgarno.", "La coiffe 5'.", "La queue Poly-A.", "La boîte TATA."], "correctAnswer": 0, "explanation": "Séquence riche en purines (AGGAGG) sur l'ARNm, complémentaire de l'ARNr 16S." },

                        { "id": 25, "question": "La translocation du ribosome (déplacement de 3 nucléotides) nécessite :", "options": ["Le facteur EF-G (Proca) / eEF2 (Euca) et l'hydrolyse de GTP.", "EF-Tu et ATP.", "IF1.", "RF1."], "correctAnswer": 0, "explanation": "L'ARNt passe du site A au site P, et du P au E." },

                        { "id": 31, "question": "L'Érythromycine (Macrolide) agit en :", "options": ["Bloquant la translocation (se fixe à la sortie du tunnel 50S).", "Inhibant l'initiation.", "Dégradant l'ARNm.", "Modifiant l'ARNt."], "correctAnswer": 0, "explanation": "La chaîne peptidique ne peut pas sortir." },

                {
                    "id": "l2-transcription",
                    "title": "L2 - La Transcription",
                    "level": "L2",
                    "description": "Synthèse de l'ARN, ARN Polymérases, Maturation des ARNm et Régulation de l'expression génique.",
                    "questions": [
                        { "id": 1, "question": "Quelle est la définition biologique de la transcription ?", "options": ["C'est la synthèse d'une molécule d'ARN à partir d'une matrice d'ADN.", "C'est la synthèse d'une protéine à partir d'un ARNm.", "C'est la réplication de l'ADN.", "C'est la dégradation de l'ARN."], "correctAnswer": 0, "explanation": "C'est la première étape de l'expression génique, permettant de copier l'information génétique de l'ADN vers l'ARN." },
                        { "id": 2, "question": "Dans quel sens s'effectue la synthèse de l'ARN ?", "options": ["Du 5' vers le 3'.", "Du 3' vers le 5'.", "Du N-terminal vers le C-terminal.", "De manière aléatoire."], "correctAnswer": 0, "explanation": "L'ARN polymérase ajoute les nucléotides libres sur l'extrémité 3'-OH de la chaîne en croissance, donc la synthèse se fait de 5' vers 3'." },
                        { "id": 3, "question": "L'ARN Polymérase a-t-elle besoin d'une amorce pour initier la transcription ?", "options": ["Non, elle peut initier la synthèse de novo.", "Oui, une amorce d'ARN.", "Oui, une amorce d'ADN.", "Oui, une protéine amorce."], "correctAnswer": 0, "explanation": "Contrairement à l'ADN polymérase, l'ARN polymérase peut lier les deux premiers nucléotides sans amorce préexistante." },
                        { "id": 4, "question": "Quel brin d'ADN sert de modèle à l'ARN polymérase ?", "options": ["Le brin matrice (ou brin antisens).", "Le brin codant (ou brin sens).", "Les deux brins simultanément.", "Aucun brin."], "correctAnswer": 0, "explanation": "L'ARN synthétisé est complémentaire du brin matrice et identique (aux U près) au brin codant." },
                        { "id": 5, "question": "Chez les procaryotes (bactéries), combien existe-t-il d'ARN polymérases différentes ?", "options": ["Une seule ARN polymérase synthétise tous les types d'ARN.", "Deux.", "Trois.", "Cinq."], "correctAnswer": 0, "explanation": "Une seule enzyme holoenzyme (coeur + facteur sigma) assure la transcription de l'ARNm, l'ARNt et l'ARNr." },
                        { "id": 6, "question": "Quel est le rôle du facteur Sigma chez les bactéries ?", "options": ["Il permet la reconnaissance spécifique du promoteur par l'ARN polymérase.", "Il allonge la chaîne d'ARN.", "Il termine la transcription.", "Il dégrade l'ARN."], "correctAnswer": 0, "explanation": "Le facteur Sigma se dissocie généralement après l'initiation de la transcription." },
                        { "id": 7, "question": "Quelle est la séquence consensus de la boîte de Pribnow chez les procaryotes ?", "options": ["TATAAT (située en -10).", "TTGACA (située en -35).", "TATA box (située en -25).", "AAUAAA."], "correctAnswer": 0, "explanation": "C'est une séquence riche en A-T qui facilite l'ouverture de la double hélice d'ADN au site d'initiation." },
                        { "id": 8, "question": "Quel antibiotique inhibe spécifiquement l'ARN polymérase bactérienne ?", "options": ["La Rifampicine.", "La Pénicilline.", "L'Alpha-amanitine.", "La Cycloheximide."], "correctAnswer": 0, "explanation": "Elle se fixe sur la sous-unité bêta de l'ARN polymérase et bloque l'initiation." },
                        { "id": 9, "question": "Chez les eucaryotes, l'ARN Polymérase I est responsable de la synthèse de :", "options": ["Les grands ARN ribosomiques (ARNr 28S, 18S, 5.8S).", "Les ARN messagers (ARNm).", "Les ARN de transfert (ARNt).", "L'ARN ribosomique 5S."], "correctAnswer": 0, "explanation": "Elle est localisée dans le nucléole, le site de biogenèse des ribosomes." },
                        { "id": 10, "question": "Chez les eucaryotes, l'ARN Polymérase II synthétise :", "options": ["Les ARN messagers (ARNm) et les petits ARN nucléaires (snRNA).", "Les ARNr.", "Les ARNt.", "L'ADN."], "correctAnswer": 0, "explanation": "C'est l'enzyme qui transcrit les gènes codant pour les protéines." },
                        { "id": 11, "question": "Chez les eucaryotes, l'ARN Polymérase III synthétise :", "options": ["Les ARN de transfert (ARNt) et l'ARNr 5S.", "Les ARNm.", "Les grands ARNr.", "Les protéines."], "correctAnswer": 0, "explanation": "Elle transcrit les petits ARN non codants." },
                        { "id": 12, "question": "L'alpha-amanitine (toxine de l'amanite phalloïde) inhibe fortement :", "options": ["L'ARN Polymérase II.", "L'ARN Polymérase I.", "L'ARN Polymérase bactérienne.", "La mitochondrie."], "correctAnswer": 0, "explanation": "C'est un poison mortel qui bloque spécifiquement la synthèse des ARNm eucaryotes." },
                        { "id": 13, "question": "Qu'est-ce que la boîte TATA (TATA box) ?", "options": ["Une séquence riche en T et A située dans le promoteur eucaryote (vers -25).", "Un signal de terminaison.", "Une séquence intronique.", "Un site de fixation du ribosome."], "correctAnswer": 0, "explanation": "Elle fixe le facteur de transcription TBP (TATA-Binding Protein) pour initier l'assemblage du complexe de transcription." },
                        { "id": 14, "question": "Quel facteur général de transcription se lie en premier à la boîte TATA ?", "options": ["TFIID (via sa sous-unité TBP).", "TFIIA.", "TFIIH.", "L'ARN Polymérase II."], "correctAnswer": 0, "explanation": "TFIID recrute ensuite les autres facteurs (TFIIA, B, F, E, H) et la polymérase." },
                        { "id": 15, "question": "Quel est le rôle du facteur TFIIH ?", "options": ["Il possède une activité hélicase (ouvre l'ADN) et kinase (phosphoryle le CTD de la Pol II).", "Il termine la transcription.", "Il fixe la boîte TATA.", "Il dégrade l'ARN."], "correctAnswer": 0, "explanation": "La phosphorylation du domaine C-terminal (CTD) de la Pol II est le signal de départ pour l'élongation." },
                        { "id": 16, "question": "Qu'est-ce qu'un Enhancer (Amplificateur) ?", "options": ["Une séquence d'ADN régulatrice qui augmente la transcription, indépendamment de sa distance ou orientation.", "Un inhibiteur de transcription.", "Une protéine.", "Un type d'ARN."], "correctAnswer": 0, "explanation": "Il fixe des activateurs transcriptionnels qui interagissent avec le promoteur basal via le complexe Médiateur." },
                        { "id": 17, "question": "Qu'est-ce qu'un Silencer ?", "options": ["Une séquence d'ADN qui fixe des répresseurs pour inhiber la transcription.", "Un amplificateur.", "Un site d'épissage.", "Une enzyme."], "correctAnswer": 0, "explanation": "C'est l'opposé fonctionnel d'un enhancer." },
                        { "id": 18, "question": "La coiffe (Cap) ajoutée en 5' des ARNm eucaryotes est constituée de :", "options": ["7-méthylguanosine liée par un pont triphosphate 5'-5'.", "Une adénine méthylée.", "Un poly-A.", "Une méthionine."], "correctAnswer": 0, "explanation": "Elle protège l'ARN de la dégradation par les exonucléases et permet le recrutement du ribosome." },
                        { "id": 19, "question": "La queue poly-A est ajoutée en 3' des ARNm par :", "options": ["La Poly-A Polymérase (sans matrice).", "L'ARN Polymérase II.", "La Primase.", "L'ADN Ligase."], "correctAnswer": 0, "explanation": "Elle stabilise l'ARNm et favorise son exportation du noyau vers le cytoplasme." },
                        { "id": 20, "question": "En quoi consiste l'épissage (Splicing) ?", "options": ["En l'élimination des introns (non-codants) et la soudure des exons (codants).", "En l'élimination des exons.", "En l'ajout de la coiffe.", "En la traduction de l'ARN."], "correctAnswer": 0, "explanation": "Cela permet d'obtenir un ARNm mature prêt à être traduit." },
                        { "id": 21, "question": "Le complexe responsable de l'épissage nucléaire est appelé :", "options": ["Le Spliceosome.", "Le Ribosome.", "Le Nucléosome.", "Le Proteasome."], "correctAnswer": 0, "explanation": "Il est composé de petits ARN nucléaires (snRNA) associés à des protéines (snRNP U1, U2, U4, U5, U6)." },
                        { "id": 22, "question": "Quelles sont les séquences consensus aux bornes d'un intron ?", "options": ["GU en 5' (Donneur) et AG en 3' (Accepteur).", "AU en 5' et GC en 3'.", "AA en 5' et TT en 3'.", "Il n'y en a pas."], "correctAnswer": 0, "explanation": "La règle GU-AG est conservée dans la grande majorité des introns eucaryotes." },
                        { "id": 23, "question": "Le 'Lariat' (ou Lasso) est :", "options": ["La structure formée par l'intron excisé lors de l'épissage.", "Une protéine.", "Un type d'ADN.", "Une erreur de transcription."], "correctAnswer": 0, "explanation": "Il est formé par la liaison 2'-5' phosphodiester entre le 5' de l'intron et le point de branchement A." },
                        { "id": 24, "question": "L'épissage alternatif permet :", "options": ["De produire plusieurs protéines différentes (isoformes) à partir d'un seul gène.", "De corriger les mutations.", "De dégrader l'ARNm.", "De répliquer l'ADN."], "correctAnswer": 0, "explanation": "C'est un mécanisme majeur de diversité protéique chez les eucaryotes." },
                        { "id": 25, "question": "L'édition de l'ARN (RNA Editing) est :", "options": ["La modification post-transcriptionnelle de la séquence nucléotidique (ex: C vers U).", "L'ajout de la coiffe.", "L'épissage.", "La dégradation."], "correctAnswer": 0, "explanation": "Exemple : L'ApoB-100 hépatique devient ApoB-48 dans l'intestin par création d'un codon stop prématuré." },
                        { "id": 26, "question": "La terminaison Rho-indépendante chez les bactéries implique :", "options": ["La formation d'une tige-boucle riche en GC suivie d'une série de U.", "La protéine Rho.", "La polyadénylation.", "Une coupure enzymatique."], "correctAnswer": 0, "explanation": "La structure secondaire déstabilise l'ARN polymérase qui se détache." },
                        { "id": 27, "question": "Qu'est-ce qu'un opéron ?", "options": ["Une unité de transcription bactérienne regroupant plusieurs gènes sous le contrôle d'un seul promoteur.", "Un gène eucaryote.", "Une protéine régulatrice.", "Un ribosome."], "correctAnswer": 0, "explanation": "Il produit un ARNm polycistronique (codant plusieurs protéines)." },
                        { "id": 28, "question": "L'opéron Lac est induit lorsque :", "options": ["Le lactose est présent et le glucose est absent.", "Le glucose est présent.", "Le lactose est absent.", "Il y a beaucoup d'ATP."], "correctAnswer": 0, "explanation": "Le lactose lève la répression (LacI) et l'absence de glucose active la CRP (via AMPc)." },
                        { "id": 29, "question": "Le répresseur LacI se fixe sur :", "options": ["L'Opérateur.", "Le Promoteur.", "Le gène LacZ.", "L'ARN polymérase."], "correctAnswer": 0, "explanation": "L'opérateur est une séquence d'ADN située entre le promoteur et les gènes structuraux, bloquant la polymérase." },
                        { "id": 30, "question": "L'opéron Tryptophane est un système :", "options": ["Répressible (inhibé par le produit final, le tryptophane).", "Inductible.", "Constitutif.", "Positif."], "correctAnswer": 0, "explanation": "Le tryptophane agit comme corépresseur en activant le répresseur TrpR." },
                        { "id": 31, "question": "Les gènes eucaryotes sont généralement :", "options": ["Monocistroniques (un promoteur par gène).", "Polycistroniques.", "Sans introns.", "Circulaires."], "correctAnswer": 0, "explanation": "Chaque gène possède sa propre régulation transcriptionnelle." },
                        { "id": 32, "question": "Le domaine CTD de l'ARN Pol II est crucial pour :", "options": ["Le couplage entre la transcription et la maturation de l'ARNm (coiffe, épissage, poly-A).", "La fixation à l'ADN.", "La dégradation de l'ARN.", "La traduction."], "correctAnswer": 0, "explanation": "Les facteurs de maturation voyagent sur la queue phosphorylée de la polymérase." },
                        { "id": 33, "question": "Les facteurs de transcription basaux (TFII) sont requis pour :", "options": ["L'initiation de la transcription au niveau du promoteur minimal.", "L'élongation.", "La terminaison.", "La réplication."], "correctAnswer": 0, "explanation": "Ils forment le complexe de pré-initiation avec la Pol II." },
                        { "id": 34, "question": "Les facteurs de transcription spécifiques (activateurs) se lient aux :", "options": ["Enhancers (séquences distales).", "Boîtes TATA.", "Introns.", "Exons."], "correctAnswer": 0, "explanation": "Ils permettent la régulation fine (tissu-spécifique, temporelle) de l'expression." },
                        { "id": 35, "question": "Quel est l'effet de l'acétylation des histones (par les HAT) ?", "options": ["Elle décondense la chromatine (Euchromatine) et active la transcription.", "Elle condense la chromatine (Hétérochromatine).", "Elle inhibe la transcription.", "Elle n'a aucun effet."], "correctAnswer": 0, "explanation": "L'acétylation neutralise les charges positives des histones, affaiblissant leur lien avec l'ADN." },
                        { "id": 36, "question": "La méthylation de l'ADN sur les cytosines (CpG) est associée à :", "options": ["La répression de la transcription (Silencing).", "L'activation de la transcription.", "La réparation de l'ADN.", "L'épissage."], "correctAnswer": 0, "explanation": "C'est un mécanisme épigénétique majeur pour éteindre les gènes." },
                        { "id": 37, "question": "Les HDAC (Histone Deacetylases) provoquent :", "options": ["La compaction de la chromatine et la répression génique.", "L'activation génique.", "L'ouverture de l'ADN.", "La traduction."], "correctAnswer": 0, "explanation": "Elles enlèvent les groupements acétyles, rétablissant les charges positives des histones." },
                        { "id": 38, "question": "Le complexe Médiateur sert à :", "options": ["Faire le pont entre les activateurs (sur les enhancers) et la Pol II.", "Synthétiser l'ARN.", "Couper l'ADN.", "Dégrader les protéines."], "correctAnswer": 0, "explanation": "Il intègre les signaux régulateurs pour contrôler l'initiation." },
                        { "id": 39, "question": "Le signal de polyadénylation sur l'ADN est :", "options": ["AATAAA.", "TATA.", "GCGC.", "AUG."], "correctAnswer": 0, "explanation": "Transcrit en AAUAAA sur l'ARN, il signale le clivage et l'ajout de la queue poly-A." },
                        { "id": 40, "question": "Les snRNP U1 et U2 reconnaissent respectivement :", "options": ["Le site donneur 5' (GU) et le point de branchement (A).", "Le site accepteur et le promoteur.", "L'exon et l'intron.", "La coiffe et la queue."], "correctAnswer": 0, "explanation": "Base de l'assemblage du spliceosome." },
                        { "id": 41, "question": "Une mutation dans un site d'épissage peut entraîner :", "options": ["L'exclusion d'un exon (Saut d'exon) ou la rétention d'un intron.", "Une amélioration de la protéine.", "Rien.", "Une duplication du gène."], "correctAnswer": 0, "explanation": "C'est la cause de nombreuses maladies génétiques (ex: Thalassémies)." },
                        { "id": 42, "question": "Le Lupus Érythémateux Disséminé (LED) est caractérisé par des anticorps anti :", "options": ["Anti-snRNP (antigène Smith) et anti-ADN.", "Anti-Ribosome.", "Anti-Mitochondrie.", "Anti-Membrane."], "correctAnswer": 0, "explanation": "Cible les composants du noyau et de l'épissage." },
                        { "id": 43, "question": "La Reverse Transcriptase (Transcriptase Inverse) est une :", "options": ["ADN Polymérase ARN-dépendante.", "ARN Polymérase ADN-dépendante.", "Protéase.", "Ligase."], "correctAnswer": 0, "explanation": "Elle synthétise de l'ADN (ADNc) à partir d'une matrice ARN (Rétrovirus)." },
                        { "id": 44, "question": "Les gènes de ménage (Housekeeping genes) sont :", "options": ["Exprimés de façon constitutive dans toutes les cellules.", "Exprimés uniquement dans le foie.", "Inductibles.", "Silencieux."], "correctAnswer": 0, "explanation": "Ils codent pour des fonctions cellulaires basales (ex: Cytosquelette, Métabolisme)." },
                        { "id": 45, "question": "Le promoteur est toujours situé :", "options": ["En amont (5') du site d'initiation de la transcription.", "En aval (3').", "Dans l'intron.", "Dans l'exon."], "correctAnswer": 0, "explanation": "Il contrôle le démarrage de la transcription." },
                        { "id": 46, "question": "Qu'est-ce qu'une unité de transcription ?", "options": ["Le segment d'ADN transcrit en un ARN primaire.", "Un chromosome.", "Un nucléosome.", "Une protéine."], "correctAnswer": 0, "explanation": "Elle commence au site +1 et finit au terminateur." },
                        { "id": 47, "question": "Les motifs 'Doigt de Zinc' et 'Leucine Zipper' sont caractéristiques de :", "options": ["Domaines de liaison à l'ADN des facteurs de transcription.", "Enzymes digestives.", "Protéines membranaires.", "Lipides."], "correctAnswer": 0, "explanation": "Ils permettent l'interaction spécifique avec les bases de l'ADN." },
                        { "id": 48, "question": "L'actinomycine D inhibe la transcription en :", "options": ["S'intercalant dans l'ADN double brin et bloquant la polymérase.", "Se liant au ribosome.", "Dégradant l'ARN.", "Modifiant les histones."], "correctAnswer": 0, "explanation": "C'est un antibiotique utilisé en chimiothérapie et recherche." },
                        { "id": 49, "question": "La séquence Shine-Dalgarno est présente sur :", "options": ["L'ARNm des procaryotes (pour la traduction).", "L'ADN.", "L'ARNm des eucaryotes.", "L'ARNt."], "correctAnswer": 0, "explanation": "Elle permet le recrutement du ribosome bactérien." },
                        { "id": 50, "question": "Certains ARNt subissent un épissage catalysé par :", "options": ["Des enzymes protéiques (Endonucléase et Ligase).", "Le spliceosome.", "Autocatalyse.", "L'ARN Pol."], "correctAnswer": 0, "explanation": "Mécanisme différent de l'épissage des ARNm." },
                        { "id": 51, "question": "Les introns auto-épissables (Groupe I et II) sont des :", "options": ["Ribozymes (ARN catalytiques).", "Protéines.", "Virus.", "Bactéries."], "correctAnswer": 0, "explanation": "Ils n'ont pas besoin de spliceosome pour s'exciser." },
                        { "id": 52, "question": "Quel nucléotide sert de cofacteur pour l'auto-épissage du groupe I ?", "options": ["La Guanosine (G).", "L'Adénosine.", "L'Uridine.", "La Cytidine."], "correctAnswer": 0, "explanation": "Le 3'-OH de la guanosine attaque le site d'épissage 5'." },
                        { "id": 53, "question": "La polyadénylation des ARNm eucaryotes a lieu :", "options": ["Dans le noyau, de manière post-transcriptionnelle.", "Dans le cytoplasme.", "Dans la mitochondrie.", "Dans le RE."], "correctAnswer": 0, "explanation": "C'est une étape de maturation nucléaire." },
                        { "id": 54, "question": "Le site d'initiation de la transcription est noté par convention :", "options": ["+1.", "0.", "-1.", "AUG."], "correctAnswer": 0, "explanation": "Les bases vers 5' sont notées négativement (-), celles vers 3' positivement (+)." },
                        { "id": 55, "question": "Les séquences régulatrices 'Cis' sont :", "options": ["Des séquences d'ADN sur le même chromosome que le gène (Promoteur, Enhancer).", "Des protéines.", "Des ARN.", "Des hormones."], "correctAnswer": 0, "explanation": "Elles sont reconnues par des facteurs 'Trans' (protéines diffusibles)." },
                        { "id": 56, "question": "Le brin codant de l'ADN a la même séquence que l'ARN transcrit (sauf T/U) :", "options": ["Vrai.", "Faux, il est complémentaire.", "Faux, il est inversé.", "Vrai, mais sans les exons."], "correctAnswer": 0, "explanation": "L'ARN est la copie du brin codant, faite à partir du brin matrice." },
                        { "id": 57, "question": "La maturation des pré-ARNr 45S se fait dans :", "options": ["Le nucléole.", "Le cytoplasme.", "Le RE.", "La mitochondrie."], "correctAnswer": 0, "explanation": "Site d'assemblage des sous-unités ribosomales." },
                        { "id": 58, "question": "Les snoRNA (small nucleolar RNA) guident :", "options": ["Les modifications chimiques (méthylation) et le clivage des ARNr.", "L'épissage.", "La traduction.", "La transcription."], "correctAnswer": 0, "explanation": "Ils s'apparient aux ARNr cibles pour guider les enzymes de modification." },
                        { "id": 59, "question": "La toxine diphtérique agit sur :", "options": ["La traduction (facteur EF-2).", "La transcription.", "La réplication.", "L'épissage."], "correctAnswer": 0, "explanation": "Attention, elle n'affecte pas la transcription." },
                        { "id": 60, "question": "L'ARN Pol I est-elle sensible à l'alpha-amanitine ?", "options": ["Non, elle est résistante.", "Oui, très sensible.", "Moyennement sensible.", "Uniquement à forte dose."], "correctAnswer": 0, "explanation": "Seule la Pol II est très sensible, la Pol III est moyennement sensible." },
                        { "id": 61, "question": "Le terminateur intrinsèque bactérien est formé par :", "options": ["Une tige-boucle riche en GC suivie d'une série de U.", "Une séquence poly-A.", "Une protéine Rho.", "Un intron."], "correctAnswer": 0, "explanation": "Structure secondaire de l'ARN qui déstabilise le complexe de transcription." },
                        { "id": 62, "question": "La protéine Rho est une :", "options": ["Hélicase ATP-dépendante qui dissocie l'hybride ARN/ADN.", "Polymérase.", "Ligase.", "Protéase."], "correctAnswer": 0, "explanation": "Elle 'court' après la polymérase et la décroche au site de terminaison." },
                        { "id": 63, "question": "Le facteur Sigma 70 est responsable de la transcription des :", "options": ["Gènes de ménage (Housekeeping) en conditions normales.", "Gènes de choc thermique.", "Gènes de sporulation.", "Gènes de flagelles."], "correctAnswer": 0, "explanation": "C'est le facteur Sigma principal chez E. coli." },
                        { "id": 64, "question": "Le complexe de pré-initiation (PIC) inclut :", "options": ["ARN Pol II, TFIID, A, B, F, E, H.", "ARN Pol III.", "Ribosome.", "Spliceosome."], "correctAnswer": 0, "explanation": "L'assemblage séquentiel de ces facteurs est requis in vitro." },
                        { "id": 65, "question": "L'activité kinase de TFIIH phosphoryle quelle sérine du CTD pour l'initiation ?", "options": ["Sérine 5.", "Sérine 2.", "Sérine 7.", "Tyrosine."], "correctAnswer": 0, "explanation": "La phosphorylation de la Ser5 marque le début de l'élongation et recrute les enzymes de coiffe." },
                        { "id": 66, "question": "L'atténuation dans l'opéron Trp repose sur :", "options": ["La formation de structures secondaires alternatives dans l'ARN leader selon la vitesse du ribosome.", "L'épissage.", "La dégradation.", "La méthylation."], "correctAnswer": 0, "explanation": "Couplage transcription-traduction." },
                        { "id": 67, "question": "En absence de Tryptophane, l'atténuation :", "options": ["Ne se produit pas, la transcription continue (Boucle anti-terminateur).", "Arrête la transcription.", "Inhibe l'opéron.", "Rien."], "correctAnswer": 0, "explanation": "Le ribosome cale sur les codons Trp, favorisant la structure qui permet à la polymérase de continuer." },
                        { "id": 68, "question": "Le récepteur aux glucocorticoïdes régule la transcription en se liant aux :", "options": ["GRE (Glucocorticoid Response Elements).", "TATA box.", "Ribosomes.", "Histones."], "correctAnswer": 0, "explanation": "C'est un activateur transcriptionnel inductible par ligand." },
                        { "id": 69, "question": "La protéine CAP (ou CRP) active l'opéron Lac en :", "options": ["Se fixant à l'ADN en présence d'AMPc et recrutant l'ARN Pol.", "Inhibant l'ARN Pol.", "Dégradant le lactose.", "Se fixant au glucose."], "correctAnswer": 0, "explanation": "C'est un régulateur positif sensible au niveau de glucose (via AMPc)." },
                        { "id": 70, "question": "La répression catabolique empêche l'utilisation du lactose si :", "options": ["Du glucose est présent.", "Du lactose est présent.", "Il n'y a pas de glucose.", "Il fait froid."], "correctAnswer": 0, "explanation": "Le glucose baisse l'AMPc, donc CAP est inactif, donc l'opéron Lac est peu transcrit." },
                        { "id": 71, "question": "Les facteurs de transcription à homéodomaine contrôlent :", "options": ["Le développement embryonnaire (gènes homéotiques).", "La digestion.", "La respiration.", "La réplication."], "correctAnswer": 0, "explanation": "Le motif Hélice-Tour-Hélice est typique." },
                        { "id": 72, "question": "Le motif 'Leucine Zipper' permet la dimérisation via :", "options": ["Des interactions hydrophobes entre leucines.", "Des ponts disulfures.", "Des liaisons ioniques.", "L'ADN."], "correctAnswer": 0, "explanation": "Structure en fermeture éclair." },
                        { "id": 73, "question": "Les micro-ARN (miRNA) sont :", "options": ["De petits ARN non codants régulateurs endogènes.", "Des ARN viraux.", "Des ARNm.", "Des protéines."], "correctAnswer": 0, "explanation": "Ils s'apparient imparfaitement aux ARNm cibles pour inhiber leur traduction." },
                        { "id": 74, "question": "L'interférence ARN (siRNA) conduit à :", "options": ["Le clivage (dégradation) de l'ARNm cible parfaitement complémentaire.", "La traduction.", "L'épissage.", "La mutation."], "correctAnswer": 0, "explanation": "Mécanisme de défense antiviral et de régulation." },
                        { "id": 75, "question": "Le clivage du pré-ARNm lors de la polyadénylation se fait après la séquence :", "options": ["AAUAAA.", "AUG.", "UAA.", "GUG."], "correctAnswer": 0, "explanation": "Le site de clivage est situé 10-30 nucléotides en aval." },
                        { "id": 76, "question": "Les ARNm histones sont particuliers car :", "options": ["Ils n'ont pas de queue poly-A (structure tige-boucle en 3').", "Ils n'ont pas de coiffe.", "Ils sont transcrits par Pol I.", "Ils sont circulaires."], "correctAnswer": 0, "explanation": "Leur stabilité est régulée pendant le cycle cellulaire." },
                        { "id": 77, "question": "Une mutation dans le promoteur peut :", "options": ["Diminuer ou augmenter le taux de transcription.", "Changer la séquence de la protéine.", "Changer l'épissage.", "Rien."], "correctAnswer": 0, "explanation": "Elle affecte la fixation des facteurs de transcription." },
                        { "id": 78, "question": "La demi-vie des ARNm influence :", "options": ["La quantité de protéine produite.", "La séquence de la protéine.", "La réplication.", "L'épissage."], "correctAnswer": 0, "explanation": "C'est un point de régulation post-transcriptionnelle majeur." },
                        { "id": 79, "question": "Le complexe Exosome est responsable de :", "options": ["La dégradation des ARN en 3'->5'.", "La synthèse d'ARN.", "L'épissage.", "La traduction."], "correctAnswer": 0, "explanation": "Machinerie de nettoyage et de contrôle qualité des ARN." },
                        { "id": 80, "question": "L'inosine dans l'ARNt (anticodon) permet :", "options": ["L'appariement wobble (reconnaît A, U, C).", "La stabilité.", "La fixation de l'AA.", "La terminaison."], "correctAnswer": 0, "explanation": "Augmente la flexibilité de lecture du code génétique." },
                        { "id": 81, "question": "L'ARN 16S bactérien est impliqué dans :", "options": ["L'initiation de la traduction (reconnaissance Shine-Dalgarno).", "La transcription.", "L'épissage.", "La dégradation."], "correctAnswer": 0, "explanation": "Composant de la petite sous-unité 30S." },
                        { "id": 82, "question": "L'activité peptidyl-transférase du ribosome est portée par :", "options": ["L'ARNr 23S (bactérie) ou 28S (eucaryote).", "Une protéine.", "L'ARNm.", "L'ARNt."], "correctAnswer": 0, "explanation": "C'est un ribozyme naturel." },
                        { "id": 83, "question": "Le nucléole est le site de synthèse de :", "options": ["ARNr (sauf 5S).", "ARNm.", "ARNt.", "ADN."], "correctAnswer": 0, "explanation": "Usine à ribosomes." },
                        { "id": 84, "question": "L'ARN 5S est transcrit par :", "options": ["ARN Pol III.", "ARN Pol I.", "ARN Pol II.", "ARN Pol IV."], "correctAnswer": 0, "explanation": "Hors du nucléole." },
                        { "id": 85, "question": "Un pseudogène processé provient de :", "options": ["La rétrotransposition d'un ARNm mature (sans introns).", "Une duplication d'ADN.", "Une mutation.", "Un virus."], "correctAnswer": 0, "explanation": "Il possède une queue poly-A génomique et pas d'introns." },

                        { "id": 88, "question": "SREBP-1c active la transcription des gènes de :", "options": ["La lipogenèse (FAS, ACC).", "La glycolyse.", "La réplication.", "L'apoptose."], "correctAnswer": 0, "explanation": "Régulé par l'insuline." },
                        { "id": 89, "question": "Le Run-on assay mesure :", "options": ["La densité de polymérases actives sur un gène (taux de transcription).", "La quantité d'ARNm total.", "La stabilité.", "La traduction."], "correctAnswer": 0, "explanation": "Technique classique d'étude de la transcription." },
                        { "id": 90, "question": "La technique RNA-Seq utilise :", "options": ["Le séquençage haut débit des ADNc issus des ARN.", "L'hybridation.", "La PCR seule.", "Le microscope."], "correctAnswer": 0, "explanation": "Standard actuel pour la transcriptomique." },
                        { "id": 91, "question": "H3K9me3 (Triméthylation Lysine 9 Histone 3) est une marque de :", "options": ["Hétérochromatine constitutive (Répression).", "Activation.", "Épissage.", "Élongation."], "correctAnswer": 0, "explanation": "Code histone répressif." },
                        { "id": 92, "question": "H3K4me3 (Triméthylation Lysine 4 Histone 3) est une marque de :", "options": ["Promoteur actif.", "Répression.", "Enhancer.", "Corps du gène."], "correctAnswer": 0, "explanation": "Code histone activateur." },
                        { "id": 93, "question": "Le remodelage de la chromatine (ex: SWI/SNF) consomme de l'ATP pour :", "options": ["Déplacer ou éjecter les nucléosomes.", "Acétyler les histones.", "Méthyler l'ADN.", "Couper l'ADN."], "correctAnswer": 0, "explanation": "Rend l'ADN accessible aux facteurs de transcription." },

                        { "id": 5, "question": "L'hétérochromatine constitutive est :", "options": ["Toujours condensée et transcriptionnellement inactive (ex: Centromères).", "Parfois active.", "Décondensée.", "Riche en gènes."], "correctAnswer": 0, "explanation": "Elle contient peu de gènes et beaucoup de séquences répétées." },
                        { "id": 6, "question": "L'hétérochromatine facultative est :", "options": ["Condensée ou décondensée selon le type cellulaire ou le stade de développement.", "Toujours inactive.", "Toujours active.", "Absente chez l'homme."], "correctAnswer": 0, "explanation": "Exemple : Le chromosome X inactivé (Corpuscule de Barr) chez la femme." },
                        { "id": 7, "question": "L'euchromatine est caractérisée par :", "options": ["Une structure moins condensée, riche en gènes et accessible à la transcription.", "Une condensation extrême.", "L'absence de gènes.", "Une localisation centromérique."], "correctAnswer": 0, "explanation": "C'est la forme active de la chromatine." },
                        { "id": 8, "question": "Le nucléosome est l'unité de base de la chromatine, il est formé de :", "options": ["146 pb d'ADN enroulées autour d'un octamère d'histones.", "ADN nu.", "ARN et protéines.", "Une seule histone."], "correctAnswer": 0, "explanation": "L'octamère contient deux copies de H2A, H2B, H3 et H4." },
                        { "id": 9, "question": "L'histone H1 est appelée 'histone de liaison' car :", "options": ["Elle se fixe sur l'ADN internucléosomique et stabilise la fibre de 30 nm.", "Elle est au cœur du nucléosome.", "Elle dégrade l'ADN.", "Elle initie la transcription."], "correctAnswer": 0, "explanation": "Elle aide à la compaction supérieure (solénoïde)." },
                        { "id": 10, "question": "Les séquences d'ADN hautement répétées en tandem (ADN satellite) se trouvent surtout :", "options": ["Aux centromères et télomères.", "Dans les exons.", "Dans les promoteurs.", "Dans les mitochondries."], "correctAnswer": 0, "explanation": "Elles jouent un rôle structural dans la ségrégation des chromosomes." },
                        { "id": 11, "question": "Les microsatellites (STR - Short Tandem Repeats) sont :", "options": ["Des répétitions de motifs très courts (2-6 pb) très polymorphes.", "Des gènes codants.", "Des longs fragments.", "Des virus."], "correctAnswer": 0, "explanation": "Utilisés en médecine légale pour les empreintes génétiques." },
                        { "id": 12, "question": "Les minisatellites (VNTR) sont :", "options": ["Des répétitions de motifs de 10 à 100 pb.", "Des gènes.", "Des histones.", "Des lipides."], "correctAnswer": 0, "explanation": "Variable Number of Tandem Repeats, utilisés aussi en empreintes génétiques." },
                        { "id": 13, "question": "Les séquences Alu sont classées comme :", "options": ["Des SINEs (Short Interspersed Nuclear Elements).", "Des LINEs.", "Des satellites.", "Des gènes."], "correctAnswer": 0, "explanation": "Ce sont des rétrotransposons non autonomes d'environ 300 pb, spécifiques aux primates." },
                        { "id": 14, "question": "Les séquences LINE-1 (Long Interspersed Nuclear Elements) sont :", "options": ["Des rétrotransposons autonomes codant pour une transcriptase inverse.", "Des gènes de ménage.", "Des séquences virales.", "Des satellites."], "correctAnswer": 0, "explanation": "Elles représentent environ 17% du génome humain et peuvent se déplacer (transposition)." },
                        { "id": 15, "question": "Quel pourcentage du génome humain est constitué de séquences répétées ou dérivées de transposons ?", "options": ["Environ 45-50%.", "5%.", "90%.", "1%."], "correctAnswer": 0, "explanation": "Une grande partie de notre ADN est d'origine 'parasitaire' ou virale ancienne." },
                        { "id": 16, "question": "Un pseudogène est :", "options": ["Une copie non fonctionnelle d'un gène (accumulation de mutations).", "Un gène actif.", "Un intron.", "Un exon."], "correctAnswer": 0, "explanation": "Il peut provenir d'une duplication (pseudogène non processé) ou d'une rétrotransposition (pseudogène processé sans introns)." },
                        { "id": 17, "question": "Les familles de gènes (ex: Globines) sont issues de :", "options": ["Duplications ancestrales suivies de divergences.", "Fusion de gènes.", "Mutation ponctuelle.", "Délétion."], "correctAnswer": 0, "explanation": "Cela permet la spécialisation des fonctions (ex: Hémoglobine fœtale vs adulte)." },
                        { "id": 18, "question": "Le génome mitochondrial humain est :", "options": ["Un ADN circulaire double brin de 16,6 kb.", "Un ADN linéaire.", "Un ARN.", "Un chromosome géant."], "correctAnswer": 0, "explanation": "Il code pour 37 gènes (13 protéines, 22 ARNt, 2 ARNr)." },
                        { "id": 19, "question": "L'hérédité de l'ADN mitochondrial est :", "options": ["Exclusivement maternelle.", "Paternelle.", "Mendélienne classique.", "Aléatoire."], "correctAnswer": 0, "explanation": "Les mitochondries du spermatozoïde ne pénètrent pas ou sont détruites dans l'ovocyte." },
                        { "id": 20, "question": "Le code génétique mitochondrial diffère du code nucléaire car :", "options": ["UGA code pour le Tryptophane (et non STOP) et AUA pour la Méthionine.", "Il n'y a pas de codons.", "Il est plus complexe.", "Il utilise 5 bases."], "correctAnswer": 0, "explanation": "C'est une exception à l'universalité du code génétique." },
                        { "id": 21, "question": "Les gènes mitochondriaux contiennent-ils des introns ?", "options": ["Non, ils sont compacts et sans introns.", "Oui, beaucoup.", "Parfois.", "Uniquement les gènes ARNt."], "correctAnswer": 0, "explanation": "L'organisation est très dense pour économiser de la place, ressemblant aux bactéries." },
                        { "id": 22, "question": "La densité génique (nombre de gènes par Mb) est :", "options": ["Variable selon les chromosomes (élevée sur le 19, faible sur le Y).", "Constante.", "Nulle.", "Identique à celle des bactéries."], "correctAnswer": 0, "explanation": "Les régions riches en GC (bandes R) sont généralement plus riches en gènes." },
                        { "id": 23, "question": "Les îlots CpG sont :", "options": ["Des régions riches en CG souvent situées dans les promoteurs des gènes.", "Des zones de terminaison.", "Des introns.", "Des télomères."], "correctAnswer": 0, "explanation": "Ils sont généralement non méthylés quand le gène est actif." },
                        { "id": 24, "question": "La synténie désigne :", "options": ["La conservation de l'ordre des gènes sur un chromosome entre deux espèces.", "La synthèse d'ADN.", "La mutation.", "La duplication."], "correctAnswer": 0, "explanation": "Preuve de l'évolution commune (ex: blocs de synténie Homme-Souris)." },
                        { "id": 25, "question": "Un rétrotransposon se déplace via :", "options": ["Un intermédiaire ARN (copié-collé).", "Un intermédiaire ADN (coupé-collé).", "Une protéine.", "Un lipide."], "correctAnswer": 0, "explanation": "Transcription en ARN, puis Reverse Transcription en ADN qui s'insère ailleurs." },
                        { "id": 26, "question": "Un transposon à ADN se déplace via :", "options": ["Un mécanisme de coupé-collé (transposase).", "Un intermédiaire ARN.", "La réplication.", "La traduction."], "correctAnswer": 0, "explanation": "Il s'excise de son site d'origine pour aller s'insérer ailleurs." },
                        { "id": 27, "question": "Les séquences LTR (Long Terminal Repeats) sont caractéristiques de :", "options": ["Rétrovirus endogènes (HERV).", "LINEs.", "SINEs.", "Gènes de ménage."], "correctAnswer": 0, "explanation": "Vestiges d'anciennes infections virales intégrées au génome." },
                        { "id": 28, "question": "Le chromosome Y est caractérisé par :", "options": ["Une grande quantité d'hétérochromatine et peu de gènes.", "Beaucoup de gènes vitaux.", "Une taille immense.", "L'absence de centromère."], "correctAnswer": 0, "explanation": "Il contient le gène SRY déterminant le sexe masculin, mais peu d'autres gènes." },
                        { "id": 29, "question": "Les régions pseudo-autosomiques (PAR1 et PAR2) permettent :", "options": ["L'appariement des chromosomes X et Y lors de la méiose.", "La réplication.", "La transcription.", "Rien."], "correctAnswer": 0, "explanation": "Ce sont les seules régions d'homologie entre X et Y." },
                        { "id": 30, "question": "L'inactivation du chromosome X (Lyonisation) chez la femme est :", "options": ["Aléatoire (paternel ou maternel) et clonale.", "Toujours le paternel.", "Toujours le maternel.", "Absente."], "correctAnswer": 0, "explanation": "Crée une mosaïque cellulaire fonctionnelle." },
                        { "id": 31, "question": "Quel ARN non codant déclenche l'inactivation du X ?", "options": ["XIST.", "TSIX.", "Alu.", "ARNr."], "correctAnswer": 0, "explanation": "Il recouvre le chromosome X et recrute des facteurs de répression." },
                        { "id": 32, "question": "Les CNV (Copy Number Variations) sont :", "options": ["Des variations du nombre de copies de segments d'ADN (duplications/délétions).", "Des mutations ponctuelles (SNP).", "Des inversions.", "Des translocations."], "correctAnswer": 0, "explanation": "Source majeure de variabilité génétique interindividuelle." },
                        { "id": 33, "question": "Le centromère est essentiel pour :", "options": ["L'attachement des microtubules du fuseau mitotique (kinétochore).", "La transcription.", "La protection des bouts.", "La réplication."], "correctAnswer": 0, "explanation": "Constitué d'ADN satellite alpha répété." },
                        { "id": 34, "question": "Les télomères sont constitués de répétitions :", "options": ["TTAGGG (chez l'homme).", "AAATTT.", "GCGCGC.", "CAGCAG."], "correctAnswer": 0, "explanation": "Ils raccourcissent à chaque division cellulaire (sauf si télomérase active)." },
                        { "id": 35, "question": "Un haplotype est :", "options": ["Un groupe d'allèles ou de marqueurs sur un même chromosome transmis ensemble.", "Un gène seul.", "Un phénotype.", "Une protéine."], "correctAnswer": 0, "explanation": "Utilisé pour étudier les associations génétiques." },
                        { "id": 36, "question": "Le déséquilibre de liaison signifie que :", "options": ["Certains allèles sont associés plus souvent que prévu par le hasard.", "Les allèles sont indépendants.", "Il y a une mutation.", "Le génome est instable."], "correctAnswer": 0, "explanation": "Indique souvent une proximité physique sur le chromosome." },
                        { "id": 37, "question": "La taille moyenne d'un gène humain est d'environ :", "options": ["27 kb (mais très variable).", "1 kb.", "1 Mb.", "100 pb."], "correctAnswer": 0, "explanation": "Le gène de la dystrophine fait 2.4 Mb (le plus grand), d'autres sont très petits." },
                        { "id": 38, "question": "La taille moyenne d'un ARNm mature est d'environ :", "options": ["1.5 à 2 kb.", "27 kb.", "100 pb.", "10 Mb."], "correctAnswer": 0, "explanation": "Beaucoup plus petit que le gène à cause de l'épissage des introns." },
                        { "id": 39, "question": "La recombinaison méiotique (Crossing-over) a lieu :", "options": ["Pendant la Prophase I de la méiose.", "En mitose.", "En phase S.", "En anaphase."], "correctAnswer": 0, "explanation": "Mélange les allèles parentaux (brassage intrachromosomique)." },
                        { "id": 40, "question": "Les points chauds de recombinaison sont :", "options": ["Des régions où les crossing-over sont plus fréquents.", "Des régions sans gènes.", "Des centromères.", "Des régions mutées."], "correctAnswer": 0, "explanation": "La recombinaison n'est pas uniforme le long du chromosome." },
                        { "id": 41, "question": "Un polymorphisme est défini comme une variation présente dans la population à une fréquence :", "options": ["> 1%.", "< 1%.", "100%.", "Nulle."], "correctAnswer": 0, "explanation": "En dessous de 1%, on parle généralement de mutation ou variant rare." },
                        { "id": 42, "question": "Le projet ENCODE visait à :", "options": ["Identifier tous les éléments fonctionnels du génome humain.", "Séquencer le génome.", "Cloner des gènes.", "Trouver des maladies."], "correctAnswer": 0, "explanation": "A révélé que 80% du génome a une activité biochimique (transcription, régulation), pas juste 'ADN poubelle'." },
                        { "id": 43, "question": "La famille des gènes HOX contrôle :", "options": ["Le plan d'organisation du corps (axe antéro-postérieur) durant le développement.", "La couleur des yeux.", "La digestion.", "La respiration."], "correctAnswer": 0, "explanation": "Disposés en clusters sur les chromosomes." },
                        { "id": 44, "question": "Un Cluster de gènes est :", "options": ["Un groupe de gènes homologues situés à proximité sur le même chromosome.", "Un gène seul.", "Un intron.", "Un ribosome."], "correctAnswer": 0, "explanation": "Ex: Cluster des globines alpha et bêta." },
                        { "id": 45, "question": "La duplication génique est un moteur de l'évolution car :", "options": ["Une copie garde la fonction originale, l'autre peut diverger et acquérir une nouvelle fonction.", "Elle détruit l'ADN.", "Elle arrête la réplication.", "Elle simplifie le génome."], "correctAnswer": 0, "explanation": "Néofonctionnalisation." },
                        { "id": 46, "question": "L'orthologie désigne des gènes :", "options": ["Dans des espèces différentes, issus d'un ancêtre commun (spéciation).", "Dans la même espèce (duplication).", "Similaires par hasard.", "Différents."], "correctAnswer": 0, "explanation": "Ont souvent la même fonction." },
                        { "id": 47, "question": "La paralogie désigne des gènes :", "options": ["Dans la même espèce, issus d'une duplication.", "Dans des espèces différentes.", "Identiques.", "Non homologues."], "correctAnswer": 0, "explanation": "Ex: Myoglobine et Hémoglobine." },
                        { "id": 48, "question": "Le SNP (Single Nucleotide Polymorphism) est :", "options": ["La forme de variation génétique la plus abondante.", "Très rare.", "Une délétion.", "Une translocation."], "correctAnswer": 0, "explanation": "Environ 1 SNP toutes les 1000 bases entre deux individus." },
                        { "id": 49, "question": "La GWAS (Genome-Wide Association Study) cherche :", "options": ["Des associations entre des variants génétiques (SNP) et des maladies complexes.", "Des mutations rares.", "Des protéines.", "Des virus."], "correctAnswer": 0, "explanation": "Approche statistique sans hypothèse a priori." },
                        { "id": 50, "question": "L'empreinte génomique parentale concerne :", "options": ["L'expression monoallélique d'un gène selon son origine parentale (Père ou Mère).", "Tous les gènes.", "Les mitochondries.", "Le groupe sanguin."], "correctAnswer": 0, "explanation": "Régulée par méthylation différentielle (ex: IGF2)." },
                        { "id": 51, "question": "Le syndrome de Prader-Willi et d'Angelman sont des exemples de maladies liées à :", "options": ["L'empreinte génomique (délétion 15q11-13).", "Une mutation ponctuelle.", "Une trisomie.", "Une infection."], "correctAnswer": 0, "explanation": "Même région chromosomique, mais phénotype différent selon que la délétion est paternelle ou maternelle." },
                        { "id": 52, "question": "La disomie uniparentale (DUP) est :", "options": ["La présence de deux copies d'un chromosome provenant du même parent.", "Une trisomie.", "Une monosomie.", "Normale."], "correctAnswer": 0, "explanation": "Peut causer des maladies d'empreinte ou récessives." },
                        { "id": 53, "question": "La topologie des chromosomes dans le noyau est :", "options": ["Organisée en territoires chromosomiques distincts.", "Aléatoire.", "Mélangée comme des spaghettis.", "Rigide."], "correctAnswer": 0, "explanation": "L'architecture nucléaire est fonctionnelle (TADs)." },
                        { "id": 54, "question": "Les TADs (Topologically Associating Domains) sont :", "options": ["Des régions d'ADN interagissant préférentiellement entre elles.", "Des gènes.", "Des protéines.", "Des organites."], "correctAnswer": 0, "explanation": "Unités structurelles de la chromatine." },
                        { "id": 55, "question": "La cohésine est un complexe protéique qui :", "options": ["Maintient les chromatides soeurs ensemble et structure les boucles d'ADN.", "Coupe l'ADN.", "Synthétise l'ADN.", "Dégrade l'ADN."], "correctAnswer": 0, "explanation": "Rôle clé dans l'architecture du génome et la mitose." },
                        { "id": 56, "question": "CTCF est une protéine qui :", "options": ["Agit comme isolateur et délimite les frontières des TADs.", "Active la transcription.", "Répare l'ADN.", "Est une histone."], "correctAnswer": 0, "explanation": "Organisateur majeur de la chromatine." },
                        { "id": 57, "question": "La lamina nucléaire interagit avec :", "options": ["L'hétérochromatine (LADs - Lamina Associated Domains).", "L'euchromatine.", "Les ribosomes.", "Le cytoplasme."], "correctAnswer": 0, "explanation": "Ancrage des régions silencieuses en périphérie du noyau." },
                        { "id": 58, "question": "Les séquences Alu sont riches en :", "options": ["Sites de restriction AluI (d'où leur nom).", "Gènes.", "Introns.", "Protéines."], "correctAnswer": 0, "explanation": "Elles contiennent aussi un promoteur Pol III interne." },
                        { "id": 59, "question": "La rétrotransposition active des LINE-1 peut causer :", "options": ["Des mutations insertionnelles (Hémophilie, Cancer).", "La stabilité du génome.", "La réparation.", "Rien."], "correctAnswer": 0, "explanation": "Bien que la plupart soient inactifs, certains sont encore mobiles." },
                        { "id": 60, "question": "Les transposons à ADN (Fossiles) représentent :", "options": ["Environ 3% du génome humain (inactifs).", "50%.", "0%.", "100%."], "correctAnswer": 0, "explanation": "Ils ne bougent plus chez l'homme." },
                        { "id": 61, "question": "Le terme 'Junk DNA' (ADN poubelle) est :", "options": ["Obsolète, car beaucoup de ces régions ont des fonctions régulatrices.", "Correct.", "Scientifique.", "Nouveau."], "correctAnswer": 0, "explanation": "L'ADN non codant est fonctionnellement important." },
                        { "id": 62, "question": "Le polymorphisme de longueur des fragments de restriction (RFLP) est dû à :", "options": ["La création ou suppression d'un site de restriction par une mutation.", "La longueur des gènes.", "L'ARN.", "La protéine."], "correctAnswer": 0, "explanation": "Ancienne méthode de génotypage." },
                        { "id": 63, "question": "Les marqueurs microsatellites sont utilisés pour :", "options": ["L'identification génétique et la cartographie.", "Le séquençage.", "L'expression.", "La thérapie."], "correctAnswer": 0, "explanation": "Très polymorphes et faciles à amplifier par PCR." },
                        { "id": 64, "question": "Le linkage (liaison génétique) se produit quand :", "options": ["Deux gènes sont proches sur le même chromosome et ségrègent ensemble.", "Ils sont sur des chromosomes différents.", "Ils sont loin.", "Ils mutent."], "correctAnswer": 0, "explanation": "La fréquence de recombinaison est faible." },
                        { "id": 65, "question": "La distance génétique se mesure en :", "options": ["Centimorgans (cM).", "Paires de bases.", "Mètres.", "Grammes."], "correctAnswer": 0, "explanation": "1 cM = 1% de recombinaison." },
                        { "id": 66, "question": "Le séquençage du génome humain a été achevé (version initiale) en :", "options": ["2001/2003.", "1990.", "2020.", "1953."], "correctAnswer": 0, "explanation": "Projet HGP (Human Genome Project)." },
                        { "id": 67, "question": "La métagénomique étudie :", "options": ["L'ADN de communautés microbiennes environnementales (ex: Microbiote).", "Le génome humain seul.", "Les métastases.", "Les métabolites."], "correctAnswer": 0, "explanation": "Sans culture préalable." },
                        { "id": 68, "question": "L'ADN ancien (Paléogénomique) permet :", "options": ["D'étudier l'évolution humaine (Néandertal).", "De cloner des dinosaures (Jurassic Park est fiction).", "De guérir.", "Rien."], "correctAnswer": 0, "explanation": "ADN dégradé et fragmenté." },
                        { "id": 69, "question": "La translocation robertsonienne implique :", "options": ["La fusion de deux chromosomes acrocentriques (13, 14, 15, 21, 22).", "N'importe quel chromosome.", "Une perte totale.", "Une duplication."], "correctAnswer": 0, "explanation": "Peut causer des trisomies (ex: Trisomie 21 par translocation)." },
                        { "id": 70, "question": "L'aneuploïdie est :", "options": ["Un nombre anormal de chromosomes (ex: 45 ou 47).", "Un lot normal (46).", "Une polyploïdie (69).", "Une mutation."], "correctAnswer": 0, "explanation": "Monosomie ou Trisomie." },
                        { "id": 71, "question": "La trisomie 21 est due à :", "options": ["Une non-disjonction méiotique (Chromosomique).", "Une mutation ponctuelle.", "Un virus.", "Un régime."], "correctAnswer": 0, "explanation": "Présence de 3 chromosomes 21." },
                        { "id": 72, "question": "Le syndrome de Turner est :", "options": ["45, X (Monosomie X chez la femme).", "47, XXY.", "Trisomie 21.", "46, XY."], "correctAnswer": 0, "explanation": "Seule monosomie viable." },
                        { "id": 73, "question": "Le syndrome de Klinefelter est :", "options": ["47, XXY (Homme).", "45, X.", "47, XYY.", "46, XX."], "correctAnswer": 0, "explanation": "Hypogonadisme masculin." },
                        { "id": 74, "question": "L'hybridation génomique comparative (CGH-array) détecte :", "options": ["Les gains et pertes de matériel génétique (CNV, microdélétions).", "Les translocations équilibrées.", "Les mutations ponctuelles.", "L'ARN."], "correctAnswer": 0, "explanation": "Caryotype moléculaire haute résolution." },
                        { "id": 75, "question": "Le chromosome Philadelphie (t(9;22)) cause :", "options": ["La Leucémie Myéloïde Chronique (LMC).", "La grippe.", "Le diabète.", "La trisomie."], "correctAnswer": 0, "explanation": "Fusion des gènes BCR-ABL (Tyrosine Kinase active)." },
                        { "id": 76, "question": "L'hétéroplasmie mitochondriale signifie :", "options": ["La coexistence de mitochondries normales et mutées dans une même cellule.", "Avoir deux noyaux.", "Avoir deux types de sang.", "Rien."], "correctAnswer": 0, "explanation": "Explique la variabilité clinique des maladies mitochondriales." },
                        { "id": 77, "question": "Le taux de mutation de l'ADN mitochondrial est :", "options": ["Plus élevé que l'ADN nucléaire (10x).", "Plus faible.", "Identique.", "Nul."], "correctAnswer": 0, "explanation": "Pas de protection par histones, réparation moins efficace, radicaux libres." },
                        { "id": 78, "question": "Les maladies mitochondriales touchent surtout :", "options": ["Les tissus à haute demande énergétique (Muscle, Cerveau).", "La peau.", "Les os.", "Le tissu adipeux."], "correctAnswer": 0, "explanation": "Myopathies, encéphalopathies." },
                        { "id": 79, "question": "Le génome nucléaire humain est composé de molécules d'ADN :", "options": ["Linéaires.", "Circulaires.", "Simples brins.", "ARN."], "correctAnswer": 0, "explanation": "23 paires de molécules linéaires." },
                        { "id": 80, "question": "La taille des introns humains est :", "options": ["Généralement beaucoup plus grande que celle des exons.", "Plus petite.", "Égale.", "Nulle."], "correctAnswer": 0, "explanation": "D'où la grande taille des gènes humains." },
                        { "id": 81, "question": "La dystrophine est codée par le gène :", "options": ["Le plus grand du génome humain (2.4 Mb).", "Le plus petit.", "Moyen.", "Mitochondrial."], "correctAnswer": 0, "explanation": "Situé sur le chromosome X." },
                        { "id": 82, "question": "La Titine est la protéine :", "options": ["La plus grande (codée par l'ARNm le plus long).", "La plus petite.", "Une enzyme.", "Un lipide."], "correctAnswer": 0, "explanation": "Gène géant avec le plus d'exons." },
                        { "id": 83, "question": "L'ADN égoïste (Selfish DNA) fait référence aux :", "options": ["Transposons qui se répliquent pour leur propre survie.", "Gènes vitaux.", "Exons.", "Promoteurs."], "correctAnswer": 0, "explanation": "Théorie de l'évolution." },
                        { "id": 84, "question": "La domestication des transposons signifie :", "options": ["L'utilisation par l'hôte de protéines de transposons pour ses propres fonctions (ex: RAG1/2 immunité).", "Les tuer.", "Les manger.", "Rien."], "correctAnswer": 0, "explanation": "Exaptation." },
                        { "id": 85, "question": "Les gènes RAG1/RAG2 (recombinaison V(D)J) proviennent de :", "options": ["D'anciens transposons.", "De virus.", "De bactéries.", "De champignons."], "correctAnswer": 0, "explanation": "Origine de l'immunité adaptative." },
                        { "id": 86, "question": "La syncytine (placenta) provient de :", "options": ["D'une protéine d'enveloppe de rétrovirus endogène (HERV).", "D'une bactérie.", "D'un phage.", "D'une plante."], "correctAnswer": 0, "explanation": "Essentielle à la fusion cellulaire placentaire." },
