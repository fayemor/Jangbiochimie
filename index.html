                                <div>
                                    <h4 class="font-bold text-base md:text-lg mb-1">Entraînement</h4>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Corrections immédiates, idéal pour mémoriser.</p>
                                </div>
                            </div>

                            <!-- Mode Évaluation -->
                            <div onclick="app.startQuiz('eval')" class="bg-white dark:bg-dark-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-rose-500 dark:hover:border-rose-500 cursor-pointer transition-all group shadow-sm flex sm:flex-col items-center sm:items-start gap-4 sm:gap-0">
                                <div class="w-12 h-12 rounded-full bg-rose-50 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center sm:mb-4 group-hover:scale-110 transition-transform flex-shrink-0"><i data-lucide="timer"></i></div>
                                <div>
                                    <h4 class="font-bold text-base md:text-lg mb-1">Évaluation</h4>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Conditions réelles. Pas de correction en direct.</p>
                                </div>
                            </div>

                            <!-- Mode Flashcards -->
                            <div onclick="app.navigate('flashcards')" class="bg-white dark:bg-dark-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 hover:border-amber-500 dark:hover:border-amber-500 cursor-pointer transition-all group shadow-sm flex sm:flex-col items-center sm:items-start gap-4 sm:gap-0">
                                <div class="w-12 h-12 rounded-full bg-amber-50 dark:bg-amber-900/30 text-amber-500 flex items-center justify-center sm:mb-4 group-hover:scale-110 transition-transform flex-shrink-0"><i data-lucide="layers"></i></div>
                                <div>
                                    <h4 class="font-bold text-base md:text-lg mb-1">Flashcards</h4>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Révisez les définitions par mémorisation active.</p>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            },

            quizState: { questions: [], currentIndex: 0, score: 0, startTime: 0 },

            startQuiz(mode) {
                const mod = MOCK_DATA.modules.find(m => m.id === this.state.currentModule);
                this.state.quizMode = mode;

                // Mélange et limite à 20 max pour l'UX
                this.quizState.questions = [...mod.questions].sort(() => Math.random() - 0.5).slice(0, 20);

                if (this.quizState.questions.length === 0) {
                    this.showToast("Erreur", "Aucune question disponible.");
                    return;
                }

                this.quizState.currentIndex = 0;
                this.quizState.score = 0;
                this.navigate('quiz');
            },

            renderQuiz(container) {
                const qIndex = this.quizState.currentIndex;
                const total = this.quizState.questions.length;
                const q = this.quizState.questions[qIndex];
                const mode = this.state.quizMode;
                const isEval = mode === 'eval';

                if (qIndex >= total) return this.renderQuizResults(container);

                const progress = ((qIndex) / total) * 100;

                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="app.selectAnswer(${idx})" id="opt-${idx}" class="w-full text-left p-4 md:p-5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-dark-800 hover:border-brand-400 hover:shadow-md transition-all font-medium text-sm md:text-base text-slate-700 dark:text-slate-200 mb-3 active:scale-[0.98]">
                            ${opt}
                        </button>
                    `;
                });

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto animate-fade-in w-full">
                        
                        <!-- Header Quiz -->
                        <div class="flex justify-between items-center mb-4 md:mb-6">
                            <span class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider">Q ${qIndex + 1} sur ${total}</span>
                            ${isEval ? '<span class="flex items-center gap-1.5 text-xs font-bold text-rose-500 bg-rose-50 dark:bg-rose-900/30 px-3 py-1 rounded-full"><i data-lucide="clock" class="w-3 h-3"></i> Mode Exam</span>' : ''}
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 md:h-2 rounded-full mb-6 md:mb-8 overflow-hidden">
                            <div class="bg-brand-500 h-full rounded-full transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                        </div>

                        <!-- Question Area -->
                        <div class="mb-6 md:mb-8">
                            <h3 class="text-xl md:text-2xl font-bold mb-6 text-slate-900 dark:text-white leading-relaxed">${q.question}</h3>
                            <div id="options-container" class="flex flex-col gap-1">
                                ${optionsHtml}
                            </div>
                        </div>

                        <!-- Zone Explication (Cachée) -->
                        <div id="explanation-box" class="hidden bg-slate-50 dark:bg-slate-900/50 p-4 md:p-6 rounded-2xl border-l-4 border-l-brand-500 mb-6">
                            <h4 class="font-bold mb-2 flex items-center gap-2 text-sm text-brand-600 dark:text-brand-400"><i data-lucide="lightbulb" class="w-4 h-4"></i> Explication</h4>
                            <p class="text-sm md:text-base text-slate-600 dark:text-slate-300 leading-relaxed">${q.explanation}</p>
                        </div>

                        <!-- Contrôles -->
                        <div class="flex justify-end pb-8">
                            <button id="next-btn" onclick="app.nextQuestion()" class="hidden w-full md:w-auto justify-center bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3.5 md:py-3 rounded-xl font-bold hover:opacity-90 transition-opacity flex items-center gap-2 shadow-lg">
                                ${qIndex === total - 1 ? 'Voir les résultats' : 'Question suivante'} <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            },

            selectAnswer(idx) {
                const q = this.quizState.questions[this.quizState.currentIndex];
                const isCorrect = (idx === q.correctAnswer);
                const isEval = this.state.quizMode === 'eval';

                if (isCorrect) this.quizState.score++;

                // Verrouiller les boutons
                document.querySelectorAll('[id^="opt-"]').forEach(btn => {
                    btn.onclick = null;
                    btn.classList.add('opacity-60', 'cursor-not-allowed', 'pointer-events-none');
                });

                const selectedBtn = document.getElementById(`opt-${idx}`);
                selectedBtn.classList.remove('opacity-60', 'hover:border-brand-400', 'hover:shadow-md');

                if (isEval) {
                    // Feedback neutre en mode éval
                    selectedBtn.classList.add('border-slate-800', 'dark:border-slate-200', 'border-2');
                    setTimeout(() => this.nextQuestion(), 600);
                } else {
                    // Feedback coloré en entraînement
                    if (isCorrect) {
                        selectedBtn.classList.add('border-brand-500', 'border-2', 'bg-brand-50', 'dark:bg-brand-900/20', 'text-brand-700', 'dark:text-brand-300');
                        this.gainXP(15); // Récompense XP
                    } else {
                        selectedBtn.classList.add('border-rose-500', 'border-2', 'bg-rose-50', 'dark:bg-rose-900/20', 'text-rose-700', 'dark:text-rose-300');
                        const correctBtn = document.getElementById(`opt-${q.correctAnswer}`);
                        correctBtn.classList.remove('opacity-60');
                        correctBtn.classList.add('border-brand-500', 'border-2', 'text-brand-600');
                    }

                    document.getElementById('explanation-box').classList.remove('hidden');
                    document.getElementById('next-btn').classList.remove('hidden');

                    // Scroll automatique vers l'explication sur mobile
                    setTimeout(() => {
                        document.getElementById('next-btn').scrollIntoView({ behavior: 'smooth', block: 'end' });
                    }, 100);
                }
            },

            nextQuestion() {
                this.quizState.currentIndex++;
                this.renderQuiz(document.getElementById('app-container'));
                this.refreshIcons();
                document.getElementById('main-scroll').scrollTo(0, 0);
            },

            renderQuizResults(container) {
                const total = this.quizState.questions.length;
                const score = this.quizState.score;
                const percentage = Math.round((score / total) * 100);

                // Sauvegarde du meilleur score
                const modId = this.state.currentModule;
                if (!this.state.user.history[modId]) this.state.user.history[modId] = { bestScore: 0 };
                if (percentage > this.state.user.history[modId].bestScore) {
                    this.state.user.history[modId].bestScore = percentage;
                }
                this.save();

                let message, color, icon;
                if (percentage >= 80) { message = "Excellent travail !"; color = "text-brand-500"; icon = "trophy"; }
                else if (percentage >= 50) { message = "Pas mal, encore un effort."; color = "text-amber-500"; icon = "award"; }
                else { message = "Il faut revoir ce chapitre."; color = "text-rose-500"; icon = "alert-circle"; }

                container.innerHTML = `
                    <div class="max-w-md mx-auto text-center animate-slide-up pt-8 md:pt-12 w-full">
                        <div class="w-20 h-20 md:w-24 md:h-24 mx-auto bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-6 shadow-inner">
                            <i data-lucide="${icon}" class="w-10 h-10 md:w-12 md:h-12 ${color}"></i>
                        </div>
                        <h2 class="text-2xl md:text-3xl font-black mb-2 text-slate-900 dark:text-white">Session Terminée</h2>
                        <p class="text-sm md:text-base text-slate-500 mb-8">${message}</p>
                        
                        <div class="bg-white dark:bg-dark-800 border border-slate-100 dark:border-slate-700 p-8 rounded-3xl mb-8 shadow-sm">
                            <div class="text-6xl md:text-7xl font-black ${color} mb-3">${percentage}%</div>
                            <div class="text-sm md:text-base font-bold text-slate-400 uppercase tracking-wider">${score} correctes sur ${total}</div>
                        </div>

                        <div class="flex flex-col gap-3">
                            <button onclick="${modId === 'global' ? 'app.startGlobalExam()' : `app.startQuiz('${this.state.quizMode}')`}" class="w-full py-3.5 md:py-3 bg-brand-500 text-white font-bold rounded-xl hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/30">Rejouer</button>
                            <button onclick="app.navigate(${modId === 'global' ? "'exam'" : "'moduleDetail'"})" class="w-full py-3.5 md:py-3 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                                ${modId === 'global' ? "Retour à l'évaluation" : "Retour au module"}
                            </button>
                        </div>
                    </div>
                `;
            },

            flashState: { cards: [], currentIndex: 0, isFlipped: false },

            renderFlashcards(container) {
                const mod = MOCK_DATA.modules.find(m => m.id === this.state.currentModule);
                this.flashState.cards = mod.flashcards;
                this.flashState.currentIndex = 0;
                this.flashState.isFlipped = false;

                if (!this.flashState.cards || this.flashState.cards.length === 0) {
                    return container.innerHTML = `
                        <div class="text-center pt-20">
                            <i data-lucide="folder-open" class="w-16 h-16 mx-auto text-slate-300 dark:text-slate-700 mb-4"></i>
                            <p class="font-bold text-slate-500">Aucune carte disponible pour ce module.</p>
                            <button onclick="app.navigate('moduleDetail')" class="mt-6 px-6 py-2 bg-brand-500 text-white rounded-lg font-bold">Retour</button>
                        </div>`;
                }
                this.updateFlashcardUI(container);
            },

            updateFlashcardUI(container) {
                const card = this.flashState.cards[this.flashState.currentIndex];
                const total = this.flashState.cards.length;
                const isFlipped = this.flashState.isFlipped;

                // On évite de recréer tout le DOM si on fait juste "Fliper" la carte pour la fluidité
                if (document.getElementById('flashcard-container')) {
                    const inner = document.getElementById('flashcard-inner');
                    const counter = document.getElementById('flash-counter');

                    if (isFlipped) inner.classList.add('rotate-y-180');
                    else inner.classList.remove('rotate-y-180');

                    counter.innerText = `${this.flashState.currentIndex + 1} / ${total}`;
                    document.getElementById('flash-front').innerText = card.front;
                    document.getElementById('flash-back').innerText = card.back;
                    return;
                }

                // Premier rendu
                container.innerHTML = `
                    <div id="flashcard-container" class="max-w-md mx-auto pt-4 md:pt-10 animate-fade-in flex flex-col items-center w-full h-full">
                        
                        <div class="w-full flex justify-between items-center mb-6 md:mb-10 px-2">
                            <button onclick="app.navigate('moduleDetail')" class="text-slate-500 p-2 bg-slate-200 dark:bg-slate-800 rounded-full hover:text-slate-900 dark:hover:text-white transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                            <span id="flash-counter" class="font-bold text-sm text-slate-400 bg-slate-100 dark:bg-slate-800 px-4 py-1.5 rounded-full">${this.flashState.currentIndex + 1} / ${total}</span>
                        </div>

                        <!-- Espace 3D adaptatif -->
                        <div class="w-full aspect-[4/5] sm:aspect-square perspective-1000 cursor-pointer mb-8" onclick="app.flipCard()">
                            <div id="flashcard-inner" class="relative w-full h-full transform-style-3d shadow-xl rounded-3xl md:rounded-[2.5rem]">
                                <!-- Recto (Blanc/Gris) -->
                                <div class="absolute inset-0 backface-hidden bg-white dark:bg-dark-800 rounded-3xl md:rounded-[2.5rem] border-2 border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center p-6 md:p-10 text-center shadow-sm">
                                    <div class="text-xs font-bold text-brand-500 mb-auto uppercase tracking-widest bg-brand-50 dark:bg-brand-900/30 px-3 py-1 rounded-full">Terme</div>
                                    <h3 id="flash-front" class="text-2xl md:text-3xl font-black text-slate-800 dark:text-white leading-tight my-auto break-words">${card.front}</h3>
                                    <div class="mt-auto text-slate-400 text-xs font-medium flex items-center gap-2"><i data-lucide="rotate-cw" class="w-4 h-4"></i> Taper pour retourner</div>
                                </div>
                                <!-- Verso (Couleur Marque) -->
                                <div class="absolute inset-0 backface-hidden bg-gradient-to-br from-brand-500 to-brand-600 text-white rounded-3xl md:rounded-[2.5rem] rotate-y-180 flex flex-col items-center justify-center p-6 md:p-10 text-center shadow-lg">
                                    <div class="text-xs font-bold text-brand-100 mb-auto uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">Définition</div>
                                    <p id="flash-back" class="text-lg md:text-xl font-medium leading-relaxed my-auto drop-shadow-md break-words">${card.back}</p>
                                    <div class="mt-auto text-brand-200 text-xs font-medium flex items-center gap-2"><i data-lucide="rotate-cw" class="w-4 h-4"></i> Taper pour retourner</div>
                                </div>
                            </div>
                        </div>

                        <!-- Boutons de contrôle -->
                        <div class="flex gap-3 md:gap-4 w-full">
                            <button onclick="app.prevCard()" class="flex-1 py-4 md:py-5 bg-white dark:bg-dark-800 border border-slate-200 dark:border-slate-700 rounded-2xl font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm active:scale-[0.98]"><i data-lucide="arrow-left" class="mx-auto"></i></button>
                            <button onclick="app.nextCard()" class="flex-[2] py-4 md:py-5 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-2xl font-bold hover:opacity-90 transition-opacity shadow-lg active:scale-[0.98]">Carte Suivante</button>
                        </div>
                    </div>
                `;
                this.refreshIcons();
            },

            flipCard() {
                this.flashState.isFlipped = !this.flashState.isFlipped;
                this.updateFlashcardUI();
            },

            nextCard() {
                if (this.flashState.currentIndex < this.flashState.cards.length - 1) {
                    this.flashState.currentIndex++;
                    this.flashState.isFlipped = false;
                    this.updateFlashcardUI();
                } else {
                    this.showToast("Terminé", "Vous avez vu toutes les cartes !");
                    this.navigate('moduleDetail');
                }
            },

            prevCard() {
                if (this.flashState.currentIndex > 0) {
                    this.flashState.currentIndex--;
                    this.flashState.isFlipped = false;
                    this.updateFlashcardUI();
                }
            },

            gainXP(amount) {
                this.state.user.xp += amount;
                const requiredXP = this.state.user.level * 100;
                if (this.state.user.xp >= requiredXP) {
                    this.state.user.level++;
                    this.state.user.xp -= requiredXP;
                    this.showToast("Niveau Supérieur ! 🚀", `Félicitations, niveau ${this.state.user.level} atteint.`);
                }
                this.save();
            },

            renderExam(container) {
                container.innerHTML = `
                    <div class="text-center pt-10 md:pt-20 animate-slide-up px-4 w-full">
                        <div class="w-20 h-20 mx-auto bg-brand-50 dark:bg-brand-900/30 rounded-full flex items-center justify-center mb-6 shadow-inner">
                            <i data-lucide="flame" class="w-10 h-10 text-brand-500"></i>
                        </div>
                        <h2 class="text-2xl md:text-3xl font-bold mb-3 text-slate-900 dark:text-white">Examen Global Premium</h2>
                        <p class="text-sm md:text-base text-slate-500 max-w-md mx-auto mb-8 leading-relaxed">Prêt à tester vos connaissances sur l'ensemble du programme ? Ce mode tire des questions au hasard parmi tous vos modules pour simuler un véritable examen (20 questions).</p>
                        <div class="flex flex-col sm:flex-row gap-4 justify-center">
                            <button onclick="app.startGlobalExam()" class="bg-brand-500 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg hover:bg-brand-600 transition-colors">Démarrer le test</button>
                        </div>
                    </div>
                `;
            },

            startGlobalExam() {
                let allQuestions = [];
                // Récupération de toutes les questions depuis tous les modules
                MOCK_DATA.modules.forEach(m => {
                    if (m.questions && m.questions.length > 0) {
                        allQuestions = allQuestions.concat(m.questions);
                    }
                });

                if (allQuestions.length === 0) {
                    this.showToast("Erreur", "Aucune question disponible dans la base.");
                    return;
                }

                this.state.quizMode = 'eval';
                this.state.currentModule = 'global';

                // Mélange aléatoire de toute la base et sélection de 20 questions
                this.quizState.questions = allQuestions.sort(() => Math.random() - 0.5).slice(0, 20);
                this.quizState.currentIndex = 0;
                this.quizState.score = 0;

                this.navigate('quiz');
            }
        };

        // Lancement de l'application
        window.addEventListener('DOMContentLoaded', () => app.init());

    </script>
</body>

</html>
